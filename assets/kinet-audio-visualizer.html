<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KinetRig — Radial Waveform & Audio Reactive Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
:root {
  --primary: #00F5FF;
  --accent: #FF0055;
  --gold: #F59E0B;
  --bg: #030712;
}
html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  overflow: hidden;
  user-select: none;
}
#stage {
  position: fixed; left: 50%; top: 50%;
  width: 1920px; height: 1080px;
  transform: translate(-50%, -50%) scale(1);
  background: radial-gradient(circle at 50% 50%, #081a2e 0%, #030712 80%);
  overflow: hidden;
}

/* Background Cyber Grid */
.grid-bg {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(0,245,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,255,0.04) 1px, transparent 1px);
  background-size: 80px 80px;
  background-position: center center;
}
.glow-orb {
  position: absolute;
  left: 50%; top: 50%;
  width: 700px; height: 700px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(0,245,255,0.18) 0%, rgba(255,0,85,0.08) 50%, transparent 75%);
  filter: blur(40px);
  pointer-events: none;
}

/* Central Visualizer Core */
.visualizer-container {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 750px; height: 750px;
  display: flex; align-items: center; justify-content: center;
}
svg#radialSvg {
  width: 100%; height: 100%;
  overflow: visible;
  filter: drop-shadow(0 0 25px rgba(0,245,255,0.45));
}
.center-capsule {
  position: absolute;
  width: 290px; height: 290px;
  border-radius: 50%;
  background: rgba(11, 15, 25, 0.92);
  border: 2px solid rgba(0, 245, 255, 0.4);
  backdrop-filter: blur(20px);
  box-shadow: 0 0 50px rgba(0,245,255,0.25), inset 0 0 30px rgba(0,245,255,0.15);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 24px;
}
.core-pulse-ring {
  position: absolute;
  width: 320px; height: 320px;
  border-radius: 50%;
  border: 1px dashed rgba(255, 0, 85, 0.5);
  animation: rotateRing 30s linear infinite;
}
@keyframes rotateRing { to { transform: rotate(360deg); } }

.track-artist {
  font-family: 'Space Grotesk', monospace;
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--primary);
  margin-bottom: 6px;
}
.track-title {
  font-size: 26px; font-weight: 900;
  letter-spacing: -0.02em; text-transform: uppercase;
  color: #fff; line-height: 1.1;
  margin-bottom: 12px;
}
.track-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 9999px;
  background: rgba(255,0,85,0.15);
  border: 1px solid rgba(255,0,85,0.4);
  font-family: 'Space Grotesk', monospace;
  font-size: 11px; font-weight: 700; color: #FF4D79;
}

/* Oscilloscope Floor */
.oscilloscope-track {
  position: absolute;
  bottom: 120px; left: 50%;
  transform: translateX(-50%);
  width: 1100px; height: 80px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px;
}
.osc-bar {
  flex: 1; height: 6px;
  background: linear-gradient(to top, rgba(0,245,255,0.3), var(--primary));
  border-radius: 9999px;
  transform-origin: bottom center;
  will-change: transform;
}

/* TOP-BAR & DROPDOWN */
.top-bar {
  position: fixed; top: 20px; right: 24px;
  display: flex; align-items: center; gap: 10px;
  z-index: 100;
}
.btn-action {
  height: 38px; padding: 0 16px;
  border-radius: 9999px;
  background: rgba(9, 9, 14, 0.85);
  border: 1px solid rgba(0, 245, 255, 0.35);
  color: #fff; font-family: inherit;
  font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px;
  cursor: pointer; backdrop-filter: blur(12px);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.btn-action:hover {
  background: rgba(0, 245, 255, 0.25);
  border-color: var(--primary);
  transform: translateY(-1px);
}
.export-dropdown { position: relative; }
.fps-menu {
  display: none; position: absolute; top: calc(100% + 8px); right: 0;
  background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(0, 245, 255, 0.35);
  border-radius: 12px; backdrop-filter: blur(16px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 20px rgba(0,245,255,0.15);
  padding: 6px; min-width: 175px; z-index: 120; flex-direction: column; gap: 3px;
}
.fps-menu.open { display: flex; }
.fps-item {
  background: transparent; border: none; color: #E2E8F0;
  font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 8px 10px; border-radius: 8px; text-align: left; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  transition: all 0.15s ease; width: 100%; box-sizing: border-box;
}
.fps-item:hover {
  background: rgba(0, 245, 255, 0.2); color: var(--primary); transform: translateX(2px);
}
.fps-item.danger:hover {
  background: rgba(239, 68, 68, 0.2); color: #F87171;
}

/* HUD SCRUBBER */
#ui {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px;
  background: rgba(9, 9, 14, 0.9);
  padding: 8px 18px; border-radius: 9999px;
  border: 1px solid rgba(0, 245, 255, 0.35);
  backdrop-filter: blur(16px); z-index: 90;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}
#ui button {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  color: #fff; font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 6px 14px; border-radius: 9999px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
#ui button:hover { background: rgba(0,245,255,0.25); border-color: var(--primary); }
#scrub { width: 340px; height: 6px; accent-color: var(--primary); cursor: pointer; }
#clock { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 50px; text-align: right; }

body.clean-capture .top-bar,
body.clean-capture #ui { display: none !important; }
</style>
</head>
<body>

<div class="top-bar">
  <button class="btn-action" id="btn-hud">
    <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    HUD (H)
  </button>
  <div class="export-dropdown">
    <button class="btn-action" id="btn-export">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="19" x2="12" y2="5"/></svg>
      <span id="btn-export-text" style="display:inline-flex;align-items:center;gap:4px;">Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240</span>
      <svg style="width:11px;height:11px;stroke:currentColor;stroke-width:2.5;fill:none;margin-left:2px;" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="fps-menu" id="fps-menu">
      <div id="fps-options-group">
        <div style="font-size: 10px; color: #64748B; font-weight: 700; text-transform: uppercase; padding: 4px 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 4px;">Choose Framerate</div>
        <button class="fps-item" data-fps="240"><span>240 FPS (Studio)</span><span style="font-size:10px;color:var(--primary);background:rgba(0,245,255,0.15);padding:2px 6px;border-radius:4px;">True HFR</span></button>
        <button class="fps-item" data-fps="144"><span>144 FPS</span></button>
        <button class="fps-item" data-fps="120"><span>120 FPS</span></button>
        <button class="fps-item" data-fps="60"><span>60 FPS (Fast)</span></button>
      </div>
      <div id="render-controls-group" style="display: none;">
        <div style="font-size: 10px; color: #64748B; font-weight: 700; text-transform: uppercase; padding: 4px 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 4px;">Render Controls</div>
        <button class="fps-item" id="btn-render-pause">
          <svg id="icon-pause" viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          <svg id="icon-resume" viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:currentColor;stroke-width:1;display:none;"><polygon points="6 4 20 12 6 20 6 4"/></svg>
          <span id="label-render-pause">Pause Render</span>
        </button>
        <button class="fps-item danger" id="btn-render-cancel" style="color: #f87171;">
          <svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span>Cancel Render</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="stage">
    <div class="grid-bg"></div>
    <div class="glow-orb" id="glowOrb"></div>

    <div class="visualizer-container">
      <svg id="radialSvg" viewBox="-350 -350 700 700"></svg>
      <div class="core-pulse-ring" id="pulseRing"></div>
      <div class="center-capsule" id="centerCapsule">
        <div class="track-artist">NEO SYNTHETIC</div>
        <div class="track-title">FREQUENCY MATRIX</div>
        <div class="track-badge">
          <span style="width:6px;height:6px;border-radius:50%;background:#FF0055;"></span>
          144-240 FPS VISUALIZER
        </div>
      </div>
    </div>

    <div class="oscilloscope-track" id="oscTrack"></div>
  </div>

<div id="ui">
  <button id="btn-play">Pause</button>
  <button id="btn-audio" title="Mute/Unmute Audio (M)">
    <svg id="icon-audio-on" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <svg id="icon-audio-off" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  </button>
  <input type="range" id="scrub" min="0" max="1000" value="0">
  <span id="clock">0.00s</span>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const Q = new URLSearchParams(location.search);
let isRecording = false;
if (location.search.includes('clean') || Q.has('clean')) { document.body.classList.add('clean-capture', 'clean-mode'); }

const DURATION = 8.0;
const tl = gsap.timeline({ paused: true });

/* ============ FRESH ON-DEMAND SFX ============ */
const SFX_CDN_BASE = 'https://raw.githubusercontent.com/wyzowl/sfx-kit/main';
const STUDIO_SFX = {
  bass_long: 'sounds/booms-and-bass/bass-808-long.wav',
  tone_step1: 'sounds/tones/tone-step-1.wav',
  tone_step3: 'sounds/tones/tone-step-3.wav',
  metal_hit: 'sounds/cinematic-hits/cinematic-metal-big.wav',
  whoosh_slow: 'sounds/whooshes/whoosh-slow-hard.wav'
};

const sfxRawBuffers = {};
const sfxAudioBuffers = {};

async function fetchSfxArrayBuffer(rel) {
  const isHttp = typeof location !== 'undefined' && location.protocol ? location.protocol.startsWith('http') : false;
  if (!isHttp && typeof navigator !== 'undefined' && navigator.onLine === false) return null;
  const tryUrls = isHttp
    ? ['../sfx/' + rel, '../../sfx/' + rel, 'sfx/' + rel, `${SFX_CDN_BASE}/${rel}`]
    : [`${SFX_CDN_BASE}/${rel}`];
  for (const u of tryUrls) {
    try {
      const res = await fetch(u);
      if (res.ok) return await res.arrayBuffer();
    } catch (e) {}
  }
  return null;
}

for (const [id, rel] of Object.entries(STUDIO_SFX)) {
  fetchSfxArrayBuffer(rel).then(ab => {
    if (ab) {
      sfxRawBuffers[id] = ab;
      if (audioCtx) {
        audioCtx.decodeAudioData(ab.slice(0)).then(decoded => {
          sfxAudioBuffers[id] = decoded;
        }).catch(() => {});
      }
    }
  });
}

/* ============ AUDIO ROUTING ============ */
let audioCtx = null, audioDest = null, mainMasterGain = null;
let isAudioMuted = false, hasUserInteracted = false;

function toggleAudio() {
  isAudioMuted = !isAudioMuted;
  $('#icon-audio-on').style.display = isAudioMuted ? 'none' : 'block';
  $('#icon-audio-off').style.display = isAudioMuted ? 'block' : 'none';
  $('#btn-audio').classList.toggle('muted', isAudioMuted);
  if (mainMasterGain && audioCtx) {
    mainMasterGain.gain.setValueAtTime(isAudioMuted ? 0 : 1, audioCtx.currentTime);
  }
}
$('#btn-audio').onclick = toggleAudio;

const hasBrowserGesture = () => (typeof navigator === 'undefined' || !navigator.userActivation || navigator.userActivation.hasBeenActive);
function markUserInteracted() {
  if (!hasBrowserGesture()) return;
  hasUserInteracted = true;
  initAudio();
}
window.addEventListener('pointerdown', markUserInteracted, { capture: true });
window.addEventListener('click', markUserInteracted, { capture: true });
window.addEventListener('keydown', markUserInteracted, { capture: true });
window.addEventListener('message', e => {
  if (e.data === 'UNLOCK_AUDIO' || e.data?.type === 'UNLOCK_AUDIO') {
    markUserInteracted();
  }
});

function initAudio() {
  if (!hasUserInteracted || !hasBrowserGesture()) return null;
  if (!audioCtx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      audioCtx = new AudioCtx();
      mainMasterGain = audioCtx.createGain();
      mainMasterGain.gain.value = isAudioMuted ? 0 : 1;
      mainMasterGain.connect(audioCtx.destination);
      try {
        audioDest = audioCtx.createMediaStreamDestination();
        mainMasterGain.connect(audioDest);
      } catch (e) {}

      // Layer 1: Ambient room bed (Sub Synth Drone 50Hz at -24dB)
      try {
        const droneOsc = audioCtx.createOscillator();
        const droneFilter = audioCtx.createBiquadFilter();
        const ambientGain = audioCtx.createGain();
        droneOsc.type = 'sawtooth';
        droneOsc.frequency.setValueAtTime(50, audioCtx.currentTime);
        droneFilter.type = 'lowpass';
        droneFilter.frequency.setValueAtTime(130, audioCtx.currentTime);
        ambientGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        droneOsc.connect(droneFilter);
        droneFilter.connect(ambientGain);
        ambientGain.connect(mainMasterGain);
        droneOsc.start();
      } catch (err) {}
    }
  }
  if (audioCtx) {
    if (hasUserInteracted && audioCtx.state === 'suspended') audioCtx.resume();
    for (const [id, ab] of Object.entries(sfxRawBuffers)) {
      if (!sfxAudioBuffers[id]) {
        audioCtx.decodeAudioData(ab.slice(0)).then(dec => { sfxAudioBuffers[id] = dec; }).catch(() => {});
      }
    }
  }
  return audioCtx;
}

function triggerSfx(id, fallbackFn, gain = 0.5) {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running' || isAudioMuted) return;
  if (sfxAudioBuffers[id]) {
    try {
      const src = ctx.createBufferSource();
      src.buffer = sfxAudioBuffers[id];
      const g = ctx.createGain();
      g.gain.setValueAtTime(gain, ctx.currentTime);
      src.connect(g);
      g.connect(mainMasterGain || ctx.destination);
      src.start();
      return;
    } catch (e) {}
  }
  if (fallbackFn) fallbackFn(ctx, gain);
}

const fallbackBass = (ctx, gVal) => {
  const osc = ctx.createOscillator(), g = ctx.createGain(), now = ctx.currentTime;
  osc.type = 'sine'; osc.frequency.setValueAtTime(140, now);
  osc.frequency.exponentialRampToValueAtTime(32, now + 0.6);
  g.gain.setValueAtTime(gVal * 0.8, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.65);
  osc.connect(g); g.connect(mainMasterGain || ctx.destination);
  osc.start(now); osc.stop(now + 0.7);
};

/* ============ PROCEDURAL VISUALIZER MESH SETUP ============ */
const NUM_RADIAL_BARS = 64;
const radialSvg = $('#radialSvg');
const radialBars = [];

for (let i = 0; i < NUM_RADIAL_BARS; i++) {
  const angle = (i / NUM_RADIAL_BARS) * Math.PI * 2;
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  const innerR = 160;
  const outerR = 210;
  line.setAttribute('x1', Math.cos(angle) * innerR);
  line.setAttribute('y1', Math.sin(angle) * innerR);
  line.setAttribute('x2', Math.cos(angle) * outerR);
  line.setAttribute('y2', Math.sin(angle) * outerR);
  line.setAttribute('stroke', i % 4 === 0 ? '#FF0055' : '#00F5FF');
  line.setAttribute('stroke-width', '4');
  line.setAttribute('stroke-linecap', 'round');
  radialSvg.appendChild(line);
  radialBars.push({ el: line, angle, innerR, baseOuter: outerR });
}

const oscTrack = $('#oscTrack');
const NUM_OSC_BARS = 48;
const oscBars = [];
for (let i = 0; i < NUM_OSC_BARS; i++) {
  const b = document.createElement('div');
  b.className = 'osc-bar';
  oscTrack.appendChild(b);
  oscBars.push(b);
}

/* ============ STAGE FIT ============ */
const stage = $('#stage');
const fit = () => {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
};
addEventListener('resize', fit);
fit();

/* ============ DETERMINISTIC TIMELINE CHOREOGRAPHY ============ */
tl.set('#centerCapsule', { scale: 0.85, opacity: 0 }, 0);
tl.set('#pulseRing', { scale: 0.8, opacity: 0 }, 0);

// Intro Drop
tl.to('#centerCapsule', { scale: 1, opacity: 1, duration: 1.2, ease: 'back.out(2)' }, 0.1);
tl.to('#pulseRing', { scale: 1, opacity: 1, duration: 1.2, ease: 'power2.out' }, 0.1);
tl.call(() => triggerSfx('bass_long', fallbackBass, 0.8), null, 0.2);

// Periodic Bass Drops & Melodic Steps
[1.8, 3.6, 5.4].forEach((tBeat, idx) => {
  tl.call(() => triggerSfx('bass_long', fallbackBass, 0.75), null, tBeat);
  tl.call(() => triggerSfx(idx % 2 === 0 ? 'tone_step1' : 'tone_step3', null, 0.5), null, tBeat + 0.3);
  tl.to('#centerCapsule', { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1, ease: 'power2.out' }, tBeat);
  tl.to('#pulseRing', { scale: 1.25, opacity: 1, duration: 0.4, ease: 'power3.out' }, tBeat);
  tl.to('#pulseRing', { scale: 1, opacity: 0.5, duration: 0.5, ease: 'power2.in' }, tBeat + 0.4);
});

// Final Cymbal & Metal Resonance
tl.call(() => triggerSfx('metal_hit', fallbackBass, 0.7), null, 6.8);
tl.call(() => triggerSfx('whoosh_slow', null, 0.4), null, 7.0);

/* ============ DETERMINISTIC FRAME LOOP (Zero Math.random) ============ */
const clock = $('#clock'), scrub = $('#scrub'), btnPlay = $('#btn-play');
let scrubbing = false;

(function frame() {
  requestAnimationFrame(frame);
  const t = tl.time();
  const curDisplay = Math.min(t, DURATION);
  if (clock) clock.textContent = curDisplay.toFixed(2) + 's';
  if (!scrubbing && scrub) scrub.value = String((curDisplay / DURATION) * 1000);
  if (btnPlay) btnPlay.textContent = tl.paused() ? 'Play' : 'Pause';

  // Animate Radial Bars via Deterministic Sinusoidal Harmonics
  for (let i = 0; i < NUM_RADIAL_BARS; i++) {
    const bar = radialBars[i];
    const wave = Math.sin(t * 8 + i * 0.3) * 0.5 + 0.5;
    const beatKick = Math.exp(-((t % 1.8) * 4));
    const dynamicOuter = bar.innerR + 25 + wave * 65 + beatKick * 45;
    bar.el.setAttribute('x2', Math.cos(bar.angle) * dynamicOuter);
    bar.el.setAttribute('y2', Math.sin(bar.angle) * dynamicOuter);
  }

  // Animate Oscilloscope Track
  for (let i = 0; i < NUM_OSC_BARS; i++) {
    const scale = Math.sin(t * 12 + i * 0.25) * 0.5 + 0.5;
    const beatImpact = Math.exp(-((t % 1.8) * 3));
    oscBars[i].style.transform = `scaleY(${1 + scale * 8 + beatImpact * 6})`;
  }

  if (!isRecording && !location.search.includes('clean') && (t >= DURATION || tl.progress() >= 1)) {
    tl.pause(0);
    tl.play(0);
  }
})();

/* ============ AUDIO MANIFEST FOR HEADLESS RENDER ============ */
window.OPENER = {
  W: 1920, H: 1080, DURATION, tl, ready: false,
  audioManifest: {
    duration: DURATION,
    ambientBed: { type: 'sub_drone', baseFreq: 40, gain: 0.045 },
    events: [
      { time: 0.2, file: 'sounds/booms-and-bass/bass-808-long.wav', sfx_id: 'bass-808-long', gain: 0.8 },
      { time: 1.8, file: 'sounds/booms-and-bass/bass-808-long.wav', sfx_id: 'bass-808-long', gain: 0.75 },
      { time: 2.1, file: 'sounds/tones/tone-step-1.wav', sfx_id: 'tone-step-1', gain: 0.5 },
      { time: 3.6, file: 'sounds/booms-and-bass/bass-808-long.wav', sfx_id: 'bass-808-long', gain: 0.75 },
      { time: 3.9, file: 'sounds/tones/tone-step-3.wav', sfx_id: 'tone-step-3', gain: 0.5 },
      { time: 5.4, file: 'sounds/booms-and-bass/bass-808-long.wav', sfx_id: 'bass-808-long', gain: 0.75 },
      { time: 6.8, file: 'sounds/cinematic-hits/cinematic-metal-big.wav', sfx_id: 'cinematic-metal-big', gain: 0.7 },
      { time: 7.0, file: 'sounds/whooshes/whoosh-slow-hard.wav', sfx_id: 'whoosh-slow-hard', gain: 0.4 }
    ]
  },
  seek(t) {
    tl.pause();
    tl.time(t, false);
    if (window.gsap && gsap.ticker && gsap.ticker.tick) gsap.ticker.tick();
  },
  play() { tl.play(0); initAudio(); }
};

const toggle = () => {
  if (tl.paused() || tl.progress() >= 1) {
    if (tl.progress() >= 1) tl.progress(0);
    initAudio();
    tl.play();
    if (btnPlay) btnPlay.textContent = 'Pause';
  } else {
    tl.pause();
    if (btnPlay) btnPlay.textContent = 'Play';
  }
};
if (btnPlay) btnPlay.onclick = toggle;

if (scrub) {
  scrub.addEventListener('pointerdown', () => { scrubbing = true; tl.pause(); if (btnPlay) btnPlay.textContent = 'Play'; });
  addEventListener('pointerup', () => scrubbing = false);
  scrub.addEventListener('input', () => { tl.pause(); tl.time((scrub.value / 1000) * DURATION); });
}

const startPlayback = () => {
  window.OPENER.ready = true;
  if (!location.search.includes('clean')) {
    tl.play(0);
    if (btnPlay) btnPlay.textContent = 'Pause';
    tl.eventCallback('onComplete', () => {
      if (!isRecording && !location.search.includes('clean')) {
        tl.pause(0);
        tl.play(0);
      }
    });
  }
};

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(startPlayback).catch(startPlayback);
} else {
  startPlayback();
}

/* ============ TOP CONTROLS & EXPORT PIPELINE ============ */
const btnHud = $('#btn-hud'), ui = $('#ui');
if (btnHud && ui) {
  btnHud.onclick = () => ui.classList.toggle('hidden');
  window.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'h' && !['input','textarea'].includes(document.activeElement?.tagName?.toLowerCase())) {
      ui.classList.toggle('hidden');
    }
  });
}

const btnExport = $('#btn-export'), fpsMenu = $('#fps-menu');
const fpsOptionsGroup = $('#fps-options-group'), renderControlsGroup = $('#render-controls-group');
const btnExportText = $('#btn-export-text');
const btnRenderPause = $('#btn-render-pause'), btnRenderCancel = $('#btn-render-cancel');
const labelRenderPause = $('#label-render-pause');
const iconPause = $('#icon-pause'), iconResume = $('#icon-resume');

const EXPORT_DEFAULT_HTML = `Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240`;

/* ---- Studio Bridge discovery: same origin -> same host -> loopback ---- */
const BRIDGE_CANDIDATES = (() => {
  const out = [];
  try {
    const customUrl = localStorage.getItem('kinet_bridge_url');
    if (customUrl) out.push(customUrl.replace(/\/+$/, ''));
  } catch {}
  try {
    const q = new URLSearchParams(location.search).get('bridge');
    if (q) out.push(q.replace(/\/+$/, ''));
  } catch {}
  const p = location.protocol, host = location.hostname, org = location.origin;
  if (p === 'http:' || p === 'https:') {
    if (org && org !== 'null') out.push(org);
    if (host) out.push('http://' + host + ':4004');
  }
  out.push('http://127.0.0.1:4004', 'http://localhost:4004');
  return out.filter((v, i) => out.indexOf(v) === i);
})();
let BRIDGE = 'http://127.0.0.1:4004';
try {
  const _s = JSON.parse(localStorage.getItem('kinet_settings') || '{}');
  if (_s.host && _s.port) BRIDGE = 'http://' + (_s.host === '0.0.0.0' ? '127.0.0.1' : _s.host) + ':' + _s.port;
  if (_s.defaultFps) {
    const _el = document.getElementById('btn-export-text');
    if (_el) _el.innerHTML = 'Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> ' + _s.defaultFps;
  }
} catch {}
window.addEventListener('message', e => {
  if (e.data?.type === 'UPDATE_SETTINGS') {
    if (e.data.bridgeUrl) BRIDGE = e.data.bridgeUrl;
    if (e.data.settings?.defaultFps) {
      const _el = document.getElementById('btn-export-text');
      if (_el && (typeof isExporting === 'undefined' || !isExporting)) {
        _el.innerHTML = 'Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> ' + e.data.settings.defaultFps;
      }
    }
  }
});
async function resolveBridge() {
  for (let pass = 0; pass < 2; pass++) {
    for (const base of BRIDGE_CANDIDATES) {
      try {
        const r = await fetch(base + '/api/health', { signal: AbortSignal.timeout(1500) });
        if (r.ok) { BRIDGE = base; return true; }
      } catch {}
    }
  }
  try {
    const endpoints = [
      'http://127.0.0.1/KinetRig/api/bridge.php',
      'http://localhost/KinetRig/api/bridge.php',
      ...(location.protocol.startsWith('http') && location.origin && location.origin !== 'null' && location.port !== '4004'
        ? [location.origin + '/api/bridge.php', location.origin + '/KinetRig/api/bridge.php']
        : [])
    ];
    for (const ep of endpoints) {
      try {
        const h = await fetch(ep, { signal: AbortSignal.timeout(4000) });
        if (h.ok) {
          const res = await h.json();
          if (res.ok) {
            BRIDGE = res.bridge || 'http://127.0.0.1:4004';
            return true;
          }
        }
      } catch {}
    }
  } catch {}
  return false;
}


let isExporting = false, abortController = null, sseSource = null;

if (btnExport && fpsMenu) {
  btnExport.onclick = e => {
    e.stopPropagation();
    fpsMenu.classList.toggle('open');
  };
  document.addEventListener('click', e => {
    if (fpsMenu && !fpsMenu.contains(e.target) && e.target !== btnExport) {
      fpsMenu.classList.remove('open');
    }
  });
}

function setExportingState(exporting) {
  isExporting = exporting;
  if (exporting) {
    fpsOptionsGroup.style.display = 'none';
    renderControlsGroup.style.display = 'block';
  } else {
    fpsOptionsGroup.style.display = 'block';
    renderControlsGroup.style.display = 'none';
    btnExportText.innerHTML = EXPORT_DEFAULT_HTML;
    if (sseSource) { sseSource.close(); sseSource = null; }
  }
}

if (fpsOptionsGroup) {
  fpsOptionsGroup.querySelectorAll('.fps-item').forEach(item => {
    item.onclick = e => {
      e.stopPropagation();
      fpsMenu.classList.remove('open');
      startExport(Number(item.dataset.fps) || 240);
    };
  });
}

if (btnRenderPause) {
  btnRenderPause.onclick = async e => {
    e.stopPropagation();
    const isPaused = labelRenderPause.textContent.includes('Resume');
    try {
      const endpoint = isPaused ? `${BRIDGE}/api/resume` : `${BRIDGE}/api/pause`;
      await fetch(endpoint);
      labelRenderPause.textContent = isPaused ? 'Pause Render' : 'Resume Render';
      iconPause.style.display = isPaused ? 'block' : 'none';
      iconResume.style.display = isPaused ? 'none' : 'block';
    } catch (err) {}
  };
}

if (btnRenderCancel) {
  btnRenderCancel.onclick = async e => {
    e.stopPropagation();
    try { await fetch(`${BRIDGE}/api/cancel`); } catch (err) {}
    if (abortController) abortController.abort();
    setExportingState(false);
    fpsMenu.classList.remove('open');
  };
}

async function startExport(targetFps) {
  if (isExporting) return;
  if (await resolveBridge()) {
    try {
      {
        setExportingState(true);
        btnExportText.textContent = `Rendering ${targetFps} FPS (0%)`;
        abortController = new AbortController();
        sseSource = new EventSource(`${BRIDGE}/api/progress`);
        sseSource.onmessage = ev => {
          try {
            const data = JSON.parse(ev.data);
            if (data.status === 'rendering') {
              btnExportText.textContent = `Rendering ${targetFps} FPS (${data.percent || 0}%)`;
            }
          } catch (err) {}
        };
        const templatePath = location.pathname.includes('assets/')
          ? location.pathname.substring(location.pathname.indexOf('assets/'))
          : 'assets/kinet-audio-visualizer.html';
        const renderUrl = `${BRIDGE}/api/render?template=${encodeURIComponent(templatePath)}&fps=${targetFps}`;
        const response = await fetch(renderUrl, { signal: abortController.signal });
        if (!response.ok) throw new Error('Studio render failed');
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `kinet-audio-visualizer_${targetFps}fps.mp4`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setExportingState(false);
        return;
      }
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.error('[Studio Bridge Render Error]', err);
      if (sseSource) { sseSource.close(); sseSource = null; }
      setExportingState(false);
      btnExportText.innerHTML = EXPORT_DEFAULT_HTML;
      alert(`[Ralat Render Studio Bridge]\n\n${err.message || 'Render terhenti.'}`);
      return;
    }
  }

  // Studio bridge offline: maklumkan pengguna untuk hidupkan bridge (tanpa screen-share)
  if (!window.__bridgeRetried && confirm(`[KinetRig Studio Bridge Diperlukan]\n\nEksport visual ${targetFps} FPS memerlukan Studio Bridge tempatan.\n\nLangkah mudah:\n1. Klik dua kali "start-studio.bat" dalam folder projek, ATAU\n2. Jalankan arahan di terminal: node scripts/server.mjs\n\nKlik OK untuk sambung semula selepas bridge dihidupkan.`)) {
    window.__bridgeRetried = true;
    if (await resolveBridge()) { window.__bridgeRetried = false; return startExport(targetFps); }
    window.__bridgeRetried = false;
    alert('Bridge belum dapat dikesan. Sila pastikan start-studio.bat telah dibuka.');
  }
  btnExportText.innerHTML = EXPORT_DEFAULT_HTML;
  setExportingState(false);
  isRecording = false;
  return;

  try {
    isRecording = true;
    document.body.classList.add('clean-capture');
    tl.pause(0);
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: targetFps, width: 1920, height: 1080 },
      audio: true
    });
    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
    const chunks = [];
    recorder.ondataavailable = ev => chunks.push(ev.data);
    recorder.onstop = () => {
      document.body.classList.remove('clean-capture');
      isRecording = false;
      const blob = new Blob(chunks, { type: 'video/webm' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `kinet-audio-visualizer_${targetFps}fps.webm`;
      a.click();
    };
    recorder.start();
    tl.play(0);
    setTimeout(() => { recorder.stop(); stream.getTracks().forEach(t => t.stop()); }, (DURATION + 0.3) * 1000);
  } catch (err) {
    document.body.classList.remove('clean-capture');
    isRecording = false;
  }
}
</script>
