<head>
<meta charset="utf-8">
<title>KinetRig — Theatre Stage (144 FPS)</title>
<!--
  Style 6: Cartoon Stage (references/cartoon-stage.md).
    - ONE STAGE PER SCENE sized to the frame; camera per stage, zoom 1.08–1.95, never wide.
    - Continuous motion within stage, CUT or SLIDE 96/72 px + blur <= 10 between scenes.
    - Joint rig: transform written manually via J() — DO NOT use GSAP transformOrigin/rotation on joints,
      DO NOT tween GSAP x/y on groups with translate (placement group != animated group).
    - Zero captions; text is strictly diegetic (signs, plaques). Flat bright palette, no paper/grain.
    - character(): vector body + simple vector head; swap to raster head (HEADS + IMG) when available.
    - Example: 2 stages, 12s, VO-ready. Adapt stage contents and choreography while preserving patterns.
  Autoplay + loop WITHOUT player; ?debug=1 scrub panel; ?clean=1 hold for export; voice: supply src to #vo.
-->
<style>
html,body{margin:0;height:100%;background:#1D303C;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:#F4EFE0}
#world{position:absolute;inset:0;will-change:filter}
.top-bar{position:fixed;top:20px;right:24px;display:flex;align-items:center;gap:10px;z-index:100}
.btn-action{background:rgba(29,48,60,.92);border:1px solid rgba(90,171,184,0.4);color:#FFF;font-family:system-ui,sans-serif;font-size:13px;font-weight:600;padding:8px 16px;border-radius:9999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 4px 20px rgba(0,0,0,.3);transition:all 0.18s cubic-bezier(0.16, 1, 0.3, 1)}
.btn-action:hover{border-color:#5AABB8;transform:translateY(-1px)}
.btn-action.active{background:rgba(90,171,184,0.22);border-color:#5AABB8;box-shadow:0 0 14px rgba(90,171,184,0.4)}
.btn-action svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none}

#dbg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 18px;border-radius:9999px;background:rgba(14,16,22,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(90,171,184,0.35);box-shadow:0 10px 30px rgba(0,0,0,.6);color:#cfd5e3;font:13px system-ui;z-index:90;transition:all 0.24s cubic-bezier(0.16, 1, 0.3, 1)}
#dbg.hidden{opacity:0;pointer-events:none;transform:translate(-50%, 14px)}
#dbg button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);color:#F8FAFC;font-family:inherit;font-size:12px;font-weight:600;padding:6px 14px;border-radius:9999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;outline:none;transition:all 0.18s cubic-bezier(0.16, 1, 0.3, 1)}
#dbg button:hover{background:rgba(90,171,184,0.22);border-color:#5AABB8;color:#FFF}
#dbg button#btn-audio{padding:6px 10px}
#dbg button.muted{opacity:0.6;color:#94A3B8}
#dbg input{width:340px;height:6px;accent-color:#5AABB8;border-radius:3px;cursor:pointer;background:rgba(255,255,255,0.18);outline:none}
#dbg span{font-variant-numeric:tabular-nums;min-width:52px;text-align:right;color:#E2E8F0;font-weight:600}

body.clean-capture .top-bar,body.clean-capture #dbg,body.clean-mode .top-bar,body.clean-mode #dbg{display:none!important;opacity:0!important;visibility:hidden!important}
body.clean-capture,body.clean-mode{cursor:none!important}

/* Export Dropdown & FPS Menu */
.export-dropdown { position: relative; }
.fps-menu {
  display: none; position: absolute; top: calc(100% + 8px); right: 0;
  background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(0, 245, 255, 0.35);
  border-radius: 12px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 20px rgba(0,245,255,0.15);
  padding: 6px; min-width: 175px; z-index: 120; flex-direction: column; gap: 3px;
}
.fps-menu.open { display: flex; }
.fps-item {
  background: transparent; border: none; color: #E2E8F0;
  font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 8px 10px; border-radius: 8px; text-align: left; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  transition: all 0.15s ease; width: 100%; box-sizing: border-box;
}
.fps-item:hover {
  background: rgba(0, 245, 255, 0.2); color: #00F5FF; transform: translateX(2px);
}
.fps-item.danger:hover {
  background: rgba(239, 68, 68, 0.2); color: #F87171;
}

</style>
</head>
<body>
<div class="top-bar">
  <button class="btn-action active" id="btn-hud" title="Toggle HUD (H)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>HUD (H)</span>
  </button>
    <div class="export-dropdown" style="position: relative;">
    <button class="btn-action" id="btn-export" title="Select Framerate & Export Video">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span id="btn-export-text" style="display:inline-flex;align-items:center;gap:4px;">Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240</span>
      <svg style="width:11px;height:11px;stroke:currentColor;stroke-width:2.5;fill:none;margin-left:2px;" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="fps-menu" id="fps-menu">
      <div id="fps-options-group">
        <div style="font-size: 10px; color: #64748B; font-weight: 700; text-transform: uppercase; padding: 4px 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 4px;">Choose Framerate</div>
        <button class="fps-item" data-fps="240"><span>240 FPS (Studio)</span><span style="font-size:10px;color:var(--primary, #00F5FF);background:rgba(0,245,255,0.15);padding:2px 6px;border-radius:4px;">True HFR</span></button>
        <button class="fps-item" data-fps="144"><span>144 FPS</span></button>
        <button class="fps-item" data-fps="120"><span>120 FPS</span></button>
        <button class="fps-item" data-fps="60"><span>60 FPS (Fast)</span></button>
      </div>
      <div id="render-controls-group" style="display: none;">
        <div style="font-size: 10px; color: #64748B; font-weight: 700; text-transform: uppercase; padding: 4px 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 4px;">Render Controls</div>
        <button class="fps-item" id="btn-render-pause">
          <svg id="icon-pause" viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          <svg id="icon-resume" viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:currentColor;stroke-width:1;display:none;"><polygon points="6 4 20 12 6 20 6 4"/></svg>
          <span id="label-render-pause">Pause Render</span>
        </button>
        <button class="fps-item danger" id="btn-render-cancel" style="color: #f87171;">
          <svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span>Cancel Render</span>
        </button>
      </div>
    </div>
  </div>
</div>
<div id="stage">
  <div id="world"><svg id="scene" width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0" font-family="system-ui,sans-serif"></svg></div>
  <!-- Theatrical Proscenium Curtains & Stage Lighting -->
  <div id="curtains" style="position:absolute;inset:0;pointer-events:none;z-index:20;display:flex;overflow:hidden;">
    <div id="curtainL" style="width:50%;height:100%;background:linear-gradient(90deg, #1A0B14 0%, #3B1224 40%, #5B1832 75%, #300C1B 100%);box-shadow:inset -10px 0 25px rgba(0,0,0,0.6), 15px 0 30px rgba(0,0,0,0.5);transform-origin:left center;"></div>
    <div id="curtainR" style="width:50%;height:100%;background:linear-gradient(270deg, #1A0B14 0%, #3B1224 40%, #5B1832 75%, #300C1B 100%);box-shadow:inset 10px 0 25px rgba(0,0,0,0.6), -15px 0 30px rgba(0,0,0,0.5);transform-origin:right center;"></div>
  </div>
</div>
<div id="dbg">
  <button id="dPlay">Pause</button>
  <button id="btn-audio" title="Mute/Unmute Audio (M)">
    <svg id="icon-audio-on" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <svg id="icon-audio-off" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  </button>
  <input id="dScrub" type="range" min="0" max="1000" value="0">
  <span id="dClock">0.00s</span>
</div>
<audio id="vo" src="" preload="auto"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
let isRecording = false;
const W=1920,H=1080,DUR=12,NS='http://www.w3.org/2000/svg',XL='http://www.w3.org/1999/xlink';
/* palet flat cerah — ganti dari tema, tapi tetap TANPA tekstur */
const C={cream:'#FFF3DC',white:'#FFFDF5',navy:'#345867',deep:'#172E3C',teal:'#237C80',mint:'#8DD3C3',blue:'#5AABB8',gold:'#F4BC52',
  coral:'#E0714F',rust:'#C86545',ink:'#263746',grass:'#B9CD8E',grass2:'#9DB874',sand:'#E6D5AC',sand2:'#D6BF8E',skin:'#CB895F',
  wall:'#EDE6D3',wall2:'#DCD3BE',metal:'#A9B5B3',steam:'#F7F4EA',skyA:'#BFDDE3',skyB:'#F6EFDD',hill:'#CFE0CC'};
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}addEventListener('resize',fit);fit();

/* ---------- penyusun bentuk ---------- */
const S=$('#scene');
function N(tag,a={},p=S){const n=document.createElementNS(NS,tag);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n;}
const G=(a={},p=S)=>N('g',a,p),R=(x,y,w,h,f,rx=0,p=S,a={})=>N('rect',{x,y,width:w,height:h,rx,fill:f,...a},p),
  CI=(cx,cy,r,f,p=S,a={})=>N('circle',{cx,cy,r,fill:f,...a},p),EL=(cx,cy,rx,ry,f,p=S,a={})=>N('ellipse',{cx,cy,rx,ry,fill:f,...a},p),
  PA=(d,f,p=S,a={})=>N('path',{d,fill:f||'none',...a},p),
  LN=(d,st,w,p=S,a={})=>N('path',{d,fill:'none',stroke:st,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',...a},p),
  TX=(x,y,t,size,f,p=S,a={})=>{const n=N('text',{x,y,'font-size':size,fill:f,'font-weight':700,'text-anchor':'middle',...a},p);n.textContent=t;return n;},
  IMG=(href,x,y,w,h,p=S,a={})=>{const n=N('image',{x,y,width:w,height:h,...a},p);n.setAttributeNS(XL,'href',href);n.setAttribute('href',href);return n;},
  shadow=(x,y,rx,p=S)=>EL(x,y,rx,16,C.deep,p,{opacity:.13}),
  sh=(hex,f)=>{const n=parseInt(hex.slice(1),16);const r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);};
/* SENDI: transform manual → sumbu putar = titik asal lokal (bukan bbox) */
function J(el,tx=0,ty=0){const j={el,tx,ty,x:0,y:0,r:0,sx:1,sy:1,apply(){el.setAttribute('transform',`translate(${j.tx+j.x},${j.ty+j.y}) rotate(${j.r}) scale(${j.sx},${j.sy})`);}};j.apply();return j;}
// Gradient defs for sky and automotive headlights
const defsS=N('defs',{},S);
const grad=N('linearGradient',{id:'skyG',x1:0,y1:0,x2:0,y2:1},defsS);
N('stop',{offset:0,'stop-color':C.skyA},grad);
N('stop',{offset:1,'stop-color':C.skyB},grad);
const hGrad=N('linearGradient',{id:'headlightGrad',x1:0,y1:0,x2:1,y2:0},defsS);
N('stop',{offset:'0%','stop-color':'#F4BC52','stop-opacity':0.85},hGrad);
N('stop',{offset:'100%','stop-color':'#F4BC52','stop-opacity':0},hGrad);

/* ---------- STAGES: One frame per scene with dedicated camera ---------- */
const scenes=[];
function scene(name){const g=G({'data-name':name},S);g.style.display='none';const sc={name,g,cam:{x:960,y:540,z:1.1,ox:0,oy:0},
  apply(){const c=sc.cam;g.setAttribute('transform',`translate(${960-(c.x+c.ox)*c.z},${540-(c.y+c.oy)*c.z}) scale(${c.z})`);}};sc.apply();scenes.push(sc);return sc;}
const skyOf=(p,y0=-1400,y1=1080)=>R(-600,y0,3200,y1-y0,'url(#skyG)',0,p);
const hillsOf=(p,b)=>PA(`M-600 ${b} L-200 ${b-140} L300 ${b-60} L800 ${b-200} L1300 ${b-90} L1800 ${b-180} L2500 ${b-70} L2500 1400 L-600 1400 Z`,C.hill,p);
const groundOf=(p,gy)=>{R(-600,gy+18,3200,600,C.sand,0,p);R(-600,gy,3200,26,C.grass2,0,p);R(-600,gy-6,3200,14,C.grass,0,p);};

/* ---------- CHARACTER: Rigged joints & Anatomical Lip-Sync Rig ---------- */
const VISEME_DEFS={
  rest: { isOpen:false, line:'M -14 -44 C -5 -36 5 -36 14 -44', cavity:'M -14 -44 C -5 -40 5 -40 14 -44 C 5 -40 -5 -40 -14 -44 Z' },
  MBP:  { isOpen:false, line:'M -14 -43 C -5 -43 5 -43 14 -43', cavity:'M -14 -43 C -5 -43 5 -43 14 -43 C 5 -43 -5 -43 -14 -43 Z' },
  A:    { isOpen:true,  cavity:'M -15 -46 C -6 -47 6 -47 15 -46 C 14 -28 -14 -28 -15 -46 Z', teethY:-46, teethScale:1, teethOpacity:1, tongueY:-32, tongueScale:1, tongueOpacity:1 },
  E:    { isOpen:true,  cavity:'M -16 -45 C -6 -46 6 -46 16 -45 C 15 -35 -15 -35 -16 -45 Z', teethY:-45, teethScale:1.15, teethOpacity:1, tongueY:-34, tongueScale:0.8, tongueOpacity:0.7 },
  O:    { isOpen:true,  cavity:'M -9 -48 C -3 -50 3 -50 9 -48 C 10 -32 -10 -32 -9 -48 Z', teethY:-48, teethScale:0.65, teethOpacity:0.8, tongueY:-36, tongueScale:0.7, tongueOpacity:0.9 },
  L:    { isOpen:true,  cavity:'M -14 -46 C -5 -47 5 -47 14 -46 C 13 -32 -13 -32 -14 -46 Z', teethY:-46, teethScale:0.9, teethOpacity:1, tongueY:-40, tongueScale:0.85, tongueOpacity:1 }
};
const HEADS={};
function character(p,x,ground,scale,{who='female',shirt=C.coral,pants=C.navy,shoes=C.white,hair='#22171E'}={}){
  const sd=shadow(x,ground+4,72*scale,p),place=G({transform:`translate(${x},${ground}) scale(${scale})`},p),rootEl=G({},place),root=J(rootEl),ref={root,place,who,scale,sd};
  for(const side of ['R','L']){const sx=side==='L'?-24:24,dk=side==='R'?.86:1;
    const tEl=G({},rootEl),thigh=J(tEl,sx,-214);R(-22,-10,44,118,sh(pants,dk),19,tEl);
    const sEl=G({},tEl),shin=J(sEl,0,102);R(-19,-8,38,108,sh(pants,dk),17,sEl);
    const fEl=G({},sEl),foot=J(fEl,0,96);
    PA('M -22 -10 L 14 -10 C 22 4 44 4 48 16 L 48 26 L -24 26 Z',sh(shoes,dk),fEl);
    R(-24,20,72,6,C.gold,2,fEl); // Gold sole accent
    ref[side+'thigh']=thigh;ref[side+'shin']=shin;ref[side+'foot']=foot;}
  const tEl=G({},rootEl),torso=J(tEl,0,-214);ref.torso=torso;
  const arm=(side,front)=>{const s=side==='L'?-1:1,aEl=G({},tEl),a=J(aEl,48*s,-126);R(-16,-16,32,98,front?shirt:sh(shirt,.86),15,aEl);
    const fEl=G({},aEl),f=J(fEl,0,78);R(-14,-12,28,90,front?C.skin:sh(C.skin,.9),14,fEl);const hEl=G({},fEl),h=J(hEl,0,74);EL(0,4,16,20,front?C.skin:sh(C.skin,.9),hEl);
    ref[side+'arm']=a;ref[side+'fore']=f;ref[side+'hand']=h;};
  arm('R',false);
  // Female tailored silhouette top
  PA('M -44 -152 C -60 -144 -66 -112 -62 -76 L -54 8 C -26 20 28 20 54 8 L 62 -76 C 66 -112 56 -144 42 -152 Z',shirt,tEl);
  PA('M 42 -146 C 58 -130 62 -100 58 -62 L 52 8 L 32 12 L 36 -140 Z',sh(shirt,.88),tEl);
  PA('M -20 -152 Q 0 -134 20 -152 Q 0 -144 -20 -152 Z',C.gold,tEl); // Gold collar accent
  R(-14,-178,28,40,C.skin,12,tEl);
  R(-52,-2,106,20,sh(shirt,.82),8,tEl);
  arm('L',true);
  const hEl=G({},tEl),head=J(hEl,0,-160);ref.head=head;ref.faces={};

  // Flowing ponytail behind head
  const ponyEl=G({},hEl),pony=J(ponyEl,32,-138);ref.ponytail=pony;
  CI(0,0,10,C.gold,ponyEl); // Hairband
  PA('M 0 -8 C 45 -25 95 -10 100 45 C 98 85 75 75 55 45 C 38 18 20 5 0 8 Z',hair,ponyEl);

  // Ears & gold earrings
  EL(-70,-70,12,18,C.skin,hEl);EL(70,-70,12,18,C.skin,hEl);
  CI(-70,-62,3.5,C.gold,hEl);CI(70,-62,3.5,C.gold,hEl);

  // Head base
  PA('M -72 -120 C -72 -176 72 -176 72 -120 L 72 -60 C 72 -4 -72 -4 -72 -60 Z',C.skin,hEl);

  // Rosy cheeks
  EL(-42,-56,11,6,C.coral,hEl,{opacity:.32});
  EL(42,-56,11,6,C.coral,hEl,{opacity:.32});

  // Front hair silhouette with modern bangs and tendrils
  PA('M -74 -95 C -78 -178 78 -178 74 -95 C 64 -115 42 -105 22 -124 C 0 -112 -38 -128 -74 -95 Z',hair,hEl);
  PA('M -74 -95 C -78 -65 -68 -45 -64 -35 C -62 -48 -66 -70 -66 -90 Z',hair,hEl);
  PA('M 74 -95 C 78 -65 68 -45 64 -35 C 62 -48 66 -70 66 -90 Z',hair,hEl);

  // Eyes with gentle eyelashes & specular sparkle
  const eyes=G({},hEl),ej=J(eyes,0,-84);ref.eyes=ej;
  CI(-28,0,6.5,C.ink,eyes);CI(28,0,6.5,C.ink,eyes);
  CI(-26,-2.5,2.2,C.white,eyes);CI(30,-2.5,2.2,C.white,eyes);
  LN('M -36 -4 L -24 0',C.ink,3.5,eyes);LN('M 36 -4 L 24 0',C.ink,3.5,eyes);

  // Curved eyebrows
  LN('M -40 -102 C -32 -110 -18 -110 -14 -105',C.ink,3.5,hEl);
  LN('M 14 -105 C 18 -110 32 -110 40 -102',C.ink,3.5,hEl);

  // Natural Anatomical Mouth Rig with Strict SVG ClipPath Containment (Anti-Protruding Tongue)
  let charMouthCount = (window._charMouthCount = (window._charMouthCount || 0) + 1);
  const clipId = `mouth-clip-${charMouthCount}`;
  const clipEl = N('clipPath', { id: clipId }, defsS);
  const mClipPath = PA(VISEME_DEFS.rest.cavity, '#fff', clipEl);

  const mg = G({ 'data-name': 'mouth' }, hEl);
  const mCavity = PA(VISEME_DEFS.rest.cavity, '#38131B', mg, { stroke: C.ink, 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0 });
  const innerG = G({ 'clip-path': `url(#${clipId})` }, mg);

let audioCtx = null, audioDest = null, ambientMaster = null;
let mainMasterGain = null;
const SFX_CDN_BASE = 'https://raw.githubusercontent.com/wyzowl/sfx-kit/main';
const STUDIO_SFX = {
  'click-snap-soft': 'sounds/interface/click-tap-soft.wav',
  'foley-card-touch': 'sounds/foley/foley-card-touch.wav',
  'digital-blip-clear': 'sounds/digital/digital-blip-clear.wav',
  'whoosh-medium-soft': 'sounds/whooshes/whoosh-medium-soft.wav',
  'impact-medium-firm': 'sounds/impacts/impact-medium-firm.wav',
  'riser-1s-soft': 'sounds/risers-and-fallers/riser-1s-soft.wav'
};
const sfxAudioBuffers = {};
const sfxRawBuffers = {};
let ambientStarted = false;

async function fetchSfxArrayBuffer(rel) {
  const isHttp = typeof location !== 'undefined' && location.protocol ? location.protocol.startsWith('http') : false;
  if (!isHttp && typeof navigator !== 'undefined' && navigator.onLine === false) return null;
  const tryUrls = isHttp
    ? [`../sfx/${rel}`, `sfx/${rel}`, `${SFX_CDN_BASE}/${rel}`]
    : [`${SFX_CDN_BASE}/${rel}`];
  for (const u of tryUrls) {
    try {
      const res = await fetch(u);
      if (res.ok) return await res.arrayBuffer();
    } catch (e) {}
  }
  return null;
}

for (const [id, rel] of Object.entries(STUDIO_SFX)) {
  fetchSfxArrayBuffer(rel).then(ab => {
    if (ab) {
      sfxRawBuffers[id] = ab;
      if (audioCtx) {
        audioCtx.decodeAudioData(ab.slice(0)).then(decoded => {
          sfxAudioBuffers[id] = decoded;
        }).catch(() => {});
      }
    }
  });
}

function startAmbientBed() {
  if (ambientStarted || !audioCtx || audioCtx.state !== 'running') return;
  ambientStarted = true;
  try {
    ambientMaster = audioCtx.createGain();
    ambientMaster.gain.setValueAtTime(0.045, audioCtx.currentTime);

    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(55, audioCtx.currentTime);

    const bufLen = Math.floor(audioCtx.sampleRate * 2);
    const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    let b0 = 0, b1 = 0;
    for (let i = 0; i < bufLen; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99 * b0 + white * 0.01;
      b1 = 0.95 * b1 + white * 0.05;
      data[i] = (b0 + b1) * 0.28;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(260, audioCtx.currentTime);

    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    osc.connect(oscGain);
    oscGain.connect(ambientMaster);

    noise.connect(filter);
    filter.connect(ambientMaster);

    ambientMaster.connect(mainMasterGain || audioCtx.destination);
    if (audioDest && !mainMasterGain) ambientMaster.connect(audioDest);

    osc.start();
    noise.start();
  } catch (e) {}
}

const initAudio = () => {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
      mainMasterGain = audioCtx.createGain();
      mainMasterGain.gain.value = isAudioMuted ? 0 : 1;
      mainMasterGain.connect(audioCtx.destination);
      try {
        audioDest = audioCtx.createMediaStreamDestination();
        mainMasterGain.connect(audioDest);
      } catch (e) {}
    }
  }
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    for (const [id, ab] of Object.entries(sfxRawBuffers)) {
      if (!sfxAudioBuffers[id]) {
        audioCtx.decodeAudioData(ab.slice(0)).then(decoded => {
          sfxAudioBuffers[id] = decoded;
        }).catch(() => {});
      }
    }
    startAmbientBed();
  }
  return audioCtx;
};
window.addEventListener('click', initAudio);
window.addEventListener('keydown', initAudio);
window.addEventListener('message', e => {
  if (e.data === 'UNLOCK_AUDIO' || (e.data && e.data.type === 'UNLOCK_AUDIO')) {

function triggerSfx(sfxId, fallbackFn, gain = 0.5) {
  const ctx = initAudio();
  if (ctx && sfxAudioBuffers[sfxId]) {
    try {
      const src = ctx.createBufferSource();
      src.buffer = sfxAudioBuffers[sfxId];
      const g = ctx.createGain();
      g.gain.setValueAtTime(gain, ctx.currentTime);
      src.connect(g);
      g.connect(mainMasterGain || ctx.destination);
      if (audioDest && !mainMasterGain) g.connect(audioDest);
      src.start();
      return;
    } catch (e) {}
  }
  if (typeof fallbackFn === 'function') fallbackFn();
}

function playClick() {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running') return;
  const now = ctx.currentTime;
  try {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(900, now);
    osc.frequency.exponentialRampToValueAtTime(300, now + 0.04);
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
    osc.connect(g); g.connect(mainMasterGain || ctx.destination);
    if (audioDest && !mainMasterGain) g.connect(audioDest);
    osc.start(now); osc.stop(now + 0.06);
  } catch (e) {}
}

function playFootstep(pitchMod = 1.0, surface = 'grass') {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running') return;
  const now = ctx.currentTime;
  try {
    // 1. Damped ground body (85Hz down to 28Hz)
    const osc = ctx.createOscillator();
    const gOsc = ctx.createGain();
    osc.type = 'sine';
    const baseF = surface === 'wood' ? 140 : 85;
    osc.frequency.setValueAtTime(baseF * pitchMod, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + 0.08);
    gOsc.gain.setValueAtTime(0.24, now);
    gOsc.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
    osc.connect(gOsc); gOsc.connect(mainMasterGain || ctx.destination);
    if (audioDest && !mainMasterGain) gOsc.connect(audioDest);
    osc.start(now); osc.stop(now + 0.10);

    // 2. Fibrous surface texture layer (filtered noise)
    const bufLen = Math.floor(ctx.sampleRate * 0.07);
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufLen);
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = surface === 'wood' ? 'bandpass' : 'lowpass';
    filter.frequency.setValueAtTime((surface === 'wood' ? 680 : 420) * pitchMod, now);
    const gNoise = ctx.createGain();
    gNoise.gain.setValueAtTime(surface === 'grass' ? 0.16 : 0.12, now);
    gNoise.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
    noise.connect(filter); filter.connect(gNoise); gNoise.connect(mainMasterGain || ctx.destination);
    if (audioDest && !mainMasterGain) gNoise.connect(audioDest);
    noise.start(now);
  } catch (e) {}
}

function playBlip() {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running') return;
  const now = ctx.currentTime;
  try {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1400, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);
    g.gain.setValueAtTime(0.22, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
    osc.connect(g); g.connect(mainMasterGain || ctx.destination);
    if (audioDest && !mainMasterGain) g.connect(audioDest);
    osc.start(now); osc.stop(now + 0.07);
  } catch (e) {}
}

function playImpact() {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running') return;
  const now = ctx.currentTime;
  try {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(36, now + 0.28);
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.30);
    osc.connect(g); g.connect(mainMasterGain || ctx.destination);
    if (audioDest && !mainMasterGain) g.connect(audioDest);
    osc.start(now); osc.stop(now + 0.32);
  } catch (e) {}
}

function playWhoosh() {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running') return;
  const now = ctx.currentTime;
  try {
    const bufLen = Math.floor(ctx.sampleRate * 0.45);
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) {
      const env = Math.sin((i / bufLen) * Math.PI);
      data[i] = (Math.random() * 2 - 1) * env * 1.2;
    }
    const node = ctx.createBufferSource();
    node.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(500, now);
    filter.frequency.exponentialRampToValueAtTime(1200, now + 0.22);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.22, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
    node.connect(filter); filter.connect(g); g.connect(mainMasterGain || ctx.destination);
    if (audioDest && !mainMasterGain) g.connect(audioDest);
    node.start(now);
  } catch (e) {}
}

var CLIPS = CLIPS || [];
function clip(el, o){ o = o || {}; el.muted = true; el.playsInline = true; el.preload = 'auto'; el.loop = false;
  try { el.pause(); } catch(e) {}
  var c = { el: el, at: o.at || 0, inT: o.in || 0, out: (o.out == null ? null : o.out), rate: o.rate || 1, hold: !!o.hold };
  (CLIPS = CLIPS || []).push(c); return c; }
function clipTime(c, t){ var end = c.out != null ? c.out : (isFinite(c.el.duration) ? c.el.duration : 1e9);
  var lt = (t - c.at) * c.rate; if (lt < 0) return null; var vt = c.inT + lt;
  if (vt > end - 1/120) { if (!c.hold) return null; vt = end - 1/60; } return vt; }
function syncClips(t, playing){ for (var i = 0; i < CLIPS.length; i++){ var c = CLIPS[i], v = c.el, vt = clipTime(c, t);
  if (vt === null) { if (!v.paused) v.pause(); continue; }
  if (playing) { if (v.playbackRate !== c.rate) v.playbackRate = c.rate; if (v.paused) v.play().catch(function(){});
    if (Math.abs(v.currentTime - vt) > .2) v.currentTime = vt; }
  else { if (!v.paused) v.pause(); if (Math.abs(v.currentTime - vt) > 1/90) v.currentTime = vt; } } }
function seekClips(t){ return Promise.all(CLIPS.map(function(c){ return new Promise(function(res){
  var v = c.el, vt = clipTime(c, t); try { v.pause(); } catch(e) {}
  if (vt === null) return res();
  var fin = function(){ requestAnimationFrame(function(){ requestAnimationFrame(res); }); };
  if (Math.abs(v.currentTime - vt) < 1/240 && v.readyState >= 2) return fin();
  var to = setTimeout(res, 4000);
  v.addEventListener('seeked', function h(){ v.removeEventListener('seeked', h); clearTimeout(to); fin(); });
  v.currentTime = vt; }); })); }
gsap.ticker.add(function(){ if (CLIPS.length) syncClips(window.OPENER.tl.time(), !window.OPENER.tl.paused()); });
window.OPENER.clipsReady = function(){ return CLIPS.every(function(c){ return c.el.readyState >= 2; }); };
window.OPENER.seekFrame = function(t){ window.OPENER.seek(t); return seekClips(t); };

/* ============ 240 FPS STUDIO BRIDGE & CLEAN VIDEO EXPORTER ============ */
const EXPORT_DEFAULT_HTML = 'Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240';
const btnExport = $('#btn-export');
const btnExportLabel = $('#btn-export-text');
const fpsMenu = $('#fps-menu');
const fpsOptionsGroup = $('#fps-options-group');
const renderControlsGroup = $('#render-controls-group');
const btnRenderPause = $('#btn-render-pause');
const btnRenderCancel = $('#btn-render-cancel');
const labelRenderPause = $('#label-render-pause');
const iconPause = $('#icon-pause');
const iconResume = $('#icon-resume');

let isExporting = false;
let isRenderPaused = false;
let currentAbortController = null;
let currentEvtSource = null;

function setExportUiState(exporting) {
  isExporting = exporting;
  if (fpsOptionsGroup && renderControlsGroup) {
    fpsOptionsGroup.style.display = exporting ? 'none' : 'block';
    renderControlsGroup.style.display = exporting ? 'block' : 'none';
  }
  if (!exporting) {
    isRenderPaused = false;
    updatePauseButtonUi(false);
  }
}

function updatePauseButtonUi(paused) {
  if (labelRenderPause) labelRenderPause.textContent = paused ? 'Resume Render' : 'Pause Render';
  if (iconPause) iconPause.style.display = paused ? 'none' : 'inline-block';
  if (iconResume) iconResume.style.display = paused ? 'inline-block' : 'none';
}

if (btnExport && fpsMenu) {
  btnExport.onclick = (e) => {
    e.stopPropagation();
    fpsMenu.classList.toggle('open');
  };

  document.addEventListener('click', (e) => {
    if (fpsMenu && !fpsMenu.contains(e.target) && e.target !== btnExport) {
      fpsMenu.classList.remove('open');
    }
  });

  if (fpsOptionsGroup) {
    const items = fpsOptionsGroup.querySelectorAll('.fps-item');
    items.forEach(item => {
      item.onclick = (e) => {
        e.stopPropagation();
        fpsMenu.classList.remove('open');
        const chosenFps = Number(item.dataset.fps) || 240;
        startExport(chosenFps);
      };
    });
  }

  if (btnRenderPause) {
    btnRenderPause.onclick = async (e) => {
      e.stopPropagation();
      fpsMenu.classList.remove('open');
      if (!isExporting) return;
      try {
        if (!isRenderPaused) {
          await fetch('http://127.0.0.1:4004/api/pause');
          isRenderPaused = true;
          updatePauseButtonUi(true);
          btnExportLabel.textContent = btnExportLabel.textContent.replace('Rendering', 'Paused');
        } else {
          await fetch('http://127.0.0.1:4004/api/resume');
          isRenderPaused = false;
          updatePauseButtonUi(false);
          btnExportLabel.textContent = btnExportLabel.textContent.replace('Paused', 'Rendering');
        }
      } catch (err) {
        console.warn('[Pause/Resume Error]', err);
      }
    };
  }

  if (btnRenderCancel) {
    btnRenderCancel.onclick = async (e) => {
      e.stopPropagation();
      fpsMenu.classList.remove('open');
      if (!isExporting) return;
      try {
        await fetch('http://127.0.0.1:4004/api/cancel');
      } catch {}
      if (currentEvtSource) {
        currentEvtSource.close();
        currentEvtSource = null;
      }
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }
      btnExportLabel.textContent = 'Cancelled';
      setTimeout(() => {
        btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
        setExportUiState(false);

async function startExport(targetFps = 240) {
  if (isExporting || isRecording) return;
  if (typeof markUserInteracted === 'function') markUserInteracted();

  // 1. Studio Local Bridge Attempt (Deterministic 60–240 FPS Headless Render)
  let bridgeAvailable = false;
  try {
    const healthRes = await fetch('http://127.0.0.1:4004/api/health', { signal: AbortSignal.timeout(800) });
    if (healthRes.ok) bridgeAvailable = true;
  } catch {}

  if (bridgeAvailable) {
    try {
      setExportUiState(true);
      currentAbortController = new AbortController();
      btnExportLabel.textContent = `Connecting Studio...`;

      try {
        currentEvtSource = new EventSource('http://127.0.0.1:4004/api/progress');
        currentEvtSource.onmessage = e => {
          try {
            const data = JSON.parse(e.data);
            if (data.status === 'rendering' && !isRenderPaused) {
              btnExportLabel.textContent = `Rendering ${data.percent || 0}% (${targetFps} FPS)`;
            } else if (data.status === 'paused') {
              btnExportLabel.textContent = `Paused ${data.percent || 0}% (${targetFps} FPS)`;
            }
          } catch {}
        };
      } catch {}

      const templatePath = location.pathname.includes('assets/')
        ? location.pathname.substring(location.pathname.indexOf('assets/'))
        : 'assets/kinet-stage.html';

      const renderRes = await fetch(`http://127.0.0.1:4004/api/render?template=${encodeURIComponent(templatePath)}&fps=${targetFps}`, {
        signal: currentAbortController.signal
      });
      if (currentEvtSource) { currentEvtSource.close(); currentEvtSource = null; }

      if (!renderRes.ok) throw new Error(await renderRes.text());

      btnExportLabel.textContent = 'Saving MP4...';
      const blob = await renderRes.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      const baseName = templatePath.split('/').pop().replace('.html', '');
      a.download = `${baseName}_${targetFps}fps.mp4`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);

      btnExportLabel.textContent = 'Downloaded!';
      setTimeout(() => {
        btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
        setExportUiState(false);
      }, 2000);
      return;
    } catch (bridgeErr) {
      if (bridgeErr.name === 'AbortError') {
        return; // User clicked Cancel Render
      }
      console.warn('[Studio Bridge Error, falling back to browser capture]', bridgeErr);
      if (currentEvtSource) { currentEvtSource.close(); currentEvtSource = null; }
      setExportUiState(false);
    }
  }

  // 2. Studio Bridge is offline:
  const isFileOrigin = typeof location !== 'undefined' && location.protocol === 'file:';
  if (isFileOrigin || !navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    alert(`[KinetRig Studio Bridge Offline]\n\nUntuk muat turun video ${targetFps} FPS MP4 secara automatik melalui pelayar, sila jalankan arahan ini dalam terminal:\n\nnode scripts/server.mjs\n\nKemudian klik semula Download, atau buka:\nhttp://127.0.0.1:4004`);
    btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
    setExportUiState(false);
    return;
  }

  // 3. Standalone In-Browser Clean Screen Recording
  try {
    isRecording = true;
    setExportUiState(true);
    btnExportLabel.textContent = `Recording ${targetFps} FPS...`;
    document.body.classList.add('clean-capture');

    if (typeof initAudio === 'function') initAudio();
    const captureAudio = typeof isAudioMuted !== 'undefined' ? !isAudioMuted : true;
    let stream;
    if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
      if (captureAudio) {
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
            audio: true, preferCurrentTab: true
          });
        } catch {
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
              preferCurrentTab: true
            });
          } catch (e) {
            document.body.classList.remove('clean-capture');
            btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
            isRecording = false; setExportUiState(false); return;
          }
        }
      } else {
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
            audio: false, preferCurrentTab: true
          });
        } catch {
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
              preferCurrentTab: true
            });
          } catch (e) {
            document.body.classList.remove('clean-capture');
            btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
            isRecording = false; setExportUiState(false); return;
          }
        }
      }
    } else {
      document.body.classList.remove('clean-capture');
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false; setExportUiState(false); return;
    }

    if (!stream) {
      document.body.classList.remove('clean-capture');
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false; setExportUiState(false); return;
    }

    const tracks = [...stream.getVideoTracks()];
    if (captureAudio) {
      if (typeof audioDest !== 'undefined' && audioDest && audioDest.stream && audioDest.stream.getAudioTracks().length > 0) {
        tracks.push(audioDest.stream.getAudioTracks()[0]);
      } else if (stream.getAudioTracks().length > 0) {
        tracks.push(stream.getAudioTracks()[0]);
      }
    } else {
      if (stream && stream.getAudioTracks) {
        stream.getAudioTracks().forEach(t => { try { t.stop(); stream.removeTrack(t); } catch(e){} });
      }
    }
    const combinedStream = new MediaStream(tracks);

    const mimeType = MediaRecorder.isTypeSupported('video/mp4; codecs="avc1.42E01E"')
      ? 'video/mp4; codecs="avc1.42E01E"'
      : (MediaRecorder.isTypeSupported('video/webm; codecs=vp9') ? 'video/webm; codecs=vp9' : 'video/webm');

    const recorder = new MediaRecorder(combinedStream, { mimeType, videoBitsPerSecond: 40000000 });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      document.body.classList.remove('clean-capture');
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(chunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const baseName = (location.pathname.split('/').pop() || 'kinet-stage.html').replace('.html', '');
      a.download = `${baseName}_${targetFps}fps.${ext}`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      if (stream && stream.getTracks) stream.getTracks().forEach(t => t.stop());
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false; setExportUiState(false);
      if (typeof tl !== 'undefined' && tl.play) tl.play();
    };

    if (typeof tl !== 'undefined' && tl.pause) {
      tl.pause(0);
      tl.play();
    }
    recorder.start(100);

    const durSeconds = typeof DURATION !== 'undefined' ? DURATION : (typeof DUR !== 'undefined' ? DUR : 8.0);
    setTimeout(() => {
      if (recorder.state === 'recording') recorder.stop();
    }, (durSeconds * 1000) + 400);

  } catch (err) {
    document.body.classList.remove('clean-capture');
    btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
    isRecording = false; setExportUiState(false);
  }
}
</script>
</body>
</html>
