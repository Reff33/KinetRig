<!doctype html>

<head>
<meta charset="utf-8">
<title>KinetRig — Theatre Stage (144 FPS)</title>
<!--
  Style 6: Cartoon Stage (references/cartoon-stage.md).
    - ONE STAGE PER SCENE sized to the frame; camera per stage, zoom 1.08–1.95, never wide.
    - Continuous motion within stage, CUT or SLIDE 96/72 px + blur <= 10 between scenes.
    - Joint rig: transform written manually via J() — DO NOT use GSAP transformOrigin/rotation on joints,
      DO NOT tween GSAP x/y on groups with translate (placement group != animated group).
    - Zero captions; text is strictly diegetic (signs, plaques). Flat bright palette, no paper/grain.
    - character(): vector body + simple vector head; swap to raster head (HEADS + IMG) when available.
    - Example: 2 stages, 12s, VO-ready. Adapt stage contents and choreography while preserving patterns.
  Autoplay + loop WITHOUT player; ?debug=1 scrub panel; ?clean=1 hold for export; voice: supply src to #vo.
-->
<style>
html,body{margin:0;height:100%;background:#1D303C;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:#F4EFE0}
#world{position:absolute;inset:0;will-change:filter}
.top-bar{position:fixed;top:20px;right:24px;display:flex;align-items:center;gap:10px;z-index:100}
.btn-action{background:rgba(29,48,60,.92);border:1px solid rgba(90,171,184,0.4);color:#FFF;font-family:system-ui,sans-serif;font-size:13px;font-weight:600;padding:8px 16px;border-radius:9999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 4px 20px rgba(0,0,0,.3);transition:all 0.18s cubic-bezier(0.16, 1, 0.3, 1)}
.btn-action:hover{border-color:#5AABB8;transform:translateY(-1px)}
.btn-action.active{background:rgba(90,171,184,0.22);border-color:#5AABB8;box-shadow:0 0 14px rgba(90,171,184,0.4)}
.btn-action svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none}

#dbg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 18px;border-radius:9999px;background:rgba(14,16,22,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(90,171,184,0.35);box-shadow:0 10px 30px rgba(0,0,0,.6);color:#cfd5e3;font:13px system-ui;z-index:90;transition:all 0.24s cubic-bezier(0.16, 1, 0.3, 1)}
#dbg.hidden{opacity:0;pointer-events:none;transform:translate(-50%, 14px)}
#dbg button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);color:#F8FAFC;font-family:inherit;font-size:12px;font-weight:600;padding:6px 14px;border-radius:9999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;outline:none;transition:all 0.18s cubic-bezier(0.16, 1, 0.3, 1)}
#dbg button:hover{background:rgba(90,171,184,0.22);border-color:#5AABB8;color:#FFF}
#dbg button#btn-audio{padding:6px 10px}
#dbg button.muted{opacity:0.6;color:#94A3B8}
#dbg input{width:340px;height:6px;accent-color:#5AABB8;border-radius:3px;cursor:pointer;background:rgba(255,255,255,0.18);outline:none}
#dbg span{font-variant-numeric:tabular-nums;min-width:52px;text-align:right;color:#E2E8F0;font-weight:600}

body.clean-capture .top-bar,body.clean-capture #dbg,body.clean-mode .top-bar,body.clean-mode #dbg{display:none!important;opacity:0!important;visibility:hidden!important}
body.clean-capture,body.clean-mode{cursor:none!important}
</style>
</head>
<body>
<div class="top-bar">
  <button class="btn-action active" id="btn-hud" title="Toggle HUD (H)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>HUD (H)</span>
  </button>
  <button class="btn-action" id="btn-export">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <span id="btn-export-text" style="display:inline-flex;align-items:center;gap:4px;">Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240</span>
  </button>
</div>
<div id="stage"><div id="world"><svg id="scene" width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0" font-family="system-ui,sans-serif"></svg></div></div>
<div id="dbg">
  <button id="dPlay">Pause</button>
  <button id="btn-audio" title="Mute/Unmute Audio (M)">
    <svg id="icon-audio-on" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <svg id="icon-audio-off" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  </button>
  <input id="dScrub" type="range" min="0" max="1000" value="0">
  <span id="dClock">0.00s</span>
</div>
<audio id="vo" src="" preload="auto"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
let isRecording = false;
const W=1920,H=1080,DUR=12,NS='http://www.w3.org/2000/svg',XL='http://www.w3.org/1999/xlink';
/* palet flat cerah — ganti dari tema, tapi tetap TANPA tekstur */
const C={cream:'#FFF3DC',white:'#FFFDF5',navy:'#345867',deep:'#172E3C',teal:'#237C80',mint:'#8DD3C3',blue:'#5AABB8',gold:'#F4BC52',
  coral:'#E0714F',rust:'#C86545',ink:'#263746',grass:'#B9CD8E',grass2:'#9DB874',sand:'#E6D5AC',sand2:'#D6BF8E',skin:'#CB895F',
  wall:'#EDE6D3',wall2:'#DCD3BE',metal:'#A9B5B3',steam:'#F7F4EA',skyA:'#BFDDE3',skyB:'#F6EFDD',hill:'#CFE0CC'};
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}addEventListener('resize',fit);fit();

/* ---------- penyusun bentuk ---------- */
const S=$('#scene');
function N(tag,a={},p=S){const n=document.createElementNS(NS,tag);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n;}
const G=(a={},p=S)=>N('g',a,p),R=(x,y,w,h,f,rx=0,p=S,a={})=>N('rect',{x,y,width:w,height:h,rx,fill:f,...a},p),
  CI=(cx,cy,r,f,p=S,a={})=>N('circle',{cx,cy,r,fill:f,...a},p),EL=(cx,cy,rx,ry,f,p=S,a={})=>N('ellipse',{cx,cy,rx,ry,fill:f,...a},p),
  PA=(d,f,p=S,a={})=>N('path',{d,fill:f||'none',...a},p),
  LN=(d,st,w,p=S,a={})=>N('path',{d,fill:'none',stroke:st,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',...a},p),
  TX=(x,y,t,size,f,p=S,a={})=>{const n=N('text',{x,y,'font-size':size,fill:f,'font-weight':700,'text-anchor':'middle',...a},p);n.textContent=t;return n;},
  IMG=(href,x,y,w,h,p=S,a={})=>{const n=N('image',{x,y,width:w,height:h,...a},p);n.setAttributeNS(XL,'href',href);n.setAttribute('href',href);return n;},
  shadow=(x,y,rx,p=S)=>EL(x,y,rx,16,C.deep,p,{opacity:.13}),
  sh=(hex,f)=>{const n=parseInt(hex.slice(1),16);const r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);};
/* SENDI: transform manual → sumbu putar = titik asal lokal (bukan bbox) */
function J(el,tx=0,ty=0){const j={el,tx,ty,x:0,y:0,r:0,sx:1,sy:1,apply(){el.setAttribute('transform',`translate(${j.tx+j.x},${j.ty+j.y}) rotate(${j.r}) scale(${j.sx},${j.sy})`);}};j.apply();return j;}
const defsS=N('defs',{},S),grad=N('linearGradient',{id:'skyG',x1:0,y1:0,x2:0,y2:1},defsS);N('stop',{offset:0,'stop-color':C.skyA},grad);N('stop',{offset:1,'stop-color':C.skyB},grad);

/* ---------- panggung: satu frame per adegan, kamera sendiri ---------- */
const scenes=[];
function scene(name){const g=G({'data-name':name},S);g.style.display='none';const sc={name,g,cam:{x:960,y:540,z:1.1,ox:0,oy:0},
  apply(){const c=sc.cam;g.setAttribute('transform',`translate(${960-(c.x+c.ox)*c.z},${540-(c.y+c.oy)*c.z}) scale(${c.z})`);}};sc.apply();scenes.push(sc);return sc;}
const skyOf=(p,y0=-1400,y1=1080)=>R(-600,y0,3200,y1-y0,'url(#skyG)',0,p);
const hillsOf=(p,b)=>PA(`M-600 ${b} L-200 ${b-140} L300 ${b-60} L800 ${b-200} L1300 ${b-90} L1800 ${b-180} L2500 ${b-70} L2500 1400 L-600 1400 Z`,C.hill,p);
const groundOf=(p,gy)=>{R(-600,gy+18,3200,600,C.sand,0,p);R(-600,gy,3200,26,C.grass2,0,p);R(-600,gy-6,3200,14,C.grass,0,p);};

/* ---------- KARAKTER: rig sendi (kaki di y=0) ---------- */
const HEADS={};   // isi bila punya kepala raster: {pria:{bbox:[x0,y0,x1,y1]}} + berkas karakter/<who>-<ekspresi>[-kedip].png
function character(p,x,ground,scale,{who='vektor',shirt=C.teal,pants=C.cream,shoes='#2C2A2E',hair=C.ink}={}){
  const sd=shadow(x,ground+4,72*scale,p),place=G({transform:`translate(${x},${ground}) scale(${scale})`},p),rootEl=G({},place),root=J(rootEl),ref={root,place,who,scale,sd};
  for(const side of ['R','L']){const sx=side==='L'?-26:26,dk=side==='R'?.86:1;
    const tEl=G({},rootEl),thigh=J(tEl,sx,-214);R(-24,-10,48,118,sh(pants,dk),21,tEl);
    const sEl=G({},tEl),shin=J(sEl,0,102);R(-21,-8,42,108,sh(pants,dk),18,sEl);
    const fEl=G({},sEl),foot=J(fEl,0,96);PA('M -24 -10 L 16 -10 C 24 4 46 4 50 16 L 50 26 L -26 26 Z',sh(shoes,dk),fEl);
    ref[side+'thigh']=thigh;ref[side+'shin']=shin;ref[side+'foot']=foot;}
  const tEl=G({},rootEl),torso=J(tEl,0,-214);ref.torso=torso;
  const arm=(side,front)=>{const s=side==='L'?-1:1,aEl=G({},tEl),a=J(aEl,50*s,-126);R(-17,-16,34,98,front?shirt:sh(shirt,.86),16,aEl);
    const fEl=G({},aEl),f=J(fEl,0,78);R(-15,-12,30,90,front?C.skin:sh(C.skin,.9),14,fEl);const hEl=G({},fEl),h=J(hEl,0,74);EL(0,4,17,21,front?C.skin:sh(C.skin,.9),hEl);
    ref[side+'arm']=a;ref[side+'fore']=f;ref[side+'hand']=h;};
  arm('R',false);
  PA('M -48 -152 C -64 -144 -70 -112 -66 -76 L -58 8 C -28 22 32 22 60 8 L 67 -76 C 71 -112 60 -144 45 -152 Z',shirt,tEl);
  PA('M 46 -146 C 64 -130 68 -100 64 -62 L 57 8 L 36 12 L 40 -140 Z',sh(shirt,.88),tEl);R(-15,-178,30,40,C.skin,12,tEl);R(-58,-2,117,22,sh(shirt,.82),9,tEl);
  arm('L',true);
  const hEl=G({},tEl),head=J(hEl,0,-160);ref.head=head;ref.faces={};
  if(HEADS[who]){const hb=HEADS[who].bbox,hw=hb[2]-hb[0],cx=(hb[0]+hb[2])/2,cy=hb[3],hs=150/hw,hg=G({transform:`translate(${-cx*hs},${-cy*hs+14}) scale(${hs})`},hEl);
    for(const e of ['senang','cemas','kaget']){const g=G({opacity:e==='senang'?1:0},hg);IMG(`karakter/${who}-${e}.png`,0,0,1024,1024,g);const b=IMG(`karakter/${who}-${e}-kedip.png`,0,0,1024,1024,g,{opacity:0});ref.faces[e]={g,blink:b};}}
  else{ /* kepala vektor sederhana: kulit, siluet rambut, dua titik mata, mulut */
    EL(-72,-70,13,20,C.skin,hEl);EL(72,-70,13,20,C.skin,hEl);PA('M -74 -120 C -74 -180 74 -180 74 -120 L 74 -60 C 74 -6 -74 -6 -74 -60 Z',C.skin,hEl);
    PA('M -76 -110 C -80 -175 80 -175 76 -110 L 62 -104 C 20 -130 -10 -120 -50 -108 Z',hair,hEl);
    const eyes=G({},hEl),ej=J(eyes,0,-86);ref.eyes=ej;CI(-28,0,7,C.ink,eyes);CI(28,0,7,C.ink,eyes);
    LN('M -40 -104 C -33 -110 -22 -110 -16 -106',C.ink,4,hEl);LN('M 16 -106 C 22 -110 33 -110 40 -104',C.ink,4,hEl);
    ref.mouth=LN('M -16 -46 C -6 -36 6 -36 16 -46',C.ink,5,hEl);}
  return ref;}

/* ---------- mesin animasi ---------- */
const tl=gsap.timeline({paused:true}),world=$('#world');
const show=(t,at,d=.5)=>tl.fromTo(t,{opacity:0},{opacity:1,duration:d,ease:'power2.out',immediateRender:false},at),hide=(t,at,d=.4)=>tl.to(t,{opacity:0,duration:d,ease:'power2.in'},at);
const rot=(j,at,v,dur,ease='power2.inOut')=>tl.to(j,{r:v,duration:dur,ease,onUpdate:j.apply},at);
const sway=(j,at,v,dur)=>tl.to(j,{r:v,duration:dur,ease:'sine.inOut',yoyo:true,repeat:Math.max(1,Math.ceil((DUR-at)/dur)),onUpdate:j.apply},at);
const spin=(j,at,period)=>tl.fromTo(j,{r:0},{r:360,duration:period,ease:'none',repeat:Math.max(1,Math.ceil((DUR-at)/period)),onUpdate:j.apply,immediateRender:false},at);
/* partikel: satu tween gerak + satu tween opacity berkeyframe (dua tween opacity tak-hingga saling menimpa) */
const drift=(el,at,{y=-200,scale=null,dur=3,peak=.8}={})=>{const rep=Math.max(1,Math.ceil((DUR-at)/dur));const to={y,duration:dur,ease:'sine.out',repeat:rep,immediateRender:false};if(scale!=null)to.scale=scale;
  tl.fromTo(el,{y:0,scale:scale!=null?.5:1,transformOrigin:'50% 50%'},to,at);tl.to(el,{keyframes:{opacity:[0,peak,peak,0],easeEach:'none'},duration:dur,repeat:rep,ease:'none'},at);};
/* tetes mengikuti jalur pipa (parametrik) */
function flowAlong(drops,pathD,at,period){const rep=Math.max(1,Math.ceil((DUR-at)/period)),p=N('path',{d:pathD},defsS),L=p.getTotalLength();drops.forEach((d,i)=>{const o={q:i/drops.length};tl.set(d,{opacity:1},at);
  tl.to(o,{q:i/drops.length+1,duration:period,ease:'none',repeat:rep,onUpdate(){const pt=p.getPointAtLength((o.q%1)*L);d.setAttribute('cx',pt.x);d.setAttribute('cy',pt.y);}},at);});}
/* kamera: tahan → satu gerak per beat → tahan; zoom 1,08–1,95 */
const cam=(sc,at,x,y,z,dur=1.6,ease='sine.inOut')=>tl.to(sc.cam,{x,y,z,duration:dur,ease,onUpdate:sc.apply},at);
/* pergantian panggung */
function cut(at,from,to){tl.set(from.g,{display:'none'},at);tl.set(to.g,{display:'block'},at);}
function slide(at,from,to,axis='x',dist=96){const o=axis==='x'?'ox':'oy';
  tl.to(from.cam,{[o]:-dist,duration:.28,ease:'power2.in',onUpdate:from.apply},at);tl.set(to.cam,{[o]:dist},at+.28);cut(at+.28,from,to);
  tl.to(to.cam,{[o]:0,duration:.42,ease:'power3.out',onUpdate:to.apply},at+.28);
  const b={v:0};tl.to(b,{v:10,duration:.28,ease:'power2.in',onUpdate(){world.style.filter=`blur(${b.v}px)`}},at);
  tl.to(b,{v:0,duration:.42,ease:'power3.out',onUpdate(){world.style.filter=b.v>.05?`blur(${b.v}px)`:'none'}},at+.28);}
/* karakter: idle (napas, kedip tiap ≈3,5 dtk), ekspresi, jalan */
function idle(ch,from){sway(ch.torso,from,1.1,1.7);sway(ch.head,from+.3,-1.7,2.3);sway(ch.Rarm,from+.5,-1.5,1.9);
  const rep=Math.max(1,Math.ceil((DUR-from)/3.5));
  const kf=[{duration:3.3+ch.who.length*.11},{duration:.01},{duration:.13},{duration:.01}];
  if(ch.eyes)tl.to(ch.eyes,{keyframes:kf.map((k,i)=>({sy:i===1||i===2?.06:1,...k})),repeat:rep,ease:'none',onUpdate:ch.eyes.apply},from);
  for(const e in ch.faces)tl.to(ch.faces[e].blink,{keyframes:kf.map((k,i)=>({opacity:i===1||i===2?1:0,...k})),repeat:rep,ease:'none'},from);}
const face=(ch,e,at)=>{for(const k in ch.faces)tl.to(ch.faces[k].g,{opacity:k===e?1:0,duration:.08},at);
  if(ch.mouth)tl.to(ch.mouth,{attr:{d:e==='cemas'?'M -16 -36 C -6 -46 6 -46 16 -36':e==='kaget'?'M -8 -46 C -8 -30 8 -30 8 -46 Z':'M -16 -46 C -6 -36 6 -36 16 -46'},duration:.1},at);};
function walk(ch,at,dur,dx){const n=Math.max(1,Math.round(dur/.39));
  tl.to(ch.root,{x:'+='+dx,duration:dur,ease:'none',onUpdate:ch.root.apply},at);tl.to(ch.sd,{x:'+='+dx*ch.scale,duration:dur,ease:'none'},at);
  const leg=(j,a,b)=>tl.fromTo(j,{r:a},{r:b,duration:.39,ease:'sine.inOut',yoyo:true,repeat:n-1,onUpdate:j.apply,immediateRender:false},at);
  leg(ch.Lthigh,-15,15);leg(ch.Rthigh,15,-15);leg(ch.Lshin,0,18);leg(ch.Rshin,18,0);leg(ch.Larm,12,-12);
  tl.fromTo(ch.root,{y:0},{y:-4,duration:.195,ease:'sine.inOut',yoyo:true,repeat:n*2-1,onUpdate:ch.root.apply,immediateRender:false},at);
  [ch.Lthigh,ch.Rthigh,ch.Lshin,ch.Rshin,ch.Larm].forEach(j=>rot(j,at+dur,0,.3));}

/* ================= PANGGUNG 1 — halaman: tokoh menunjuk, jemuran, ayam ================= */
const P1=scene('halaman');{const p=P1.g,gy=1000;skyOf(p);hillsOf(p,760);groundOf(p,gy);
  const h=G({transform:`translate(-80,${gy})`},p);R(0,-560,900,560,C.wall,0,h);PA('M -34 -560 L 450 -780 L 934 -560 Z',C.coral,h);R(150,-400,210,210,C.blue,6,h);R(560,-390,210,390,C.navy,6,h);
  const lg=G({transform:`translate(1180,${gy})`},p);R(-6,-260,12,262,'#8A6A4A',4,lg);R(214,-260,12,262,'#8A6A4A',4,lg);LN('M0 -250 L220 -250',C.deep,4,lg);
  P1.clothes=[[20,C.gold],[90,C.blue],[160,C.coral]].map(([x,f])=>{const c=G({},lg);R(-25,0,50,70,f,8,c);return J(c,x+25,-248);});
  const cp=G({transform:`translate(1520,${gy})`},p),cb=G({},cp);P1.chick=cb;EL(0,-28,26,18,C.cream,cb);CI(20,-44,12,C.cream,cb);PA('M30 -44 L42 -40 L30 -36 Z',C.gold,cb);CI(24,-47,2.5,C.ink,cb);
  const legs=G({},cb);P1.legs=J(legs,0,-12);LN('M-6 0 L-6 14',C.gold,3,legs);LN('M8 0 L8 14',C.gold,3,legs);
  P1.w=character(p,760,gy,1.0);
  const sg=G({transform:'translate(1300,700)'},p),sign=G({},sg);R(-6,0,12,300,'#8A6A4A',4,sign);R(-110,-50,220,90,C.cream,10,sign);R(-110,-50,220,90,'none',10,sign,{stroke:C.navy,'stroke-width':6});TX(0,10,'GANTI',40,C.navy,sign,{'letter-spacing':3});}

/* ---------- kontrol: autoplay + auto-loop; audio toggle; ?clean=1 export ---------- */
const q=new URLSearchParams(location.search),vo=$('#vo'),hasVO=!!vo.getAttribute('src');
let audioOn=false, isAudioMuted=false;
const btnAudio=$('#btn-audio'), iconAudioOn=$('#icon-audio-on'), iconAudioOff=$('#icon-audio-off');

function toggleAudio(){
  isAudioMuted = !isAudioMuted;
  if (iconAudioOn) iconAudioOn.style.display = isAudioMuted ? 'none' : 'block';
  if (iconAudioOff) iconAudioOff.style.display = isAudioMuted ? 'block' : 'none';
  if (btnAudio) {
    btnAudio.classList.toggle('muted', isAudioMuted);
    btnAudio.title = isAudioMuted ? 'Unmute Audio (M)' : 'Mute Audio (M)';
  }
  if (hasVO && vo) vo.muted = isAudioMuted;
}
if (btnAudio) btnAudio.onclick = toggleAudio;

function applyAll(){scenes.forEach(s=>s.apply());}
function start(){
  tl.pause(0);
  tl.play(0);
  if(hasVO){
    vo.muted = isAudioMuted;
    vo.currentTime = 0;
    vo.play().then(()=>audioOn=true).catch(()=>{});
  }
}
tl.eventCallback('onComplete', () => { if (!isRecording) start(); });

window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek(t){tl.pause(t,false);applyAll();if(gsap.ticker.tick)gsap.ticker.tick();},play:start};
/* ================= FOOTAGE — layer video yang terikat timeline ================= */
var CLIPS = CLIPS || [];
function clip(el, o){ o = o || {}; el.muted = true; el.playsInline = true; el.preload = 'auto'; el.loop = false;
  try { el.pause(); } catch(e) {}
  var c = { el: el, at: o.at || 0, inT: o.in || 0, out: (o.out == null ? null : o.out), rate: o.rate || 1, hold: !!o.hold };
  (CLIPS = CLIPS || []).push(c); return c; }
function clipTime(c, t){ var end = c.out != null ? c.out : (isFinite(c.el.duration) ? c.el.duration : 1e9);
  var lt = (t - c.at) * c.rate; if (lt < 0) return null; var vt = c.inT + lt;
  if (vt > end - 1/120) { if (!c.hold) return null; vt = end - 1/60; } return vt; }
function syncClips(t, playing){ for (var i = 0; i < CLIPS.length; i++){ var c = CLIPS[i], v = c.el, vt = clipTime(c, t);
  if (vt === null) { if (!v.paused) v.pause(); continue; }
  if (playing) { if (v.playbackRate !== c.rate) v.playbackRate = c.rate; if (v.paused) v.play().catch(function(){});
    if (Math.abs(v.currentTime - vt) > .2) v.currentTime = vt; }
  else { if (!v.paused) v.pause(); if (Math.abs(v.currentTime - vt) > 1/90) v.currentTime = vt; } } }
function seekClips(t){ return Promise.all(CLIPS.map(function(c){ return new Promise(function(res){
  var v = c.el, vt = clipTime(c, t); try { v.pause(); } catch(e) {}
  if (vt === null) return res();
  var fin = function(){ requestAnimationFrame(function(){ requestAnimationFrame(res); }); };
  if (Math.abs(v.currentTime - vt) < 1/240 && v.readyState >= 2) return fin();
  var to = setTimeout(res, 4000);
  v.addEventListener('seeked', function h(){ v.removeEventListener('seeked', h); clearTimeout(to); fin(); });
  v.currentTime = vt; }); })); }
gsap.ticker.add(function(){ if (CLIPS.length) syncClips(window.OPENER.tl.time(), !window.OPENER.tl.paused()); });
window.OPENER.clipsReady = function(){ return CLIPS.every(function(c){ return c.el.readyState >= 2; }); };
window.OPENER.seekFrame = function(t){ window.OPENER.seek(t); return seekClips(t); };

const btnHud = $('#btn-hud');
const dbg = $('#dbg');
function toggleHud() {
  const isHidden = dbg.classList.toggle('hidden');
  if (btnHud) btnHud.classList.toggle('active', !isHidden);
}
if (btnHud) btnHud.onclick = toggleHud;

addEventListener('keydown', e => {
  if (/^[rR]$/.test(e.key)) start();
  if (e.code === 'Space') {
    e.preventDefault();
    tl.paused() ? tl.play() : tl.pause();
  }
  if (e.key === 'h' || e.key === 'H') toggleHud();
  if (e.key === 'm' || e.key === 'M') toggleAudio();
});

const sc = $('#dScrub'), ck = $('#dClock');
let drag = false;
gsap.ticker.add(() => {
  const curT = tl.time();
  if (curT >= DUR) {
    start();
    return;
  }
  if (!drag) sc.value = String(curT / DUR * 1000);
  ck.textContent = curT.toFixed(2) + 's';
  $('#dPlay').textContent = tl.paused() ? 'Play' : 'Pause';
  if (!audioOn || tl.paused() || !hasVO) return;
  if (Math.abs(vo.currentTime - curT) > .12) vo.currentTime = curT;
});
sc.addEventListener('pointerdown', () => { drag = true; tl.pause(); });
addEventListener('pointerup', () => drag = false);
sc.addEventListener('input', () => { tl.pause(); tl.time(sc.value / 1000 * DUR); });
$('#dPlay').onclick = () => tl.paused() ? tl.play() : tl.pause();

document.fonts.ready.then(() => {
  applyAll();
  window.OPENER.ready = true;
  if (q.has('clean')) return;
  if (!hasVO) { start(); return; }
  vo.play().then(() => { audioOn = true; vo.currentTime = 0; tl.play(0); }).catch(() => {
    const go = () => { removeEventListener('pointerdown', go); removeEventListener('keydown', go); start(); };
    addEventListener('pointerdown', go); addEventListener('keydown', go);
  });
});

/* Ultra-HFR Clean Video Exporter (Up to 240 FPS) */
const EXPORT_DEFAULT_HTML = 'Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240';
const btnExport = $('#btn-export');
const btnExportLabel = $('#btn-export-text');

if (btnExport) {
  btnExport.onclick = async () => {
    if (isRecording) return;
    try {
      isRecording = true;
      btnExportLabel.textContent = 'Preparing Capture...';
      document.body.classList.add('clean-capture');

      const captureAudio = !isAudioMuted;
      let stream;
      if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
        if (captureAudio) {
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: 240, min: 60 } },
              audio: true,
              preferCurrentTab: true
            });
          } catch {
            try {
              stream = await navigator.mediaDevices.getDisplayMedia({
                video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: 240, min: 60 } },
                preferCurrentTab: true
              });
            } catch (e) {
              document.body.classList.remove('clean-capture');
              btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
              isRecording = false;
              return;
            }
          }
        } else {
          // Explicitly muted: capture video-only without sound
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: 240, min: 60 } },
              audio: false,
              preferCurrentTab: true
            });
          } catch {
            try {
              stream = await navigator.mediaDevices.getDisplayMedia({
                video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: 240, min: 60 } },
                preferCurrentTab: true
              });
            } catch (e) {
              document.body.classList.remove('clean-capture');
              btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
              isRecording = false;
              return;
            }
          }
          if (stream) {
            stream.getAudioTracks().forEach(t => {
              t.stop();
              stream.removeTrack(t);
            });
          }
        }
      } else {
        alert('Browser tidak menyokong rakaman skrin langsung. Sila buka melalui Chrome/Edge di localhost atau guna eksport CLI: node scripts/export-frames.mjs');
        document.body.classList.remove('clean-capture');
        btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
        isRecording = false;
        return;
      }

      if (!stream) {
        document.body.classList.remove('clean-capture');
        btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
        isRecording = false;
        return;
      }

      const mimeType = MediaRecorder.isTypeSupported('video/mp4; codecs="avc1.42E01E"')
        ? 'video/mp4; codecs="avc1.42E01E"'
        : (MediaRecorder.isTypeSupported('video/webm; codecs=vp9') ? 'video/webm; codecs=vp9' : 'video/webm');

      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 40000000 });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        document.body.classList.remove('clean-capture');
        btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
        isRecording = false;
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(chunks, { type: mimeType });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `KinetRig-Stage.${ext}`;
        a.click();
        stream.getTracks().forEach(t => t.stop());
        start();
      };

      tl.pause(0);
      recorder.start();
      tl.play();
      btnExportLabel.textContent = 'Recording 240 FPS...';
      setTimeout(() => {
        if (recorder.state === 'recording') {
          tl.pause();
          recorder.stop();
        }
      }, DUR * 1000);
    } catch {
      document.body.classList.remove('clean-capture');
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false;
    }
  };
}
