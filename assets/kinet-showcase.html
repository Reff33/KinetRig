<title>KinetRig — 3D Product Showcase (144 FPS)</title>

<style>
:root {
  --primary: #F59E0B;
  --primary-glow: rgba(245, 158, 11, 0.4);
  --bg: #090D1A;
  --card-bg: rgba(17, 24, 39, 0.85);
  --font-main: "Plus Jakarta Sans", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family:var(--font-main); color:#FFF; }

#stage {
  position: fixed; left:50%; top:50%; width:1920px; height:1080px;
  transform: translate(-50%, -50%) scale(1);
  background: radial-gradient(circle at 65% 50%, #1E293B, var(--bg) 75%);
  overflow: hidden; display: flex; align-items: center; justify-content: center;
}

.product-layout {
  display: flex; gap: 80px; align-items: center; max-width: 1400px;
}
.product-visual-wrap {
  perspective: 1200px; position: relative;
}
.product-visual {
  width: 520px; height: 520px; border-radius: 28px;
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(0,0,0,0.88));
  border: 1px solid rgba(245, 158, 11, 0.35);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 40px var(--primary-glow);
  position: relative; opacity: 0; transform-style: preserve-3d;
  overflow: hidden;
}
.card-shine {
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.45) 45%, rgba(245,158,11,0.5) 55%, transparent 75%);
  opacity: 0; mix-blend-mode: screen; z-index: 5;
}
#gl-product {
  position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; pointer-events: none; z-index: 2; display: none;
}
.fallback-svg {
  position: relative; z-index: 1; transition: opacity 0.3s;
}
.product-visual svg {
  width: 260px; height: 260px; stroke: var(--primary); stroke-width: 1.5; fill: none;
  filter: drop-shadow(0 0 16px var(--primary-glow));
}
.price-tag {
  position: absolute; top: 24px; right: 24px; background: var(--primary);
  color: #000; font-family: var(--font-mono); font-size: 28px; font-weight: 800;
  padding: 8px 20px; border-radius: 999px; box-shadow: 0 10px 25px rgba(245, 158, 11, 0.5);
  z-index: 10;
}

.product-info { max-width: 620px; text-align: left; }
.badge {
  display: inline-block; background: rgba(245, 158, 11, 0.15); color: var(--primary);
  border: 1px solid rgba(245, 158, 11, 0.4); font-size: 14px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em; padding: 6px 16px; border-radius: 999px;
  margin-bottom: 20px; opacity: 0;
}
.title { font-size: 64px; font-weight: 800; line-height: 1.1; margin-bottom: 24px; opacity: 0; }
.desc { font-size: 20px; color: #94A3B8; line-height: 1.6; margin-bottom: 36px; opacity: 0; }

.spec-grid { display: flex; gap: 20px; margin-bottom: 40px; }
.spec-item {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 14px 22px; opacity: 0; transform: translateY(20px);
}
.spec-item .val { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: #FFF; }
.spec-item .lbl { font-size: 13px; color: #64748B; text-transform: uppercase; margin-top: 4px; }

.btn-buy {
  background: var(--primary); color: #000; font-size: 22px; font-weight: 800;
  padding: 18px 44px; border-radius: 14px; border: none; cursor: pointer;
  box-shadow: 0 10px 30px var(--primary-glow); opacity: 0; transform: scale(0.9);
}

.top-bar { position: fixed; top: 20px; right: 24px; display: flex; align-items: center; gap: 10px; z-index: 100; }
.btn-action {
  background: rgba(17, 24, 39, 0.92); border: 1px solid rgba(16, 185, 129, 0.35); color: #FFF;
  font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  padding: 8px 16px; border-radius: 9999px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}
.btn-action:hover {
  border-color: var(--primary); transform: translateY(-1px);
}
.btn-action.active {
  background: rgba(16, 185, 129, 0.22); border-color: var(--primary);
  box-shadow: 0 0 14px rgba(16, 185, 129, 0.4);
}
.btn-action svg {
  width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none;
}

#ui {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; padding: 8px 18px;
  border-radius: 9999px; background: rgba(9, 14, 26, 0.92);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(16, 185, 129, 0.35);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(16, 185, 129, 0.15);
  font-family: var(--font-mono); font-size: 13px; color: #94A3B8; z-index: 90;
  transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
}
#ui.hidden {
  opacity: 0; pointer-events: none; transform: translate(-50%, 14px);
}
#ui button {
  background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14);
  color: #F8FAFC; font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 6px 14px; border-radius: 9999px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; outline: none;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1); letter-spacing: 0.02em;
}
#ui button:hover {
  background: rgba(16, 185, 129, 0.22); border-color: var(--primary); color: #FFF;
  box-shadow: 0 0 14px rgba(16, 185, 129, 0.4); transform: translateY(-1px);
}
#ui button:active { transform: translateY(0) scale(0.96); background: rgba(16, 185, 129, 0.35); }
#ui button#btn-audio {
  padding: 6px 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
#ui button#btn-audio.muted {
  color: #94a3b8;
  border-color: rgba(239, 68, 68, 0.4);
}
#scrub { width: 340px; height: 6px; accent-color: var(--primary); border-radius: 3px; cursor: pointer; background: rgba(255, 255, 255, 0.18); outline: none; }
#clock { font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; color: #E2E8F0; font-weight: 600; }

body.clean-capture .top-bar, body.clean-capture #ui,
body.clean-mode .top-bar, body.clean-mode #ui { display: none !important; opacity: 0 !important; visibility: hidden !important; }
body.clean-capture, body.clean-mode { cursor: none !important; }

/* Export Dropdown & FPS Menu */
.export-dropdown { position: relative; }
.fps-menu {
  display: none; position: absolute; top: calc(100% + 8px); right: 0;
  background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(0, 245, 255, 0.35);
  border-radius: 12px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 20px rgba(0,245,255,0.15);
  padding: 6px; min-width: 175px; z-index: 120; flex-direction: column; gap: 3px;
}
.fps-menu.open { display: flex; }
.fps-item {
  background: transparent; border: none; color: #E2E8F0;
  font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 8px 10px; border-radius: 8px; text-align: left; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  transition: all 0.15s ease; width: 100%; box-sizing: border-box;
}
.fps-item:hover {
  background: rgba(0, 245, 255, 0.2); color: #00F5FF; transform: translateX(2px);
}
.fps-item.danger:hover {
  background: rgba(239, 68, 68, 0.2); color: #F87171;
}

</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const Q = new URLSearchParams(location.search);
let isRecording = false;
if (location.search.includes('clean') || Q.has('clean')) { document.body.classList.add('clean-capture', 'clean-mode'); }

/* ============ DYNAMIC PARAMETERS & SPECS DATA INGESTION ============ */
const productTitle = Q.get('title') || 'AERO-144 PRO';
const productBadge = Q.get('badge') || 'Featured Flagship';
const productDesc = Q.get('desc') || 'Precision crafted hardware accelerator engineered for real-time generative neural pipelines and sub-millisecond audio synthesis.';
const productPrice = Q.get('price') || '$299';
const productCta = Q.get('cta') || 'ORDER NOW — SHIPS TODAY';
const modelUrl = Q.get('model');

if ($('#t1')) $('#t1').textContent = productTitle;
if ($('#b1')) $('#b1').textContent = productBadge;
if ($('#d1')) $('#d1').textContent = productDesc;
if ($('#price-tag')) $('#price-tag').textContent = productPrice;
if ($('#btn-cta')) $('#btn-cta').textContent = productCta;

const specsParam = Q.get('specs');
if (specsParam) {
  const specsGrid = $('#specs');
  if (specsGrid) {
    const parsed = specsParam.split(',').map(s => {
      const parts = s.split(':');
      return { val: parts[0]?.trim() || '', lbl: parts[1]?.trim() || '' };
    }).filter(it => it.val);
    if (parsed.length > 0) {
      specsGrid.innerHTML = parsed.map(item => `
        <div class="spec-item"><div class="val">${item.val}</div><div class="lbl">${item.lbl}</div></div>
      `).join('');
    }
  }
}

/* ============ 3D WEBGL PRODUCT MODEL & PROCEDURAL CORE FALLBACK ============ */
let modelGroup = null;
let threeRenderer = null;
try {
  const canvas3d = $('#gl-product');
  if (canvas3d && typeof THREE !== 'undefined' && typeof THREE.WebGLRenderer === 'function') {
    threeRenderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true, powerPreference: 'high-performance' });
    threeRenderer.setSize(520, 520);
    threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const scene3d = new THREE.Scene();
    const camera3d = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera3d.position.z = 4.2;

    const ambient = new THREE.AmbientLight(0xffffff, 0.9);
    scene3d.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xf59e0b, 2.5);
    dirLight.position.set(5, 5, 5);
    scene3d.add(dirLight);

    const backLight = new THREE.DirectionalLight(0x38bdf8, 1.4);
    backLight.position.set(-5, -3, -2);
    scene3d.add(backLight);

    modelGroup = new THREE.Group();
    scene3d.add(modelGroup);

    function buildProceduralChip() {
      if (typeof THREE.BoxGeometry === 'function' && typeof THREE.Mesh === 'function') {
        const coreGeo = new THREE.BoxGeometry(1.6, 1.6, 0.28);
        const coreMat = new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.85, roughness: 0.25 });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        modelGroup.add(coreMesh);

        const dieGeo = new THREE.BoxGeometry(0.9, 0.9, 0.36);
        const dieMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.95, roughness: 0.15 });
        const dieMesh = new THREE.Mesh(dieGeo, dieMat);
        modelGroup.add(dieMesh);
      }
      canvas3d.style.display = 'block';
      if ($('#fallback-svg')) $('#fallback-svg').style.opacity = '0.15';
    }

    if (modelUrl && typeof GLTFLoader === 'function') {
      try {
        const loader = new GLTFLoader();
        loader.load(modelUrl, gltf => {
          modelGroup.add(gltf.scene);
          if ($('#fallback-svg')) $('#fallback-svg').style.opacity = '0';
          canvas3d.style.display = 'block';
        }, undefined, () => buildProceduralChip());
      } catch (e) {
        buildProceduralChip();
      }
    } else {
      buildProceduralChip();
    }

    const renderThree = () => {
      if (modelGroup) {
        const t = tl.time();
        modelGroup.rotation.y = t * 0.75 + 0.35;
        modelGroup.rotation.x = Math.sin(t * 0.6) * 0.22;
      }
      threeRenderer.render(scene3d, camera3d);
    };
    gsap.ticker.add(renderThree);
  }
} catch (e) {}

const DURATION = 8.0;
const tl = gsap.timeline({ paused: true });

/* ============ AUDIO SYNTHESIS & MOTIVATED SHOWCASE SFX ============ */
let audioCtx = null, audioDest = null;
let isAudioMuted = false;
let mainMasterGain = null;

const btnAudio = $('#btn-audio'), iconAudioOn = $('#icon-audio-on'), iconAudioOff = $('#icon-audio-off');
function toggleAudio() {
  isAudioMuted = !isAudioMuted;
  if (iconAudioOn) iconAudioOn.style.display = isAudioMuted ? 'none' : 'block';
  if (iconAudioOff) iconAudioOff.style.display = isAudioMuted ? 'block' : 'none';
  if (btnAudio) {
    btnAudio.classList.toggle('muted', isAudioMuted);
    btnAudio.title = isAudioMuted ? 'Unmute Audio (M)' : 'Mute Audio (M)';
  }
  if (mainMasterGain && audioCtx) {
    mainMasterGain.gain.setValueAtTime(isAudioMuted ? 0 : 1, audioCtx.currentTime);
  }
}
if (btnAudio) btnAudio.onclick = toggleAudio;

/* ============ ENTERPRISE HYBRID AI AUDIO INTELLIGENCE ARCHITECTURE ============ */
const SFX_CDN_BASE = 'https://raw.githubusercontent.com/wyzowl/sfx-kit/main';
const STUDIO_SFX = {
  card_whoosh: 'sounds/whooshes/whoosh-medium-soft.wav',
  tone_ding: 'sounds/tones/tone-step-2.wav',
  spec_chirp: 'sounds/digital/digital-blip-clear.wav',
  sub_impact: 'sounds/impacts/impact-deep-soft.wav'
};

const sfxAudioBuffers = {};
const sfxRawBuffers = {};
let ambientStarted = false;
let ambientMaster = null;

async function fetchSfxArrayBuffer(rel) {
  const isHttp = typeof location !== 'undefined' && location.protocol ? location.protocol.startsWith('http') : false;
  if (!isHttp && typeof navigator !== 'undefined' && navigator.onLine === false) return null;
  const tryUrls = isHttp
    ? [`../sfx/${rel}`, `sfx/${rel}`, `${SFX_CDN_BASE}/${rel}`]
    : [`${SFX_CDN_BASE}/${rel}`];
  for (const u of tryUrls) {
    try {
      const res = await fetch(u);
      if (res.ok) return await res.arrayBuffer();
    } catch (e) {}
  }
  return null;
}

for (const [id, rel] of Object.entries(STUDIO_SFX)) {
  fetchSfxArrayBuffer(rel).then(ab => {
    if (ab) {
      sfxRawBuffers[id] = ab;
      if (audioCtx) {
        audioCtx.decodeAudioData(ab.slice(0)).then(decoded => {
          sfxAudioBuffers[id] = decoded;
        }).catch(() => {});
      }
    }
  });
}

function startAmbientBed() {
  if (ambientStarted || !audioCtx || audioCtx.state !== 'running') return;
  ambientStarted = true;
  try {
    ambientMaster = audioCtx.createGain();
    ambientMaster.gain.setValueAtTime(0.04, audioCtx.currentTime);

    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110, audioCtx.currentTime);

    const bufLen = Math.floor(audioCtx.sampleRate * 2);
    const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    let b0 = 0, b1 = 0;
    for (let i = 0; i < bufLen; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.98 * b0 + white * 0.02;
      b1 = 0.94 * b1 + white * 0.06;
      data[i] = (b0 + b1) * 0.22;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(460, audioCtx.currentTime);

    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    osc.connect(oscGain);
    oscGain.connect(ambientMaster);

    noise.connect(filter);
    filter.connect(ambientMaster);

    ambientMaster.connect(mainMasterGain || audioCtx.destination);
    if (audioDest && !mainMasterGain) ambientMaster.connect(audioDest);

    osc.start();
    noise.start();

}

let hasUserInteracted = false;

function triggerSfx(sfxId, fallbackFn, gain = 0.5, pitchRate = 1.0) {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running' || (typeof isAudioMuted !== 'undefined' && isAudioMuted)) return;
  if (ctx && sfxAudioBuffers[sfxId]) {
    try {
      const src = ctx.createBufferSource();
      src.buffer = sfxAudioBuffers[sfxId];
      src.playbackRate.value = pitchRate;
      const g = ctx.createGain();
      g.gain.setValueAtTime(gain, ctx.currentTime);
      src.connect(g);
      g.connect(mainMasterGain || ctx.destination);
      if (audioDest && !mainMasterGain) g.connect(audioDest);
      src.start();
      return;
    } catch (e) {}
  }
  if (typeof fallbackFn === 'function') fallbackFn();
}

/* ============ 240 FPS STUDIO BRIDGE & CLEAN VIDEO EXPORTER ============ */
const EXPORT_DEFAULT_HTML = 'Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240';

/* ---- Studio Bridge discovery: same origin -> same host -> loopback ---- */
const BRIDGE_CANDIDATES = (() => {
  const out = [];
  try {
    const customUrl = localStorage.getItem('kinet_bridge_url');
    if (customUrl) out.push(customUrl.replace(/\/+$/, ''));
  } catch {}
  try {
    const q = new URLSearchParams(location.search).get('bridge');
    if (q) out.push(q.replace(/\/+$/, ''));
  } catch {}
  const p = location.protocol, host = location.hostname, org = location.origin;
  if (p === 'http:' || p === 'https:') {
    if (org && org !== 'null') out.push(org);
    if (host) out.push('http://' + host + ':4004');
  }
  out.push('http://127.0.0.1:4004', 'http://localhost:4004');
  return out.filter((v, i) => out.indexOf(v) === i);
})();
let BRIDGE = 'http://127.0.0.1:4004';
try {
  const _s = JSON.parse(localStorage.getItem('kinet_settings') || '{}');
  if (_s.host && _s.port) BRIDGE = 'http://' + (_s.host === '0.0.0.0' ? '127.0.0.1' : _s.host) + ':' + _s.port;
  if (_s.defaultFps) {
    const _el = document.getElementById('btn-export-text');
    if (_el) _el.innerHTML = 'Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> ' + _s.defaultFps;
  }
} catch {}
window.addEventListener('message', e => {
  if (e.data?.type === 'UPDATE_SETTINGS') {
    if (e.data.bridgeUrl) BRIDGE = e.data.bridgeUrl;
    if (e.data.settings?.defaultFps) {
      const _el = document.getElementById('btn-export-text');
      if (_el && (typeof isExporting === 'undefined' || !isExporting)) {
        _el.innerHTML = 'Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> ' + e.data.settings.defaultFps;
      }
    }
  }
});
async function resolveBridge() {
  for (let pass = 0; pass < 2; pass++) {
    for (const base of BRIDGE_CANDIDATES) {
      try {
        const r = await fetch(base + '/api/health', { signal: AbortSignal.timeout(1500) });
        if (r.ok) { BRIDGE = base; return true; }
      } catch {}
    }
  }
  try {
    const endpoints = [
      'http://127.0.0.1/KinetRig/api/bridge.php',
      'http://localhost/KinetRig/api/bridge.php',
      ...(location.protocol.startsWith('http') && location.origin && location.origin !== 'null' && location.port !== '4004'
        ? [location.origin + '/api/bridge.php', location.origin + '/KinetRig/api/bridge.php']
        : [])
    ];
    for (const ep of endpoints) {
      try {
        const h = await fetch(ep, { signal: AbortSignal.timeout(4000) });
        if (h.ok) {
          const res = await h.json();
          if (res.ok) {
            BRIDGE = res.bridge || 'http://127.0.0.1:4004';
            return true;
          }
        }
      } catch {}
    }
  } catch {}
  return false;
}

async function startExport(targetFps = 240) {
  if (isExporting || isRecording) return;
  if (typeof markUserInteracted === 'function') markUserInteracted();

  // 1. Studio Local Bridge Attempt (Deterministic 60–240 FPS Headless Render)
  if (await resolveBridge()) {
    try {
      setExportUiState(true);
      currentAbortController = new AbortController();
      btnExportLabel.textContent = `Connecting Studio...`;

      try {
        currentEvtSource = new EventSource(`${BRIDGE}/api/progress`);
        currentEvtSource.onmessage = e => {
          try {
            const data = JSON.parse(e.data);
            if (data.status === 'rendering' && !isRenderPaused) {
              btnExportLabel.textContent = `Rendering ${data.percent || 0}% (${targetFps} FPS)`;
            } else if (data.status === 'paused') {
              btnExportLabel.textContent = `Paused ${data.percent || 0}% (${targetFps} FPS)`;
            }
          } catch {}
        };
      } catch {}

      const templatePath = location.pathname.includes('assets/')
        ? location.pathname.substring(location.pathname.indexOf('assets/'))
        : 'assets/kinet-showcase.html';

      const renderRes = await fetch(`${BRIDGE}/api/render?template=${encodeURIComponent(templatePath)}&fps=${targetFps}`, {
        signal: currentAbortController.signal
      });
      if (currentEvtSource) { currentEvtSource.close(); currentEvtSource = null; }

      if (!renderRes.ok) throw new Error(await renderRes.text());

      btnExportLabel.textContent = 'Saving MP4...';
      const blob = await renderRes.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      const baseName = templatePath.split('/').pop().replace('.html', '');
      a.download = `${baseName}_${targetFps}fps.mp4`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);

      btnExportLabel.textContent = 'Downloaded!';
      setTimeout(() => {
        btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
        setExportUiState(false);
      }, 2000);
      return;
    } catch (bridgeErr) {
      if (bridgeErr.name === 'AbortError') return;
      console.error('[Studio Bridge Render Error]', bridgeErr);
      if (currentEvtSource) { currentEvtSource.close(); currentEvtSource = null; }
      setExportUiState(false);
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      alert(`[Ralat Render Studio Bridge]\n\n${bridgeErr.message || 'Render terhenti.'}`);
      return;
    }
  }

  // Studio bridge offline: maklumkan pengguna untuk hidupkan bridge (tanpa screen-share)
  if (!window.__bridgeRetried && confirm(`[KinetRig Studio Bridge Diperlukan]\n\nEksport visual ${targetFps} FPS memerlukan Studio Bridge tempatan.\n\nLangkah mudah:\n1. Klik dua kali "start-studio.bat" dalam folder projek, ATAU\n2. Jalankan arahan di terminal: node scripts/server.mjs\n\nKlik OK untuk sambung semula selepas bridge dihidupkan.`)) {
    window.__bridgeRetried = true;
    if (await resolveBridge()) { window.__bridgeRetried = false; return startExport(targetFps); }
    window.__bridgeRetried = false;
    alert('Bridge belum dapat dikesan. Sila pastikan start-studio.bat telah dibuka.');
  }
  btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
  setExportUiState(false);
  return;

  // 3. Standalone In-Browser Clean Screen Recording
  try {
    isRecording = true;
    setExportUiState(true);
    btnExportLabel.textContent = `Recording ${targetFps} FPS...`;
    document.body.classList.add('clean-capture');

    if (typeof initAudio === 'function') initAudio();
    const captureAudio = typeof isAudioMuted !== 'undefined' ? !isAudioMuted : true;
    let stream;
    if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
      if (captureAudio) {
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
            audio: true, preferCurrentTab: true
          });
        } catch {
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
              preferCurrentTab: true
            });
          } catch (e) {
            document.body.classList.remove('clean-capture');
            btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
            isRecording = false; setExportUiState(false); return;
          }
        }
      } else {
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
            audio: false, preferCurrentTab: true
          });
        } catch {
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
              preferCurrentTab: true
            });
          } catch (e) {
            document.body.classList.remove('clean-capture');
            btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
            isRecording = false; setExportUiState(false); return;
          }
        }
      }
    } else {
      document.body.classList.remove('clean-capture');
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false; setExportUiState(false); return;
    }

    if (!stream) {
      document.body.classList.remove('clean-capture');
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false; setExportUiState(false); return;
    }

    const tracks = [...stream.getVideoTracks()];
    if (captureAudio) {
      if (typeof audioDest !== 'undefined' && audioDest && audioDest.stream && audioDest.stream.getAudioTracks().length > 0) {
        tracks.push(audioDest.stream.getAudioTracks()[0]);
      } else if (stream.getAudioTracks().length > 0) {
        tracks.push(stream.getAudioTracks()[0]);
      }
    } else {
      if (stream && stream.getAudioTracks) {
        stream.getAudioTracks().forEach(t => { try { t.stop(); stream.removeTrack(t); } catch(e){} });
      }
    }
    const combinedStream = new MediaStream(tracks);

    const mimeType = MediaRecorder.isTypeSupported('video/mp4; codecs="avc1.42E01E"')
      ? 'video/mp4; codecs="avc1.42E01E"'
      : (MediaRecorder.isTypeSupported('video/webm; codecs=vp9') ? 'video/webm; codecs=vp9' : 'video/webm');

    const recorder = new MediaRecorder(combinedStream, { mimeType, videoBitsPerSecond: 40000000 });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      document.body.classList.remove('clean-capture');
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(chunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const baseName = (location.pathname.split('/').pop() || 'kinet-showcase.html').replace('.html', '');
      a.download = `${baseName}_${targetFps}fps.${ext}`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      if (stream && stream.getTracks) stream.getTracks().forEach(t => t.stop());
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false; setExportUiState(false);
      if (typeof tl !== 'undefined' && tl.play) tl.play();
    };

    if (typeof tl !== 'undefined' && tl.pause) {
      tl.pause(0);
      tl.play();
    }
    recorder.start(100);

    const durSeconds = typeof DURATION !== 'undefined' ? DURATION : (typeof DUR !== 'undefined' ? DUR : 8.0);
    setTimeout(() => {
      if (recorder.state === 'recording') recorder.stop();
    }, (durSeconds * 1000) + 400);

  } catch (err) {
    document.body.classList.remove('clean-capture');
    btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
    isRecording = false; setExportUiState(false);
  }
}
</script>
