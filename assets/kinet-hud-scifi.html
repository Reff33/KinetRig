<!doctype html>
<html lang="en">
<!-- KinetRig v1.0.0 by Reff33 - Sci-Fi Diagnostic Telemetry HUD (MIT) -->
<head>
<meta charset="utf-8">
<title>KinetRig — Sci-Fi HUD (240 FPS)</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
:root {
  --primary: #00F5FF;
  --primary-glow: rgba(0, 245, 255, 0.45);
  --accent: #FFB800;
  --bg: #03060B;
  --font-mono: "JetBrains Mono", monospace;
  --font-main: "Plus Jakarta Sans", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family:var(--font-mono); color:#FFF; }

#stage {
  position: fixed; left:50%; top:50%; width:1920px; height:1080px;
  transform: translate(-50%, -50%) scale(1);
  background: radial-gradient(circle at 50% 50%, #071520 0%, var(--bg) 80%);
  overflow: hidden; display: flex; align-items: center; justify-content: center;
}

.hud-grid {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.18;
  background-size: 60px 60px;
  background-image:
    linear-gradient(to right, rgba(0, 245, 255, 0.2) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0, 245, 255, 0.2) 1px, transparent 1px);
}

.hud-core {
  position: relative; width: 700px; height: 700px;
  display: flex; align-items: center; justify-content: center;
}

.reticle-ring {
  position: absolute; border-radius: 50%; border: 1px dashed rgba(0, 245, 255, 0.35);
  pointer-events: none;
}
.ring-outer { width: 620px; height: 620px; border: 1.5px solid rgba(0, 245, 255, 0.4); border-top-color: transparent; }
.ring-mid { width: 440px; height: 440px; border: 2px dashed rgba(0, 245, 255, 0.5); }
.ring-inner { width: 280px; height: 280px; border: 1px solid rgba(255, 184, 0, 0.5); border-left-color: transparent; }

.target-cross {
  position: absolute; width: 100%; height: 100%; pointer-events: none;
}
.target-cross::before {
  content: ""; position: absolute; left: 50%; top: 40px; bottom: 40px; width: 1px;
  background: linear-gradient(180deg, transparent, rgba(0, 245, 255, 0.4), transparent);
}
.target-cross::after {
  content: ""; position: absolute; top: 50%; left: 40px; right: 40px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.4), transparent);
}

.hud-center-data {
  text-align: center; z-index: 5;
}
.hud-status-badge {
  display: inline-block; background: rgba(0, 245, 255, 0.15); border: 1px solid var(--primary);
  color: var(--primary); font-size: 14px; font-weight: 800; padding: 4px 14px; border-radius: 4px;
  letter-spacing: 0.14em; margin-bottom: 12px; box-shadow: 0 0 16px var(--primary-glow);
}
.hud-big-num {
  font-size: 72px; font-weight: 800; color: #FFF; line-height: 1; letter-spacing: -0.02em;
  text-shadow: 0 0 24px var(--primary-glow);
}
.hud-sub-label {
  font-size: 14px; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.2em; margin-top: 8px;
}

/* Flanking Telemetry Panels */
.telemetry-left, .telemetry-right {
  position: absolute; top: 50%; transform: translateY(-50%); width: 380px;
  display: flex; flex-direction: column; gap: 16px;
}
.telemetry-left { left: 140px; }
.telemetry-right { right: 140px; }

.data-card {
  background: rgba(10, 20, 32, 0.7); border: 1px solid rgba(0, 245, 255, 0.25);
  border-left: 3px solid var(--primary); border-radius: 8px; padding: 18px 22px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 0; transform: translateX(-20px);
}
.telemetry-right .data-card { border-left: 1px solid rgba(0, 245, 255, 0.25); border-right: 3px solid var(--accent); transform: translateX(20px); }
.data-card-title { font-size: 12px; color: #64748B; text-transform: uppercase; letter-spacing: 0.15em; }
.data-card-val { font-size: 24px; font-weight: 700; color: #FFF; margin-top: 4px; }

/* 240 FPS Export & HUD Controls */
.top-bar { position: fixed; top: 20px; right: 24px; display: flex; align-items: center; gap: 10px; z-index: 100; }
.btn-action {
  background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(0, 245, 255, 0.35);
  color: #FFF; font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  padding: 8px 16px; border-radius: 9999px; cursor: pointer;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: inline-flex; align-items: center; gap: 8px;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}
.btn-action:hover { border-color: var(--primary); box-shadow: 0 0 16px var(--primary-glow); transform: translateY(-1px); }
.btn-action.active { background: rgba(0, 245, 255, 0.22); border-color: var(--primary); }
.btn-action svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; }

#ui {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; padding: 8px 18px;
  border-radius: 9999px; background: rgba(9, 14, 26, 0.90);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(0, 245, 255, 0.35);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 245, 255, 0.15);
  font-family: var(--font-mono); font-size: 13px; color: #94A3B8; z-index: 90;
  transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
}
#ui.hidden { opacity: 0; pointer-events: none; transform: translate(-50%, 14px); }
#ui button {
  background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14);
  color: #F8FAFC; font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 6px 14px; border-radius: 9999px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; outline: none;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1); letter-spacing: 0.02em;
}
#ui button:hover { background: rgba(0, 245, 255, 0.2); border-color: var(--primary); color: #FFF; box-shadow: 0 0 14px var(--primary-glow); transform: translateY(-1px); }
#ui button:active { transform: translateY(0) scale(0.96); }
#ui button#btn-audio { padding: 6px 10px; }
#ui button.muted { opacity: 0.6; color: #94A3B8; }
#scrub { width: 340px; height: 6px; accent-color: var(--primary); border-radius: 3px; cursor: pointer; background: rgba(255, 255, 255, 0.18); outline: none; }
#clock { font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; color: #E2E8F0; font-weight: 600; }

body.clean-capture .top-bar, body.clean-capture #ui,
body.clean-mode .top-bar, body.clean-mode #ui { display: none !important; opacity: 0 !important; visibility: hidden !important; }
body.clean-capture, body.clean-mode { cursor: none !important; }

/* Export Dropdown & FPS Menu */
.export-dropdown { position: relative; }
.fps-menu {
  display: none; position: absolute; top: calc(100% + 8px); right: 0;
  background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(0, 245, 255, 0.35);
  border-radius: 12px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 20px rgba(0,245,255,0.15);
  padding: 6px; min-width: 175px; z-index: 120; flex-direction: column; gap: 3px;
}
.fps-menu.open { display: flex; }
.fps-item {
  background: transparent; border: none; color: #E2E8F0;
  font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 8px 10px; border-radius: 8px; text-align: left; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  transition: all 0.15s ease; width: 100%; box-sizing: border-box;
}
.fps-item:hover {
  background: rgba(0, 245, 255, 0.2); color: #00F5FF; transform: translateX(2px);
}
.fps-item.danger:hover {
  background: rgba(239, 68, 68, 0.2); color: #F87171;
}

</style>
</head>
<body>

<div class="top-bar">
  <button class="btn-action active" id="btn-hud" title="Toggle HUD (H)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>HUD (H)</span>
  </button>
    <div class="export-dropdown" style="position: relative;">
    <button class="btn-action" id="btn-export" title="Select Framerate & Export Video">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span id="btn-export-text" style="display:inline-flex;align-items:center;gap:4px;">Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240</span>
      <svg style="width:11px;height:11px;stroke:currentColor;stroke-width:2.5;fill:none;margin-left:2px;" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="fps-menu" id="fps-menu">
      <div id="fps-options-group">
        <div style="font-size: 10px; color: #64748B; font-weight: 700; text-transform: uppercase; padding: 4px 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 4px;">Choose Framerate</div>
        <button class="fps-item" data-fps="240"><span>240 FPS (Studio)</span><span style="font-size:10px;color:var(--primary, #00F5FF);background:rgba(0,245,255,0.15);padding:2px 6px;border-radius:4px;">True HFR</span></button>
        <button class="fps-item" data-fps="144"><span>144 FPS</span></button>

      </div>

        <div style="font-size: 10px; color: #64748B; font-weight: 700; text-transform: uppercase; padding: 4px 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 4px;">Render Controls</div>
        <button class="fps-item" id="btn-render-pause">
          <svg id="icon-pause" viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          <svg id="icon-resume" viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:currentColor;stroke-width:1;display:none;"><polygon points="6 4 20 12 6 20 6 4"/></svg>
          <span id="label-render-pause">Pause Render</span>

        <button class="fps-item danger" id="btn-render-cancel" style="color: #f87171;">
          <svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span>Cancel Render</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="stage">
  <div class="hud-grid"></div>

  <div class="telemetry-left" id="t-left">
    <div class="data-card">
      <div class="data-card-title">Compute Cluster</div>
      <div class="data-card-val">NODE-07 ACTIVE</div>
    </div>
    <div class="data-card">
      <div class="data-card-title">Memory Bandwidth</div>
      <div class="data-card-val">3.2 TB/s</div>
    </div>
  </div>

  <div class="hud-core" id="core">
    <div class="reticle-ring ring-outer" id="r-out"></div>
    <div class="reticle-ring ring-mid" id="r-mid"></div>
    <div class="reticle-ring ring-inner" id="r-in"></div>
    <div class="target-cross"></div>

    <div class="hud-center-data" id="center-data">
      <div class="hud-status-badge">TARGET LOCKED</div>
      <div class="hud-big-num" id="metric">0.24ms</div>
      <div class="hud-sub-label">Dispatch Latency</div>
    </div>
  </div>

  <div class="telemetry-right" id="t-right">
    <div class="data-card">
      <div class="data-card-title">Thermal Sensor</div>
      <div class="data-card-val">42.8 °C</div>
    </div>
    <div class="data-card">
      <div class="data-card-title">Security State</div>
      <div class="data-card-val" style="color:var(--accent);">ENCLAVE SECURE</div>
    </div>
  </div>
</div>

<div id="ui">
  <button id="btn-play">Pause</button>
  <button id="btn-audio" title="Mute/Unmute Audio (M)">
    <svg id="icon-audio-on" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <svg id="icon-audio-off" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  </button>
  <input type="range" id="scrub" min="0" max="1000" value="0">
  <span id="clock">0.00s</span>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let isRecording = false;

const DURATION = 6.0;
const tl = gsap.timeline({ paused: true });

/* ============ AUDIO SYNTHESIS & MOTIVATED SFX ============ */
let audioCtx = null, audioDest = null, mainMasterGain = null;
let isAudioMuted = false;

const btnAudio = $('#btn-audio'), iconAudioOn = $('#icon-audio-on'), iconAudioOff = $('#icon-audio-off');
function toggleAudio() {
  isAudioMuted = !isAudioMuted;
  if (iconAudioOn) iconAudioOn.style.display = isAudioMuted ? 'none' : 'block';
  if (iconAudioOff) iconAudioOff.style.display = isAudioMuted ? 'block' : 'none';
  if (btnAudio) btnAudio.classList.toggle('muted', isAudioMuted);
  if (mainMasterGain && audioCtx) {
    mainMasterGain.gain.setValueAtTime(isAudioMuted ? 0 : 1, audioCtx.currentTime);
  }
}
if (btnAudio) btnAudio.onclick = toggleAudio;

function initAudio() {
  if (!audioCtx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) {
      audioCtx = new AudioCtx();
      mainMasterGain = audioCtx.createGain();
      mainMasterGain.gain.value = isAudioMuted ? 0 : 1;
      mainMasterGain.connect(audioCtx.destination);
      try {
        audioDest = audioCtx.createMediaStreamDestination();
        mainMasterGain.connect(audioDest);
      } catch (e) {}
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playRadarBeep(freq = 1200) {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running') return;
  const now = ctx.currentTime;
  try {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.2, now + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
    osc.connect(g); g.connect(mainMasterGain || ctx.destination);
    osc.start(now); osc.stop(now + 0.14);
  } catch (e) {}
}

const fit = () => {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('#stage').style.transform = `translate(-50%, -50%) scale(${s})`;
};
addEventListener('resize', fit); fit();

/* ============ HUD ROTATION & TELEMETRY TIMELINE ============ */
tl.fromTo('#core',
  { opacity: 0, scale: 0.7 },
  { opacity: 1, scale: 1, duration: 0.9, ease: 'back.out(1.8)' },
  0.20
);
tl.call(() => playRadarBeep(980), null, 0.20);

// Continuous deterministic rotation of reticles
tl.to('#r-out', { rotate: 360, duration: 6.0, ease: 'none' }, 0);
tl.to('#r-mid', { rotate: -360, duration: 4.5, ease: 'none' }, 0);
tl.to('#r-in', { rotate: 360, duration: 3.0, ease: 'none' }, 0);

// Flanking telemetry entrance
tl.fromTo($$('.telemetry-left .data-card'),
  { opacity: 0, x: -30 },
  { opacity: 1, x: 0, duration: 0.5, stagger: 0.15, ease: 'power2.out' },
  0.60
);
tl.call(() => playRadarBeep(1400), null, 0.60);

tl.fromTo($$('.telemetry-right .data-card'),
  { opacity: 0, x: 30 },
  { opacity: 1, x: 0, duration: 0.5, stagger: 0.15, ease: 'power2.out' },
  0.80
);
tl.call(() => playRadarBeep(1600), null, 0.80);

tl.to({}, { duration: 0.01 }, DURATION);

/* ============ CONTROLS & AUTO-LOOP ============ */
const clock = $('#clock'), scrub = $('#scrub'), btnPlay = $('#btn-play');
let scrubbing = false;

(function frame() {
  requestAnimationFrame(frame);
  const t = tl.time();
  const curDisplay = Math.min(t, DURATION);
  if (clock) clock.textContent = curDisplay.toFixed(2) + 's';
  if (!scrubbing && scrub) scrub.value = String((curDisplay / DURATION) * 1000);
  if (btnPlay) btnPlay.textContent = tl.paused() ? 'Play' : 'Pause';
  if (!isRecording && !location.search.includes('clean') && (t >= DURATION || tl.progress() >= 1)) {
    tl.pause(0);
    tl.play(0);
  }
})();

const toggle = () => {
  if (tl.paused() || tl.progress() >= 1) {
    if (tl.progress() >= 1) tl.progress(0);
    initAudio();
    tl.play();
    if (btnPlay) btnPlay.textContent = 'Pause';
  } else {
    tl.pause();
    if (btnPlay) btnPlay.textContent = 'Play';
  }
};
if (btnPlay) btnPlay.onclick = toggle;

if (scrub) {
  scrub.addEventListener('pointerdown', () => { scrubbing = true; tl.pause(); if (btnPlay) btnPlay.textContent = 'Play'; });
  addEventListener('pointerup', () => scrubbing = false);
  scrub.addEventListener('input', () => { tl.pause(); tl.time((scrub.value / 1000) * DURATION); });
}

const btnHud = $('#btn-hud'), ui = $('#ui');
function toggleHud() {
  const isHidden = ui.classList.toggle('hidden');
  if (btnHud) btnHud.classList.toggle('active', !isHidden);
}
if (btnHud) btnHud.onclick = toggleHud;

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'h' || e.key === 'H') toggleHud();
  else if (e.key === 'm' || e.key === 'M') toggleAudio();
  else if (e.key === 'r' || e.key === 'R') { tl.pause(0); initAudio(); tl.play(); if (btnPlay) btnPlay.textContent = 'Pause'; }
});

window.addEventListener('message', e => {
  if (e.data === 'UNLOCK_AUDIO' || (e.data && e.data.type === 'UNLOCK_AUDIO')) {
    initAudio();
  }
});

const seek = t => {
  tl.pause();
  tl.time(t, false);
  if (window.gsap && gsap.ticker && gsap.ticker.tick) gsap.ticker.tick();
};

window.OPENER = {
  W: 1920, H: 1080, DURATION, tl, ready: false, seek,
  play() { tl.play(0); initAudio(); }
};

const startPlayback = () => {
  window.OPENER.ready = true;
  if (!location.search.includes('clean')) {
    tl.play(0);
    if (btnPlay) btnPlay.textContent = 'Pause';
    tl.eventCallback('onComplete', () => {
      if (!isRecording && !location.search.includes('clean')) {
        tl.pause(0);
        tl.play(0);
      }
    });
  }
};

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(startPlayback).catch(startPlayback);
} else {
  startPlayback();
}

/* ============ 240 FPS STUDIO BRIDGE & CLEAN VIDEO EXPORTER ============ */
const EXPORT_DEFAULT_HTML = 'Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240';
const btnExport = $('#btn-export');
const btnExportLabel = $('#btn-export-text');
const fpsMenu = $('#fps-menu');
const fpsOptionsGroup = $('#fps-options-group');
const renderControlsGroup = $('#render-controls-group');
const btnRenderPause = $('#btn-render-pause');
const btnRenderCancel = $('#btn-render-cancel');
const labelRenderPause = $('#label-render-pause');
const iconPause = $('#icon-pause');
const iconResume = $('#icon-resume');

let isExporting = false;
let isRenderPaused = false;
let currentAbortController = null;
let currentEvtSource = null;

function setExportUiState(exporting) {
  isExporting = exporting;
  if (fpsOptionsGroup && renderControlsGroup) {
    fpsOptionsGroup.style.display = exporting ? 'none' : 'block';
    renderControlsGroup.style.display = exporting ? 'block' : 'none';
  }
  if (!exporting) {
    isRenderPaused = false;
    updatePauseButtonUi(false);
  }
}

function updatePauseButtonUi(paused) {
  if (labelRenderPause) labelRenderPause.textContent = paused ? 'Resume Render' : 'Pause Render';
  if (iconPause) iconPause.style.display = paused ? 'none' : 'inline-block';
  if (iconResume) iconResume.style.display = paused ? 'inline-block' : 'none';
}

if (btnExport && fpsMenu) {
  btnExport.onclick = (e) => {
    e.stopPropagation();
    fpsMenu.classList.toggle('open');
  };

  document.addEventListener('click', (e) => {
    if (fpsMenu && !fpsMenu.contains(e.target) && e.target !== btnExport) {
      fpsMenu.classList.remove('open');
    }
  });

  if (fpsOptionsGroup) {
    const items = fpsOptionsGroup.querySelectorAll('.fps-item');
    items.forEach(item => {
      item.onclick = (e) => {
        e.stopPropagation();
        fpsMenu.classList.remove('open');
        const chosenFps = Number(item.dataset.fps) || 240;
        startExport(chosenFps);
      };
    });
  }

  if (btnRenderPause) {
    btnRenderPause.onclick = async (e) => {
      e.stopPropagation();
      fpsMenu.classList.remove('open');
      if (!isExporting) return;
      try {
        if (!isRenderPaused) {
          await fetch('http://127.0.0.1:4004/api/pause');
          isRenderPaused = true;
          updatePauseButtonUi(true);
          btnExportLabel.textContent = btnExportLabel.textContent.replace('Rendering', 'Paused');
        } else {
          await fetch('http://127.0.0.1:4004/api/resume');
          isRenderPaused = false;
          updatePauseButtonUi(false);
          btnExportLabel.textContent = btnExportLabel.textContent.replace('Paused', 'Rendering');
        }
      } catch (err) {
        console.warn('[Pause/Resume Error]', err);
      }
    };
  }

  if (btnRenderCancel) {
    btnRenderCancel.onclick = async (e) => {
      e.stopPropagation();
      fpsMenu.classList.remove('open');
      if (!isExporting) return;
      try {
        await fetch('http://127.0.0.1:4004/api/cancel');
      } catch {}
      if (currentEvtSource) {
        currentEvtSource.close();
        currentEvtSource = null;
      }
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }
      btnExportLabel.textContent = 'Cancelled';
      setTimeout(() => {
        btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
        setExportUiState(false);
      }, 1500);
    };
  }
}

async function startExport(targetFps = 240) {
  if (isExporting || isRecording) return;
  if (typeof markUserInteracted === 'function') markUserInteracted();

  // 1. Studio Local Bridge Attempt (Deterministic 60–240 FPS Headless Render)
  let bridgeAvailable = false;
  try {
    const healthRes = await fetch('http://127.0.0.1:4004/api/health', { signal: AbortSignal.timeout(800) });
    if (healthRes.ok) bridgeAvailable = true;
  } catch {}

  if (bridgeAvailable) {
    try {
      setExportUiState(true);
      currentAbortController = new AbortController();
      btnExportLabel.textContent = `Connecting Studio...`;

      try {
        currentEvtSource = new EventSource('http://127.0.0.1:4004/api/progress');
        currentEvtSource.onmessage = e => {
          try {
            const data = JSON.parse(e.data);
            if (data.status === 'rendering' && !isRenderPaused) {
              btnExportLabel.textContent = `Rendering ${data.percent || 0}% (${targetFps} FPS)`;
            } else if (data.status === 'paused') {
              btnExportLabel.textContent = `Paused ${data.percent || 0}% (${targetFps} FPS)`;
            }
          } catch {}
        };
      } catch {}

      const templatePath = location.pathname.includes('assets/')
        ? location.pathname.substring(location.pathname.indexOf('assets/'))
        : 'assets/kinet-hud-scifi.html';

      const renderRes = await fetch(`http://127.0.0.1:4004/api/render?template=${encodeURIComponent(templatePath)}&fps=${targetFps}`, {
        signal: currentAbortController.signal
      });
      if (currentEvtSource) { currentEvtSource.close(); currentEvtSource = null; }

      if (!renderRes.ok) throw new Error(await renderRes.text());

      btnExportLabel.textContent = 'Saving MP4...';
      const blob = await renderRes.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      const baseName = templatePath.split('/').pop().replace('.html', '');
      a.download = `${baseName}_${targetFps}fps.mp4`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);

      btnExportLabel.textContent = 'Downloaded!';
      setTimeout(() => {
        btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
        setExportUiState(false);
      }, 2000);
      return;
    } catch (bridgeErr) {
      if (bridgeErr.name === 'AbortError') {
        return; // User clicked Cancel Render
      }
      console.warn('[Studio Bridge Error, falling back to browser capture]', bridgeErr);
      if (currentEvtSource) { currentEvtSource.close(); currentEvtSource = null; }
      setExportUiState(false);
    }
  }

  // 2. Studio Bridge is offline:
  const isFileOrigin = typeof location !== 'undefined' && location.protocol === 'file:';
  if (isFileOrigin || !navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    alert(`[KinetRig Studio Bridge Offline]\n\nUntuk muat turun video ${targetFps} FPS MP4 secara automatik melalui pelayar, sila jalankan arahan ini dalam terminal:\n\nnode scripts/server.mjs\n\nKemudian klik semula Download, atau buka:\nhttp://127.0.0.1:4004`);
    btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
    setExportUiState(false);
    return;
  }

  // 3. Standalone In-Browser Clean Screen Recording
  try {
    isRecording = true;
    setExportUiState(true);
    btnExportLabel.textContent = `Recording ${targetFps} FPS...`;
    document.body.classList.add('clean-capture');

    if (typeof initAudio === 'function') initAudio();
    const captureAudio = typeof isAudioMuted !== 'undefined' ? !isAudioMuted : true;
    let stream;
    if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
      if (captureAudio) {
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
            audio: true, preferCurrentTab: true
          });
        } catch {
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
              preferCurrentTab: true
            });
          } catch (e) {
            document.body.classList.remove('clean-capture');
            btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
            isRecording = false; setExportUiState(false); return;
          }
        }
      } else {
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
            audio: false, preferCurrentTab: true
          });
        } catch {
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
              preferCurrentTab: true
            });
          } catch (e) {
            document.body.classList.remove('clean-capture');
            btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
            isRecording = false; setExportUiState(false); return;
          }
        }
      }
    } else {
      document.body.classList.remove('clean-capture');
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false; setExportUiState(false); return;
    }

    if (!stream) {
      document.body.classList.remove('clean-capture');
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false; setExportUiState(false); return;
    }

    const tracks = [...stream.getVideoTracks()];
    if (captureAudio) {
      if (typeof audioDest !== 'undefined' && audioDest && audioDest.stream && audioDest.stream.getAudioTracks().length > 0) {
        tracks.push(audioDest.stream.getAudioTracks()[0]);
      } else if (stream.getAudioTracks().length > 0) {
        tracks.push(stream.getAudioTracks()[0]);
      }
    } else {
      if (stream && stream.getAudioTracks) {
        stream.getAudioTracks().forEach(t => { try { t.stop(); stream.removeTrack(t); } catch(e){} });
      }
    }
    const combinedStream = new MediaStream(tracks);

    const mimeType = MediaRecorder.isTypeSupported('video/mp4; codecs="avc1.42E01E"')
      ? 'video/mp4; codecs="avc1.42E01E"'
      : (MediaRecorder.isTypeSupported('video/webm; codecs=vp9') ? 'video/webm; codecs=vp9' : 'video/webm');

    const recorder = new MediaRecorder(combinedStream, { mimeType, videoBitsPerSecond: 40000000 });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      document.body.classList.remove('clean-capture');
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(chunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const baseName = (location.pathname.split('/').pop() || 'kinet-hud-scifi.html').replace('.html', '');
      a.download = `${baseName}_${targetFps}fps.${ext}`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      if (stream && stream.getTracks) stream.getTracks().forEach(t => t.stop());
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false; setExportUiState(false);
      if (typeof tl !== 'undefined' && tl.play) tl.play();
    };

    if (typeof tl !== 'undefined' && tl.pause) {
      tl.pause(0);
      tl.play();
    }
    recorder.start(100);

    const durSeconds = typeof DURATION !== 'undefined' ? DURATION : (typeof DUR !== 'undefined' ? DUR : 8.0);
    setTimeout(() => {
      if (recorder.state === 'recording') recorder.stop();
    }, (durSeconds * 1000) + 400);

  } catch (err) {
    document.body.classList.remove('clean-capture');
    btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
    isRecording = false; setExportUiState(false);
  }
}
</script>
