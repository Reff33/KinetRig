<style>
:root {
  --primary: #00F5FF;
  --primary-glow: rgba(0, 245, 255, 0.45);
  --accent: #3B82F6;
  --ink: #F8FAFC;
  --base: #060913;
  --font-main: "Plus Jakarta Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family:var(--font-main); color:var(--ink); }

#stage {
  position: fixed; left: 50%; top: 50%;
  width: 1920px; height: 1080px;
  transform: translate(-50%, -50%) scale(1);
  overflow: hidden; background: var(--base);
}
#world { position: absolute; inset: 0; will-change: transform; }
#gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
.bgfx {
  position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(70% 50% at 50% 100%, var(--primary-glow), transparent 70%);
}
.grain {
  position: absolute; inset: -50px; pointer-events: none; opacity: 0.15;
  background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
}
#dom { position: absolute; inset: 0; }

.scene {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; text-align: center;
}
.hero {
  font-size: 88px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1;
  text-shadow: 0 10px 40px rgba(0,0,0,0.8);
}
.hero .hl { color: var(--primary); text-shadow: 0 0 35px var(--primary-glow); }
.sub {
  font-size: 26px; font-weight: 500; color: #94A3B8; margin-top: 24px;
  max-width: 900px; line-height: 1.5;
}

/* Feature Cards & Badges */
.card-row { display: flex; gap: 24px; margin-top: 48px; }
.vector-card {
  background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(0, 245, 255, 0.25);
  backdrop-filter: blur(16px); padding: 24px 32px; border-radius: 16px;
  display: flex; align-items: center; gap: 16px; font-size: 20px; font-weight: 700;

}
.vector-card svg {
  width: 28px; height: 28px; stroke: var(--primary); stroke-width: 2; fill: none;
  filter: drop-shadow(0 0 8px var(--primary-glow));
}

/* 9:16 Vertical Safe-Zone Layout */

}

body.clean-capture, body.clean-mode { cursor: none !important; }

<script type="module">
import * as THREE from 'three';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const Q = new URLSearchParams(location.search);
let isRecording = false, isExporting = false;

/* ============ THREE.JS 144 FPS PARTICLES ============ */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
renderer.setSize(1920, 1080);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1920 / 1080, 0.1, 100);
camera.position.z = 14;

const pCount = 500;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount * 3; i += 3) {
  pPos[i] = (Math.random() - 0.5) * 24;
  pPos[i + 1] = (Math.random() - 0.5) * 14;
  pPos[i + 2] = (Math.random() - 0.5) * 20;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color: 0x00F5FF, size: 0.08, transparent: true, opacity: 0.65 });
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

const S = { camZ: 14, camX: 0, camY: 0, rotY: 0 };
const render = t => {
  particles.rotation.y = t * 0.12;
  camera.position.set(S.camX, S.camY, S.camZ);
  renderer.render(scene, camera);
};

/* ============ GSAP 144 FPS DETERMINISTIC TIMELINE ============ */
const DURATION = 10.0;
const tl = gsap.timeline({ paused: true });

/* ============ HYBRID AUDIO ENGINE (3-LAYER ACOUSTIC SANDWICH & CINEMATIC TECH SFX) ============ */
let audioCtx = null;
let audioDest = null;
let ambientStarted = false;
let ambientMaster = null;
let isAudioMuted = false;
let mainMasterGain = null;

const btnAudio = $('#btn-audio'), iconAudioOn = $('#icon-audio-on'), iconAudioOff = $('#icon-audio-off');
function toggleAudio() {
  isAudioMuted = !isAudioMuted;
  if (iconAudioOn) iconAudioOn.style.display = isAudioMuted ? 'none' : 'block';
  if (iconAudioOff) iconAudioOff.style.display = isAudioMuted ? 'block' : 'none';
  if (btnAudio) {
    btnAudio.classList.toggle('muted', isAudioMuted);
    btnAudio.title = isAudioMuted ? 'Unmute Audio (M)' : 'Mute Audio (M)';
  }
  if (mainMasterGain && audioCtx) {
    mainMasterGain.gain.setValueAtTime(isAudioMuted ? 0 : 1, audioCtx.currentTime);
  }
}
if (btnAudio) btnAudio.onclick = toggleAudio;

const SFX_CDN_BASE = 'https://raw.githubusercontent.com/wyzowl/sfx-kit/main';
const STUDIO_SFX = {
  'impact-deep-soft': 'sounds/impacts/impact-deep-soft.wav',
  'tone-step-2': 'sounds/tones/tone-step-2.wav',
  'pop-small-in': 'sounds/pops/pop-small-in.wav',
  'pop-medium-in': 'sounds/pops/pop-medium-in.wav',
  'tone-ding-high': 'sounds/tones/tone-ding-high.wav',
  'whoosh-slow-soft': 'sounds/whooshes/whoosh-slow-soft.wav',
  'whoosh-medium-soft': 'sounds/whooshes/whoosh-medium-soft.wav',
  'digital-blip-clear': 'sounds/digital/digital-blip-clear.wav',
  'riser-1s-soft': 'sounds/risers-and-fallers/riser-1s-soft.wav'
};

const sfxRawBuffers = {};
const sfxAudioBuffers = {};

async function fetchSfxArrayBuffer(rel) {
  const isHttp = typeof location !== 'undefined' && location.protocol ? location.protocol.startsWith('http') : false;
  if (!isHttp && typeof navigator !== 'undefined' && navigator.onLine === false) return null;
  const tryUrls = isHttp
    ? ['../sfx/' + rel, '../../sfx/' + rel, 'sfx/' + rel, `${SFX_CDN_BASE}/${rel}`]
    : [`${SFX_CDN_BASE}/${rel}`];
  for (const u of tryUrls) {
    try {
      const res = await fetch(u);
      if (res.ok) return await res.arrayBuffer();
    } catch (e) {}
  }
  return null;
}

// Immediately initiate background prefetching
for (const [id, rel] of Object.entries(STUDIO_SFX)) {
  fetchSfxArrayBuffer(rel).then(ab => {
    if (ab) {
      sfxRawBuffers[id] = ab;
      if (audioCtx) {
        audioCtx.decodeAudioData(ab.slice(0)).then(decoded => {
          sfxAudioBuffers[id] = decoded;
        }).catch(() => {});
      }
    }
  });
}

function startAmbientBed() {
  if (ambientStarted || !audioCtx || audioCtx.state !== 'running') return;
  ambientStarted = true;
  try {
    // Layer 1: Ambient analog room tone & cyber drone (-26dB)
    ambientMaster = audioCtx.createGain();
    ambientMaster.gain.setValueAtTime(0.04, audioCtx.currentTime);

    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(50, audioCtx.currentTime);

    const bufLen = Math.floor(audioCtx.sampleRate * 2);
    const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    let b0 = 0, b1 = 0;
    for (let i = 0; i < bufLen; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.98 * b0 + white * 0.02;
      b1 = 0.95 * b1 + white * 0.05;
      data[i] = (b0 + b1) * 0.25;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(180, audioCtx.currentTime);

    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    osc.connect(oscGain);
    oscGain.connect(ambientMaster);

    noise.connect(filter);
    filter.connect(ambientMaster);

    ambientMaster.connect(mainMasterGain || audioCtx.destination);
    if (audioDest && !mainMasterGain) ambientMaster.connect(audioDest);

    osc.start();
    noise.start();
  } catch (e) {}
}

let hasUserInteracted = false;
const hasBrowserGesture = () => (typeof navigator === 'undefined' || !navigator.userActivation || navigator.userActivation.hasBeenActive);
function markUserInteracted() {
  if (!hasBrowserGesture()) return;
  hasUserInteracted = true;
  initAudio();
}
window.addEventListener('pointerdown', markUserInteracted, { capture: true });
window.addEventListener('click', markUserInteracted, { capture: true });
window.addEventListener('keydown', markUserInteracted, { capture: true });
window.addEventListener('message', e => {
  if (e.data === 'UNLOCK_AUDIO' || (e.data && e.data.type === 'UNLOCK_AUDIO')) {
    markUserInteracted();
  }
});

const initAudio = () => {
  if (!hasUserInteracted || !hasBrowserGesture()) return null;
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
      mainMasterGain = audioCtx.createGain();
      mainMasterGain.gain.value = isAudioMuted ? 0 : 1;
      mainMasterGain.connect(audioCtx.destination);
      try {
        audioDest = audioCtx.createMediaStreamDestination();
        mainMasterGain.connect(audioDest);
      } catch (e) {}
    }
  }
  if (audioCtx) {
    if (hasUserInteracted && audioCtx.state === 'suspended') {
      audioCtx.resume().then(() => {
        startAmbientBed();
      }).catch(() => {});
    }
    for (const [id, ab] of Object.entries(sfxRawBuffers)) {
      if (!sfxAudioBuffers[id]) {
        audioCtx.decodeAudioData(ab.slice(0)).then(decoded => {
          sfxAudioBuffers[id] = decoded;
        }).catch(() => {});
      }
    }
    if (audioCtx.state === 'running') {
      startAmbientBed();
    }
  }
  return audioCtx;
};

function triggerSfx(sfxId, fallbackFn, gain = 0.5) {
  if (!hasUserInteracted && (!audioCtx || audioCtx.state !== 'running')) return;
  const ctx = initAudio();
  if (ctx && ctx.state === 'running' && sfxAudioBuffers[sfxId]) {
    try {
      const src = ctx.createBufferSource();
      src.buffer = sfxAudioBuffers[sfxId];
      const g = ctx.createGain();
      g.gain.setValueAtTime(gain, ctx.currentTime);
      src.connect(g);
      g.connect(mainMasterGain || ctx.destination);
      if (audioDest && !mainMasterGain) g.connect(audioDest);
      src.start();
      return;
    } catch (e) {}
  }
  if (ctx && ctx.state === 'running' && typeof fallbackFn === 'function') fallbackFn();
}

/* ============ ZERO-DEPENDENCY PROCEDURAL FALLBACK SYNTHESIZERS ============ */
function playImpact() {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running') return;
  const now = ctx.currentTime;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.35);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.35, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.38);

    osc.connect(gain);
    gain.connect(mainMasterGain || ctx.destination);
    if (audioDest && !mainMasterGain) gain.connect(audioDest);
    osc.start(now);
    osc.stop(now + 0.4);

    const sheen = ctx.createOscillator();
    const sheenGain = ctx.createGain();
    sheen.type = 'sine';
    sheen.frequency.setValueAtTime(520, now);
    sheen.frequency.exponentialRampToValueAtTime(320, now + 0.12);

    sheenGain.gain.setValueAtTime(0.0001, now);
    sheenGain.gain.linearRampToValueAtTime(0.08, now + 0.008);
    sheenGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);

    sheen.connect(sheenGain);
    sheenGain.connect(mainMasterGain || ctx.destination);
    if (audioDest && !mainMasterGain) sheenGain.connect(audioDest);
    sheen.start(now);
    sheen.stop(now + 0.16);
  } catch (e) {}
}

function playTerminalChirp() {

function playWhoosh() {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running') return;
  const now = ctx.currentTime;
  try {
    const bufLen = Math.floor(ctx.sampleRate * 0.3);
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let b0 = 0, b1 = 0;
    for (let i = 0; i < bufLen; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.95 * b0 + white * 0.05;
      b1 = 0.9 * b1 + white * 0.1;
      const env = Math.sin((i / bufLen) * Math.PI);
      data[i] = (b0 + b1) * env * 1.5;
    }
    const node = ctx.createBufferSource();
    node.buffer = buf;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.setValueAtTime(1.2, now);
    filter.frequency.setValueAtTime(350, now);
    filter.frequency.exponentialRampToValueAtTime(1100, now + 0.15);
    filter.frequency.exponentialRampToValueAtTime(450, now + 0.3);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.18, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);

    node.connect(filter);
    filter.connect(gain);
    gain.connect(mainMasterGain || ctx.destination);
    if (audioDest && !mainMasterGain) gain.connect(audioDest);
    node.start(now);
  } catch (e) {}
}

const TARGET_BRIDGE_VERSION = '1.1.4';
function compareBridgeVersion(a, b) {
  const pa = String(a || '0.0.0').split('.').map(n => parseInt(n, 10) || 0);
  const pb = String(b || '0.0.0').split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pa[i] || 0) - (pb[i] || 0);

}

/* ---- Studio Bridge discovery: live settings -> same origin -> same host -> loopback ---- */
const BRIDGE_CANDIDATES = (() => {
  const out = [];
  try {
    const customUrl = localStorage.getItem('kinet_bridge_url');
    if (customUrl) out.push(customUrl.replace(/\/+$/, ''));
  } catch {}
  try {
    const q = new URLSearchParams(location.search).get('bridge');
    if (q) out.push(q.replace(/\/+$/, ''));
  } catch {}
  const p = location.protocol, host = location.hostname, org = location.origin;
  if (p === 'http:' || p === 'https:') {
    if (org && org !== 'null') out.push(org);
    if (host) out.push('http://' + host + ':4004');
  }
  out.push('http://127.0.0.1:4004', 'http://localhost:4004');
  return out.filter((v, i) => out.indexOf(v) === i);
})();
let BRIDGE = 'http://127.0.0.1:4004';
(() => {
  const _s = readSavedSettings();
  if (_s.host && _s.port) BRIDGE = 'http://' + (_s.host === '0.0.0.0' ? '127.0.0.1' : _s.host) + ':' + _s.port;
  if (_s.encoder) activeEncoder = _s.encoder;
  if (_s.defaultFps) syncDefaultFpsUi(_s.defaultFps);
})();
window.addEventListener('message', e => {
  if (e.data?.type === 'UPDATE_SETTINGS') {
    if (e.data.bridgeUrl) BRIDGE = e.data.bridgeUrl.replace(/\/+$/, '');
    if (e.data.settings?.encoder) activeEncoder = e.data.settings.encoder;
    if (e.data.settings?.defaultFps) syncDefaultFpsUi(e.data.settings.defaultFps);
  }
});
async function resolveBridge() {
  const s = readSavedSettings();
  const liveCandidates = [];
  if (BRIDGE) liveCandidates.push(BRIDGE.replace(/\/+$/, ''));
  try {
    const u = localStorage.getItem('kinet_bridge_url');
    if (u) liveCandidates.push(u.replace(/\/+$/, ''));
  } catch {}
  if (s.host && s.port) {
    liveCandidates.push(`http://${s.host === '0.0.0.0' ? '127.0.0.1' : s.host}:${s.port}`);
  }
  for (const c of BRIDGE_CANDIDATES) liveCandidates.push(c);
  const ordered = liveCandidates.filter((v, i) => v && liveCandidates.indexOf(v) === i);

  let outdatedBase = null;
  for (const base of ordered) {
    try {
      const r = await fetch(base + '/api/health', { signal: AbortSignal.timeout(1000) });
      if (r.ok) {
        const info = await r.json().catch(() => ({}));
        if (info && info.version && compareBridgeVersion(info.version, TARGET_BRIDGE_VERSION) >= 0) {
          BRIDGE = base;
          return true;
        }
        if (!outdatedBase) outdatedBase = base;
      }
    } catch {}
  }

  if (outdatedBase) {
    try {
      await fetch(`${outdatedBase}/api/restart`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host: s.host || '127.0.0.1', port: Number(s.port) || 4004 }),
        signal: AbortSignal.timeout(2000)
      });
      await new Promise(res => setTimeout(res, 700));
      const targetCheck = (s.host && s.port)
        ? `http://${s.host === '0.0.0.0' ? '127.0.0.1' : s.host}:${s.port}`
        : outdatedBase;
      for (let i = 0; i < 6; i++) {
        try {
          const r = await fetch(targetCheck + '/api/health', { signal: AbortSignal.timeout(900) });
          if (r.ok) { BRIDGE = targetCheck; return true; }
        } catch {}
        await new Promise(res => setTimeout(res, 300));
      }
    } catch {}
  }

  try {
    const qs = `?restart=1&host=${encodeURIComponent(s.host || '127.0.0.1')}&port=${Number(s.port) || 4004}`;
    const endpoints = [
      `http://127.0.0.1/KinetRig/api/bridge.php${qs}`,
      `http://localhost/KinetRig/api/bridge.php${qs}`,
      ...(location.protocol.startsWith('http') && location.origin && location.origin !== 'null' && location.port !== '4004'
        ? [`${location.origin}/api/bridge.php${qs}`, `${location.origin}/KinetRig/api/bridge.php${qs}`]
        : [])
    ];
    for (const ep of endpoints) {
      try {
        const h = await fetch(ep, { signal: AbortSignal.timeout(4500) });
        if (h.ok) {
          const res = await h.json();
          if (res.ok) {
            BRIDGE = res.bridge || BRIDGE;
            return true;
          }
        }
      } catch {}
    }
  } catch {}

  if (outdatedBase) {
    BRIDGE = outdatedBase;
    return true;
  }
  return false;
}

const btnExport = $('#btn-export');
const btnExportLabel = $('#btn-export-text');
const fpsMenu = $('#fps-menu');
const fpsOptionsGroup = $('#fps-options-group');
const renderControlsGroup = $('#render-controls-group');
const btnRenderPause = $('#btn-render-pause');
const btnRenderCancel = $('#btn-render-cancel');
const labelRenderPause = $('#label-render-pause');
const iconPause = $('#icon-pause');
const iconResume = $('#icon-resume');

let isRenderPaused = false;
let currentAbortController = null;
let currentEvtSource = null;

function setExportUiState(exporting) {
  isExporting = exporting;
  if (fpsOptionsGroup && renderControlsGroup) {
    fpsOptionsGroup.style.display = exporting ? 'none' : 'block';
    renderControlsGroup.style.display = exporting ? 'block' : 'none';
  }
  if (!exporting) {
    isRenderPaused = false;
    updatePauseButtonUi(false);
  }
}

function updatePauseButtonUi(paused) {
  if (labelRenderPause) labelRenderPause.textContent = paused ? 'Resume Render' : 'Pause Render';
  if (iconPause) iconPause.style.display = paused ? 'none' : 'inline-block';
  if (iconResume) iconResume.style.display = paused ? 'inline-block' : 'none';
}

if (btnExport && fpsMenu) {
  btnExport.onclick = (e) => {
    e.stopPropagation();
    fpsMenu.classList.toggle('open');
  };

  document.addEventListener('click', (e) => {
    if (fpsMenu && !fpsMenu.contains(e.target) && e.target !== btnExport) {
      fpsMenu.classList.remove('open');
    }
  });

  $$('#fps-options-group .fps-item').forEach(item => {
    item.onclick = (e) => {
      e.stopPropagation();
      fpsMenu.classList.remove('open');
      const chosenFps = Number(item.dataset.fps) || 240;
      startExport(chosenFps);
    };
  });

  if (btnRenderPause) {
    btnRenderPause.onclick = async (e) => {
      e.stopPropagation();
      fpsMenu.classList.remove('open');
      if (!isExporting) return;
      try {
        if (!isRenderPaused) {
          await fetch(`${BRIDGE}/api/pause`);
          isRenderPaused = true;
          updatePauseButtonUi(true);
          btnExportLabel.textContent = btnExportLabel.textContent.replace('Rendering', 'Paused');
        } else {
          await fetch(`${BRIDGE}/api/resume`);
          isRenderPaused = false;
          updatePauseButtonUi(false);
          btnExportLabel.textContent = btnExportLabel.textContent.replace('Paused', 'Rendering');
        }
      } catch (err) {
        console.warn('[Pause/Resume Error]', err);
      }
    };
  }

  if (btnRenderCancel) {
    btnRenderCancel.onclick = async (e) => {
      e.stopPropagation();
      fpsMenu.classList.remove('open');
      if (!isExporting) return;
      try {
        await fetch(`${BRIDGE}/api/cancel`);
      } catch {}
      if (currentEvtSource) {
        currentEvtSource.close();
        currentEvtSource = null;
      }
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }
      btnExportLabel.textContent = 'Cancelled';
      setTimeout(() => {
        btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
        setExportUiState(false);
      }, 1500);
    };
  }
}

async function startExport(targetFps = activeDefaultFps) {
  if (isExporting || isRecording) return;
  markUserInteracted();

  // 1. Studio Local Bridge Attempt (Deterministic 60–240 FPS Headless Render)
  if (await resolveBridge()) {
    try {
      setExportUiState(true);
      currentAbortController = new AbortController();
      btnExportLabel.textContent = `Connecting Studio...`;

      try {
        currentEvtSource = new EventSource(`${BRIDGE}/api/progress`);
        currentEvtSource.onmessage = e => {
          try {
            const data = JSON.parse(e.data);
            if (data.status === 'rendering' && !isRenderPaused) {
              btnExportLabel.textContent = `Rendering ${data.percent || 0}% (${targetFps} FPS)`;
            } else if (data.status === 'paused') {
              btnExportLabel.textContent = `Paused ${data.percent || 0}% (${targetFps} FPS)`;
            }
          } catch {}
        };
      } catch {}

      const isBridgeAsset = typeof BRIDGE === 'string' && BRIDGE && location.origin === BRIDGE && location.pathname.includes('assets/');
      const templatePath = isBridgeAsset
        ? location.pathname.substring(location.pathname.indexOf('assets/'))
        : location.href.split('#')[0].split('?')[0];

      const reqEncoder = activeEncoder || readSavedSettings().encoder || 'auto';
      const renderRes = await fetch(`${BRIDGE}/api/render?template=${encodeURIComponent(templatePath)}&fps=${targetFps}&encoder=${encodeURIComponent(reqEncoder)}&muted=${typeof isAudioMuted!=='undefined'&&isAudioMuted?1:0}`, {
        signal: currentAbortController.signal
      });
      if (currentEvtSource) { currentEvtSource.close(); currentEvtSource = null; }

      if (!renderRes.ok) { const errTxt = await renderRes.text(); let errMsg = errTxt; try { errMsg = JSON.parse(errTxt).error || errTxt; } catch {} throw new Error(errMsg || `HTTP ${renderRes.status}`); }

      btnExportLabel.textContent = 'Saving MP4...';
      const blob = await renderRes.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      const pathSegs = decodeURIComponent(location.pathname || '').replace(/\/+$/, '').split('/').filter(Boolean);
      const rawLast = (pathSegs[pathSegs.length - 1] || '').replace(/\.html?$/i, '');
      const parentSeg = pathSegs.length > 1 ? pathSegs[pathSegs.length - 2] : '';
      const baseName = ((!rawLast || rawLast.toLowerCase() === 'index')
        ? ((parentSeg && !/^[a-zA-Z]:$/.test(parentSeg) ? parentSeg : '') || location.hostname || 'kinet-render')
        : rawLast).replace(/[^a-zA-Z0-9._-]+/g, '_').replace(/^_+|_+$/g, '') || 'kinet-render';
      a.download = `${baseName}_${targetFps}fps.mp4`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);

      const fbReason = renderRes.headers?.get?.('X-KinetRig-Fallback-Reason');
      if (fbReason) console.warn('[Studio Bridge Encoder Fallback]', fbReason);
      btnExportLabel.textContent = fbReason ? 'Downloaded (CPU)' : 'Downloaded!';
      setTimeout(() => {
        btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
        setExportUiState(false);
      }, 2000);
      return;
    } catch (bridgeErr) {
      if (bridgeErr.name === 'AbortError') return;
      console.error('[Studio Bridge Render Error]', bridgeErr);
      if (currentEvtSource) { currentEvtSource.close(); currentEvtSource = null; }
      setExportUiState(false);
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      alert(`[Ralat Render Studio Bridge]\n\n${bridgeErr.message || 'Render terhenti.'}`);
      return;
    }
  }

  // Studio bridge offline: maklumkan pengguna untuk hidupkan bridge (tanpa screen-share)
  if (!window.__bridgeRetried && confirm(`[KinetRig Studio Bridge Diperlukan]\n\nEksport visual ${targetFps} FPS memerlukan Studio Bridge tempatan.\n\nLangkah mudah:\n1. Klik dua kali "start-studio.bat" dalam folder projek, ATAU\n2. Jalankan arahan di terminal: node scripts/server.mjs\n\nKlik OK untuk sambung semula selepas bridge dihidupkan.`)) {
    window.__bridgeRetried = true;
    if (await resolveBridge()) { window.__bridgeRetried = false; return startExport(targetFps); }
    window.__bridgeRetried = false;
    alert('Bridge belum dapat dikesan. Sila pastikan start-studio.bat telah dibuka.');
  }
  btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
  setExportUiState(false);
  return;

  // 3. Standalone In-Browser Clean Screen Recording (Zero Server Dependency, Zero Console Errors)
  try {
    isRecording = true;
    setExportUiState(true);
    btnExportLabel.textContent = `Recording ${targetFps} FPS...`;
    document.body.classList.add('clean-capture');

    initAudio();
    const captureAudio = !isAudioMuted;
    let stream;
    if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
      if (captureAudio) {
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
            audio: true, preferCurrentTab: true
          });
        } catch {
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
              preferCurrentTab: true
            });
          } catch (e) {
            document.body.classList.remove('clean-capture');
            btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
            isRecording = false; return;
          }
        }
      } else {
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
            audio: false, preferCurrentTab: true
          });
        } catch {
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
              preferCurrentTab: true
            });
          } catch (e) {
            document.body.classList.remove('clean-capture');
            btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
            isRecording = false; return;
          }
        }
        if (stream) {
          stream.getAudioTracks().forEach(t => {
            t.stop();
            stream.removeTrack(t);
          });
        }
      }
    } else {
      stream = canvas.captureStream(targetFps);
    }

    if (!stream) {
      document.body.classList.remove('clean-capture');
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false; return;
    }

    // Combine visual video stream with procedural Web Audio destination track
    const tracks = [...stream.getVideoTracks()];
    if (captureAudio) {
      if (audioDest && audioDest.stream && audioDest.stream.getAudioTracks().length > 0) {
        tracks.push(audioDest.stream.getAudioTracks()[0]);
      } else if (stream.getAudioTracks().length > 0) {
        tracks.push(stream.getAudioTracks()[0]);
      }
    }
    const combinedStream = new MediaStream(tracks);

    const mimeType = MediaRecorder.isTypeSupported('video/mp4; codecs="avc1.42E01E"')
      ? 'video/mp4; codecs="avc1.42E01E"'
      : (MediaRecorder.isTypeSupported('video/webm; codecs=vp9') ? 'video/webm; codecs=vp9' : 'video/webm');

    const recorder = new MediaRecorder(combinedStream, { mimeType, videoBitsPerSecond: 40000000 });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      document.body.classList.remove('clean-capture');
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(chunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `KinetRig-Opener_${targetFps}fps.${ext}`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      if (stream && stream.getTracks) stream.getTracks().forEach(t => t.stop());
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false;
      setExportUiState(false);
      tl.play(0);
    };

    tl.pause(0); recorder.start(); tl.play();
    const check = setInterval(() => {
      const cur = tl.time();
      if (cur >= DURATION - 0.05 || tl.progress() >= 0.999) {
        clearInterval(check); tl.pause();
        if (recorder.state === 'recording') recorder.stop();
      }
    }, 100);
  } catch (err) {
    document.body.classList.remove('clean-capture');
    btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
    isRecording = false;
    setExportUiState(false);
  }
}
</script>
