<!doctype html>
<html lang="en">
<!-- KinetRig v1.0.0 by Reff33 - Metric Pulse & Charts (MIT) -->
<head>
<meta charset="utf-8">
<title>KinetRig — Metric Pulse & Charts (144 FPS)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
:root {
  --primary: #10B981;
  --primary-glow: rgba(16, 185, 129, 0.4);
  --accent: #00F5FF;
  --bg: #070B14;
  --card-bg: rgba(15, 23, 42, 0.85);
  --font-main: "Plus Jakarta Sans", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family:var(--font-main); color:#FFF; }

#stage {
  position: fixed; left:50%; top:50%; width:1920px; height:1080px;
  transform: translate(-50%, -50%) scale(1);
  background: radial-gradient(circle at 50% 20%, #0F172A, var(--bg) 80%);
  overflow: hidden;
}
.hud-title {
  text-align: center; margin-top: 100px; font-size: 64px; font-weight: 800;
  letter-spacing: -0.02em;
}
.hud-title span { color: var(--primary); text-shadow: 0 0 25px var(--primary-glow); }

.grid {
  display: flex; gap: 36px; justify-content: center; align-items: center;
  margin-top: 60px; padding: 0 100px;
}
.metric-card {
  background: var(--card-bg); border: 1px solid rgba(16, 185, 129, 0.25);
  border-radius: 20px; padding: 36px 40px; min-width: 380px; text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6); backdrop-filter: blur(20px);
  opacity: 0; transform: translateY(40px);
}
.metric-val {
  font-family: var(--font-mono); font-size: 80px; font-weight: 700;
  color: var(--primary); text-shadow: 0 0 30px var(--primary-glow);
  line-height: 1; margin: 16px 0;
}
.metric-lbl { font-size: 18px; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.08em; }

/* Dynamic SVG Chart */
.chart-container {
  max-width: 1200px; margin: 50px auto 0; background: var(--card-bg);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 30px 40px;
  backdrop-filter: blur(16px); opacity: 0; transform: scale(0.95);
}
svg.bar-chart { width: 100%; height: 260px; overflow: visible; }
rect.bar { fill: var(--primary); rx: 8; transform-origin: bottom; }
line.grid-line { stroke: rgba(255,255,255,0.08); stroke-width: 1; }

.top-bar { position: fixed; top: 20px; right: 24px; display: flex; align-items: center; gap: 10px; z-index: 100; }
.btn-action {
  background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(16, 185, 129, 0.35); color: #FFF;
  font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  padding: 8px 16px; border-radius: 9999px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}
.btn-action:hover {
  border-color: var(--primary); transform: translateY(-1px);
}
.btn-action.active {
  background: rgba(16, 185, 129, 0.22); border-color: var(--primary);
  box-shadow: 0 0 14px rgba(16, 185, 129, 0.4);
}
.btn-action svg {
  width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none;
}

#ui {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; padding: 8px 18px;
  border-radius: 9999px; background: rgba(9, 14, 26, 0.92);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(16, 185, 129, 0.35);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(16, 185, 129, 0.15);
  font-family: var(--font-mono); font-size: 13px; color: #94A3B8; z-index: 90;
  transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
}
#ui.hidden {
  opacity: 0; pointer-events: none; transform: translate(-50%, 14px);
}
#ui button {
  background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14);
  color: #F8FAFC; font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 6px 14px; border-radius: 9999px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; outline: none;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1); letter-spacing: 0.02em;
}
#ui button:hover {
  background: rgba(16, 185, 129, 0.22); border-color: var(--primary); color: #FFF;
  box-shadow: 0 0 14px rgba(16, 185, 129, 0.4); transform: translateY(-1px);
}
#ui button:active { transform: translateY(0) scale(0.96); background: rgba(16, 185, 129, 0.35); }
#ui button#btn-audio {
  padding: 6px 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
#ui button#btn-audio.muted {
  color: #94a3b8;
  border-color: rgba(239, 68, 68, 0.4);
}
#scrub { width: 340px; height: 6px; accent-color: var(--primary); border-radius: 3px; cursor: pointer; background: rgba(255, 255, 255, 0.18); outline: none; }
#clock { font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; color: #E2E8F0; font-weight: 600; }

body.clean-capture .top-bar, body.clean-capture #ui,
body.clean-mode .top-bar, body.clean-mode #ui { display: none !important; opacity: 0 !important; visibility: hidden !important; }
body.clean-capture, body.clean-mode { cursor: none !important; }
</style>
</head>
<body>

<div id="stage">
  <h1 class="hud-title">REAL-TIME <span>METRICS ENGINE</span></h1>

  <div class="grid">
    <div class="metric-card" id="m1">
      <div class="metric-lbl">Total Processing Speed</div>
      <div class="metric-val" id="num1">0</div>
      <div class="metric-lbl">Requests / Second</div>
    </div>
    <div class="metric-card" id="m2">
      <div class="metric-lbl">Latency Reduction</div>
      <div class="metric-val" id="num2">0%</div>
      <div class="metric-lbl">Compared to Legacy</div>
    </div>
    <div class="metric-card" id="m3">
      <div class="metric-lbl">Throughput Yield</div>
      <div class="metric-val" id="num3">0M</div>
      <div class="metric-lbl">Verified Tokens</div>
    </div>
  </div>

  <div class="chart-container" id="chart-box">
    <svg class="bar-chart" viewBox="0 0 1100 240">
      <line class="grid-line" x1="0" y1="60" x2="1100" y2="60"/>
      <line class="grid-line" x1="0" y1="120" x2="1100" y2="120"/>
      <line class="grid-line" x1="0" y1="180" x2="1100" y2="180"/>
      <rect class="bar" x="60" y="240" width="80" height="0" data-h="160"/>
      <rect class="bar" x="220" y="240" width="80" height="0" data-h="200"/>
      <rect class="bar" x="380" y="240" width="80" height="0" data-h="140"/>
      <rect class="bar" x="540" y="240" width="80" height="0" data-h="220"/>
      <rect class="bar" x="700" y="240" width="80" height="0" data-h="190"/>
      <rect class="bar" x="860" y="240" width="80" height="0" data-h="235"/>
    </svg>
  </div>
</div>

<div class="top-bar">
  <button class="btn-action active" id="btn-hud" title="Toggle HUD (H)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0 1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>HUD (H)</span>
  </button>
  <button class="btn-action" id="btn-export">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <span id="btn-export-text" style="display:inline-flex;align-items:center;gap:4px;">Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240</span>
  </button>
</div>

<div id="ui">
  <button id="btn-play">Pause</button>
  <button id="btn-audio" title="Mute/Unmute Audio (M)">
    <svg id="icon-audio-on" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    <svg id="icon-audio-off" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  </button>
  <input type="range" id="scrub" min="0" max="1000" value="0">
  <span id="clock">0.00s</span>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let isRecording = false;

const DURATION = 8.0;
const tl = gsap.timeline({ paused: true });

/* ============ AUDIO SYNTHESIS & MOTIVATED METRIC SFX ============ */
let audioCtx = null, audioDest = null;
let isAudioMuted = false;
let mainMasterGain = null;

const btnAudio = $('#btn-audio'), iconAudioOn = $('#icon-audio-on'), iconAudioOff = $('#icon-audio-off');
function toggleAudio() {
  isAudioMuted = !isAudioMuted;
  if (iconAudioOn) iconAudioOn.style.display = isAudioMuted ? 'none' : 'block';
  if (iconAudioOff) iconAudioOff.style.display = isAudioMuted ? 'block' : 'none';
  if (btnAudio) {
    btnAudio.classList.toggle('muted', isAudioMuted);
    btnAudio.title = isAudioMuted ? 'Unmute Audio (M)' : 'Mute Audio (M)';
  }
  if (mainMasterGain && audioCtx) {
    mainMasterGain.gain.setValueAtTime(isAudioMuted ? 0 : 1, audioCtx.currentTime);
  }
}
if (btnAudio) btnAudio.onclick = toggleAudio;

const initAudio = () => {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
      mainMasterGain = audioCtx.createGain();
      mainMasterGain.gain.value = isAudioMuted ? 0 : 1;
      mainMasterGain.connect(audioCtx.destination);
      try {
        audioDest = audioCtx.createMediaStreamDestination();
        mainMasterGain.connect(audioDest);
      } catch (e) {}
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
};
window.addEventListener('click', initAudio);
window.addEventListener('keydown', initAudio);

function playCardPop(i = 0) {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running') return;
  const now = ctx.currentTime;
  try {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    const f = 340 + (i * 90);
    osc.frequency.setValueAtTime(f, now);
    osc.frequency.exponentialRampToValueAtTime(f * 0.7, now + 0.12);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.18, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
    osc.connect(g);
    g.connect(mainMasterGain || ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  } catch (e) {}
}

function playChartWhoosh() {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running') return;
  const now = ctx.currentTime;
  try {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(420, now + 0.20);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.14, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
    osc.connect(g);
    g.connect(mainMasterGain || ctx.destination);
    osc.start(now);
    osc.stop(now + 0.24);
  } catch (e) {}
}

const BAR_FREQS = [440, 494, 554, 659, 740, 880];
function playBarChime(i = 0) {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running') return;
  const now = ctx.currentTime;
  try {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    const f = BAR_FREQS[i % BAR_FREQS.length];
    osc.frequency.setValueAtTime(f, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.15, now + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
    osc.connect(g);
    g.connect(mainMasterGain || ctx.destination);
    osc.start(now);
    osc.stop(now + 0.25);
  } catch (e) {}
}

// Stage fit
const fit = () => {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('#stage').style.transform = `translate(-50%, -50%) scale(${s})`;
};
addEventListener('resize', fit); fit();

// Numbers animation object
const stats = { n1: 0, n2: 0, n3: 0 };
tl.fromTo('.hud-title', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 0.2);
tl.fromTo(['#m1', '#m2', '#m3'],
  { opacity: 0, y: 40, scale: 0.9 },
  { opacity: 1, y: 0, scale: 1, duration: 0.7, stagger: 0.15, ease: 'back.out(1.5)' },
  0.6
);
tl.call(() => playCardPop(0), null, 0.60);
tl.call(() => playCardPop(1), null, 0.75);
tl.call(() => playCardPop(2), null, 0.90);

tl.to(stats, {
  n1: 14400, n2: 84, n3: 256, duration: 2.2, ease: 'power2.out',
  onUpdate: () => {
    $('#num1').textContent = Math.round(stats.n1).toLocaleString();
    $('#num2').textContent = Math.round(stats.n2) + '%';
    $('#num3').textContent = Math.round(stats.n3) + 'M';
  }
}, 0.8);

tl.fromTo('#chart-box', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.8, ease: 'power3.out' }, 1.2);
tl.call(playChartWhoosh, null, 1.20);

$$('rect.bar').forEach((bar, i) => {
  const h = Number(bar.dataset.h);
  const at = 1.4 + (i * 0.1);
  tl.fromTo(bar, { y: 0, height: 0 }, { y: -h, height: h, duration: 1.0, ease: 'elastic.out(1, 0.75)' }, at);
  tl.call(() => playBarChime(i), null, at);
});

tl.to({}, { duration: 0.01 }, DURATION);

const clock = $('#clock'), scrub = $('#scrub'), btnPlay = $('#btn-play');
let scrubbing = false;
(function frame() {
  const t = tl.time();
  clock.textContent = t.toFixed(2) + 's';
  if (!scrubbing) scrub.value = String((t / DURATION) * 1000);
  if (!isRecording && !location.search.includes('clean') && t >= DURATION) {
    tl.play(0);
    return;
  }
  requestAnimationFrame(frame);
})();

const toggle = () => {
  if (tl.paused() || tl.progress() >= 1) {
    if (tl.progress() >= 1) tl.progress(0);
    initAudio();
    tl.play(); btnPlay.textContent = 'Pause';
  } else {
    tl.pause(); btnPlay.textContent = 'Play';
  }
};
btnPlay.onclick = toggle;

scrub.addEventListener('pointerdown', () => { scrubbing = true; tl.pause(); btnPlay.textContent = 'Play'; });
addEventListener('pointerup', () => scrubbing = false);
scrub.addEventListener('input', () => { tl.pause(); tl.time((scrub.value / 1000) * DURATION); });

const btnHud = $('#btn-hud');
const ui = $('#ui');
function toggleHud() {
  const isHidden = ui.classList.toggle('hidden');
  if (btnHud) btnHud.classList.toggle('active', !isHidden);
}
if (btnHud) btnHud.onclick = toggleHud;

addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    toggle();
  } else if (e.key === 'h' || e.key === 'H') {
    toggleHud();
  } else if (e.key === 'm' || e.key === 'M') {
    toggleAudio();
  } else if (e.key === 'r' || e.key === 'R') {
    tl.pause(0);
    initAudio();
    tl.play();
    btnPlay.textContent = 'Pause';
  }
});

// Seek for offline 144fps renderer
const seek = t => { tl.pause(); tl.time(t, false); };
window.OPENER = { tl, DURATION, seek, ready: true };

if (!location.search.includes('clean')) {
  tl.play(0);
  tl.eventCallback('onComplete', () => { if (!isRecording) tl.play(0); });
}

/* Ultra-HFR Clean Video Exporter (Up to 240 FPS) */
const EXPORT_DEFAULT_HTML = 'Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240';
const btnExport = $('#btn-export');
const btnExportLabel = $('#btn-export-text');

if (btnExport) {
  btnExport.onclick = async () => {
    if (isRecording) return;
    try {
      isRecording = true;
      btnExportLabel.textContent = 'Preparing Capture...';
      document.body.classList.add('clean-capture');
      initAudio();

      let stream;
      if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: 240, min: 60 } },
            audio: !isAudioMuted, preferCurrentTab: true
          });
        } catch {
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: 240, min: 60 } },
              preferCurrentTab: true
            });
          } catch (e) {
            document.body.classList.remove('clean-capture');
            btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
            isRecording = false; return;
          }
        }
      }

      if (!stream) {
        document.body.classList.remove('clean-capture');
        btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
        isRecording = false; return;
      }

      const tracks = [...stream.getVideoTracks()];
      if (!isAudioMuted) {
        if (audioDest && audioDest.stream && audioDest.stream.getAudioTracks().length > 0) {
          tracks.push(audioDest.stream.getAudioTracks()[0]);
        } else if (stream.getAudioTracks().length > 0) {
          tracks.push(stream.getAudioTracks()[0]);
        }
      } else {
        if (stream && stream.getAudioTracks) {
          stream.getAudioTracks().forEach(t => { try { t.stop(); stream.removeTrack(t); } catch(e){} });
        }
      }
      const combinedStream = new MediaStream(tracks);

      const mimeType = MediaRecorder.isTypeSupported('video/mp4; codecs="avc1.42E01E"')
        ? 'video/mp4; codecs="avc1.42E01E"'
        : (MediaRecorder.isTypeSupported('video/webm; codecs=vp9') ? 'video/webm; codecs=vp9' : 'video/webm');

      const recorder = new MediaRecorder(combinedStream, { mimeType, videoBitsPerSecond: 40000000 });
      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        document.body.classList.remove('clean-capture');
        btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
        isRecording = false;
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(chunks, { type: mimeType });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `KinetRig-Metrics.${ext}`; a.click();
        stream.getTracks().forEach(t => t.stop());
        tl.play();
      };
      tl.pause(0); recorder.start(); tl.play();
      const check = setInterval(() => {
        const cur = tl.time();
        if (cur >= DURATION - 0.05 || tl.progress() >= 0.999) {
          clearInterval(check);
          tl.pause();
          if (recorder.state === 'recording') recorder.stop();
        }
      }, 100);
    } catch {
      document.body.classList.remove('clean-capture');
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false;
    }
  };
}
</script>
</body>
</html>
