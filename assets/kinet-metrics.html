<!doctype html>
<html lang="en">
<!-- KinetRig v1.0.0 by Reff33 - Metric Pulse & Charts (MIT) -->
<head>
<meta charset="utf-8">
<title>KinetRig — Metric Pulse & Charts (144 FPS)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
:root {
  --primary: #10B981;
  --primary-glow: rgba(16, 185, 129, 0.4);
  --accent: #00F5FF;
  --bg: #070B14;
  --card-bg: rgba(15, 23, 42, 0.85);
  --font-main: "Plus Jakarta Sans", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family:var(--font-main); color:#FFF; }

#stage {
  position: fixed; left:50%; top:50%; width:1920px; height:1080px;
  transform: translate(-50%, -50%) scale(1);
  background: radial-gradient(circle at 50% 20%, #0F172A, var(--bg) 80%);
  overflow: hidden;
}
.hud-title {
  text-align: center; margin-top: 100px; font-size: 64px; font-weight: 800;
  letter-spacing: -0.02em;
}
.hud-title span { color: var(--primary); text-shadow: 0 0 25px var(--primary-glow); }

.grid {
  display: flex; gap: 36px; justify-content: center; align-items: center;
  margin-top: 60px; padding: 0 100px;
}
.metric-card {
  background: var(--card-bg); border: 1px solid rgba(16, 185, 129, 0.25);
  border-radius: 20px; padding: 36px 40px; min-width: 380px; text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6); backdrop-filter: blur(20px);
  opacity: 0; transform: translateY(40px);
}
.metric-val {
  font-family: var(--font-mono); font-size: 80px; font-weight: 700;
  color: var(--primary); text-shadow: 0 0 30px var(--primary-glow);
  line-height: 1; margin: 16px 0;
}
.metric-lbl { font-size: 18px; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.08em; }

/* Dynamic SVG Chart */
.chart-container {
  max-width: 1200px; margin: 50px auto 0; background: var(--card-bg);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 30px 40px;
  backdrop-filter: blur(16px); opacity: 0; transform: scale(0.95);
}
svg.bar-chart { width: 100%; height: 260px; overflow: visible; }
rect.bar { fill: var(--primary); rx: 8; transform-origin: bottom; }
line.grid-line { stroke: rgba(255,255,255,0.08); stroke-width: 1; }

.top-bar { position: fixed; top: 20px; right: 24px; display: flex; align-items: center; gap: 10px; z-index: 100; }
.btn-action {
  background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(16, 185, 129, 0.35); color: #FFF;
  font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  padding: 8px 16px; border-radius: 9999px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}
.btn-action:hover {
  border-color: var(--primary); transform: translateY(-1px);
}
.btn-action.active {
  background: rgba(16, 185, 129, 0.22); border-color: var(--primary);
  box-shadow: 0 0 14px rgba(16, 185, 129, 0.4);
}
.btn-action svg {
  width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none;
}

#ui {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; padding: 8px 18px;
  border-radius: 9999px; background: rgba(9, 14, 26, 0.92);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(16, 185, 129, 0.35);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(16, 185, 129, 0.15);
  font-family: var(--font-mono); font-size: 13px; color: #94A3B8; z-index: 90;
  transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
}
#ui.hidden {
  opacity: 0; pointer-events: none; transform: translate(-50%, 14px);
}
#ui button {
  background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14);
  color: #F8FAFC; font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 6px 14px; border-radius: 9999px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; outline: none;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1); letter-spacing: 0.02em;
}
#ui button:hover {
  background: rgba(16, 185, 129, 0.22); border-color: var(--primary); color: #FFF;
  box-shadow: 0 0 14px rgba(16, 185, 129, 0.4); transform: translateY(-1px);
}
#ui button:active { transform: translateY(0) scale(0.96); background: rgba(16, 185, 129, 0.35); }
#ui button#btn-audio {
  padding: 6px 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
#ui button#btn-audio.muted {
  color: #94a3b8;
  border-color: rgba(239, 68, 68, 0.4);
}
#scrub { width: 340px; height: 6px; accent-color: var(--primary); border-radius: 3px; cursor: pointer; background: rgba(255, 255, 255, 0.18); outline: none; }
#clock { font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; color: #E2E8F0; font-weight: 600; }

body.clean-capture .top-bar, body.clean-capture #ui,
body.clean-mode .top-bar, body.clean-mode #ui { display: none !important; opacity: 0 !important; visibility: hidden !important; }
body.clean-capture, body.clean-mode { cursor: none !important; }

/* Export Dropdown & FPS Menu */
.export-dropdown { position: relative; }
.fps-menu {
  display: none; position: absolute; top: calc(100% + 8px); right: 0;
  background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(0, 245, 255, 0.35);
  border-radius: 12px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 20px rgba(0,245,255,0.15);
  padding: 6px; min-width: 175px; z-index: 120; flex-direction: column; gap: 3px;
}
.fps-menu.open { display: flex; }
.fps-item {
  background: transparent; border: none; color: #E2E8F0;
  font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 8px 10px; border-radius: 8px; text-align: left; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  transition: all 0.15s ease; width: 100%; box-sizing: border-box;
}
.fps-item:hover {
  background: rgba(0, 245, 255, 0.2); color: #00F5FF; transform: translateX(2px);
}
.fps-item.danger:hover {
  background: rgba(239, 68, 68, 0.2); color: #F87171;
}

</style>
</head>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const Q = new URLSearchParams(location.search);
let isRecording = false, isExporting = false;
if (location.search.includes('clean') || Q.has('clean')) { document.body.classList.add('clean-capture', 'clean-mode'); }

const DURATION = 8.0;
const tl = gsap.timeline({ paused: true });

/* ============ AUDIO SYNTHESIS & MOTIVATED METRIC SFX ============ */
let audioCtx = null, audioDest = null;
let isAudioMuted = false;
let mainMasterGain = null;

const btnAudio = $('#btn-audio'), iconAudioOn = $('#icon-audio-on'), iconAudioOff = $('#icon-audio-off');
function toggleAudio() {
  isAudioMuted = !isAudioMuted;
  if (iconAudioOn) iconAudioOn.style.display = isAudioMuted ? 'none' : 'block';
  if (iconAudioOff) iconAudioOff.style.display = isAudioMuted ? 'block' : 'none';
  if (btnAudio) {
    btnAudio.classList.toggle('muted', isAudioMuted);
    btnAudio.title = isAudioMuted ? 'Unmute Audio (M)' : 'Mute Audio (M)';
  }
  if (mainMasterGain && audioCtx) {
    mainMasterGain.gain.setValueAtTime(isAudioMuted ? 0 : 1, audioCtx.currentTime);
  }
}
if (btnAudio) btnAudio.onclick = toggleAudio;

/* ============ ENTERPRISE HYBRID AI AUDIO INTELLIGENCE ARCHITECTURE ============ */
const SFX_CDN_BASE = 'https://raw.githubusercontent.com/wyzowl/sfx-kit/main';
const STUDIO_SFX = {
  card_pop: 'sounds/foley/foley-card-touch.wav',
  whoosh: 'sounds/whooshes/whoosh-medium-soft.wav',
  bar_chime: 'sounds/tones/tone-step-2.wav',
  impact: 'sounds/impacts/impact-deep-soft.wav'
};

const sfxAudioBuffers = {};
const sfxRawBuffers = {};
let ambientStarted = false;
let ambientMaster = null;

async function fetchSfxArrayBuffer(rel) {
  const isHttp = typeof location !== 'undefined' && location.protocol ? location.protocol.startsWith('http') : false;
  if (!isHttp && typeof navigator !== 'undefined' && navigator.onLine === false) return null;
  const tryUrls = isHttp
    ? [`../sfx/${rel}`, `sfx/${rel}`, `${SFX_CDN_BASE}/${rel}`]
    : [`${SFX_CDN_BASE}/${rel}`];
  for (const u of tryUrls) {
    try {
      const res = await fetch(u);
      if (res.ok) return await res.arrayBuffer();
    } catch (e) {}
  }
  return null;
}

for (const [id, rel] of Object.entries(STUDIO_SFX)) {
  fetchSfxArrayBuffer(rel).then(ab => {
    if (ab) {
      sfxRawBuffers[id] = ab;
      if (audioCtx) {
        audioCtx.decodeAudioData(ab.slice(0)).then(decoded => {
          sfxAudioBuffers[id] = decoded;
        }).catch(() => {});
      }
    }
  });
}

function startAmbientBed() {
  if (ambientStarted || !audioCtx || audioCtx.state !== 'running') return;
  ambientStarted = true;
  try {
    ambientMaster = audioCtx.createGain();
    ambientMaster.gain.setValueAtTime(0.045, audioCtx.currentTime);

    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(58, audioCtx.currentTime);

    const bufLen = Math.floor(audioCtx.sampleRate * 2);
    const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    let b0 = 0, b1 = 0;
    for (let i = 0; i < bufLen; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.985 * b0 + white * 0.015;
      b1 = 0.95 * b1 + white * 0.05;
      data[i] = (b0 + b1) * 0.25;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(280, audioCtx.currentTime);

    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(0.28, audioCtx.currentTime);
    osc.connect(oscGain);
    oscGain.connect(ambientMaster);

    noise.connect(filter);
    filter.connect(ambientMaster);

    ambientMaster.connect(mainMasterGain || audioCtx.destination);
    if (audioDest && !mainMasterGain) ambientMaster.connect(audioDest);

    osc.start();
    noise.start();
  } catch (e) {}
}

let hasUserInteracted = false;
const hasBrowserGesture = () => (typeof navigator === 'undefined' || !navigator.userActivation || navigator.userActivation.hasBeenActive);
function markUserInteracted() {
  if (!hasBrowserGesture()) return;
  hasUserInteracted = true;
  initAudio();
}
const initAudio = () => {
  if (!hasUserInteracted || !hasBrowserGesture()) return null;
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
      mainMasterGain = audioCtx.createGain();
      mainMasterGain.gain.value = isAudioMuted ? 0 : 1;
      mainMasterGain.connect(audioCtx.destination);
      try {
        audioDest = audioCtx.createMediaStreamDestination();
        mainMasterGain.connect(audioDest);
      } catch (e) {}
    }
  }
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    for (const [id, ab] of Object.entries(sfxRawBuffers)) {
      if (!sfxAudioBuffers[id]) {
        audioCtx.decodeAudioData(ab.slice(0)).then(decoded => {
          sfxAudioBuffers[id] = decoded;
        }).catch(() => {});
      }
    }
    startAmbientBed();
  }
  return audioCtx;
};
window.addEventListener('pointerdown', markUserInteracted, { capture: true });
window.addEventListener('click', markUserInteracted, { capture: true });
window.addEventListener('keydown', markUserInteracted, { capture: true });
window.addEventListener('message', e => {
  if (e.data === 'UNLOCK_AUDIO' || (e.data && e.data.type === 'UNLOCK_AUDIO')) {
    markUserInteracted();
  }
});

function triggerSfx(sfxId, fallbackFn, gain = 0.5, pitchRate = 1.0) {
  const ctx = initAudio();
  if (!ctx || ctx.state !== 'running' || (typeof isAudioMuted !== 'undefined' && isAudioMuted)) return;
  if (ctx && sfxAudioBuffers[sfxId]) {
    try {
      const src = ctx.createBufferSource();
      src.buffer = sfxAudioBuffers[sfxId];
      src.playbackRate.value = pitchRate;
      const g = ctx.createGain();
      g.gain.setValueAtTime(gain, ctx.currentTime);
      src.connect(g);
      g.connect(mainMasterGain || ctx.destination);
      if (audioDest && !mainMasterGain) g.connect(audioDest);
      src.start();
      return;
    } catch (e) {}
  }
  if (typeof fallbackFn === 'function') fallbackFn();
}

function playCardPop(i = 0) {
  triggerSfx('card_pop', () => {
    const ctx = initAudio();
    if (!ctx || ctx.state !== 'running') return;
    const now = ctx.currentTime;
    try {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      const f = 340 + (i * 90);
      osc.frequency.setValueAtTime(f, now);
      osc.frequency.exponentialRampToValueAtTime(f * 0.7, now + 0.12);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(0.18, now + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
      osc.connect(g);
      g.connect(mainMasterGain || ctx.destination);
      if (audioDest && !mainMasterGain) g.connect(audioDest);
      osc.start(now);
      osc.stop(now + 0.16);
    } catch (e) {}

/* ============ 240 FPS STUDIO BRIDGE & CLEAN VIDEO EXPORTER ============ */
const TARGET_BRIDGE_VERSION = '1.1.4';
function compareBridgeVersion(a, b) {
  const pa = String(a || '0.0.0').split('.').map(n => parseInt(n, 10) || 0);
  const pb = String(b || '0.0.0').split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pa[i] || 0) - (pb[i] || 0);
    if (d !== 0) return d;
  }
  return 0;
}
let activeEncoder = 'auto';
let activeDefaultFps = 240;
const buildExportDefaultHtml = fps => `Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> ${Number(fps) || 240}`;

/* ---- Studio Bridge discovery: live settings -> same origin -> same host -> loopback ---- */
const BRIDGE_CANDIDATES = (() => {
  const out = [];
  try {
    const customUrl = localStorage.getItem('kinet_bridge_url');
    if (customUrl) out.push(customUrl.replace(/\/+$/, ''));
  } catch {}
  try {
    const q = new URLSearchParams(location.search).get('bridge');
    if (q) out.push(q.replace(/\/+$/, ''));
  } catch {}
  const p = location.protocol, host = location.hostname, org = location.origin;
  if (p === 'http:' || p === 'https:') {
    if (org && org !== 'null') out.push(org);
    if (host) out.push('http://' + host + ':4004');
  }
  out.push('http://127.0.0.1:4004', 'http://localhost:4004');
  return out.filter((v, i) => out.indexOf(v) === i);
})();
let BRIDGE = 'http://127.0.0.1:4004';
(() => {
  const _s = readSavedSettings();
  if (_s.host && _s.port) BRIDGE = 'http://' + (_s.host === '0.0.0.0' ? '127.0.0.1' : _s.host) + ':' + _s.port;
  if (_s.encoder) activeEncoder = _s.encoder;
  if (_s.defaultFps) syncDefaultFpsUi(_s.defaultFps);
})();
window.addEventListener('message', e => {
  if (e.data?.type === 'UPDATE_SETTINGS') {
    if (e.data.bridgeUrl) BRIDGE = e.data.bridgeUrl.replace(/\/+$/, '');
    if (e.data.settings?.encoder) activeEncoder = e.data.settings.encoder;
    if (e.data.settings?.defaultFps) syncDefaultFpsUi(e.data.settings.defaultFps);
  }
});
async function resolveBridge() {
  const s = readSavedSettings();
  const liveCandidates = [];
  if (BRIDGE) liveCandidates.push(BRIDGE.replace(/\/+$/, ''));
  try {
    const u = localStorage.getItem('kinet_bridge_url');
    if (u) liveCandidates.push(u.replace(/\/+$/, ''));
  } catch {}
  if (s.host && s.port) {
    liveCandidates.push(`http://${s.host === '0.0.0.0' ? '127.0.0.1' : s.host}:${s.port}`);
  }
  for (const c of BRIDGE_CANDIDATES) liveCandidates.push(c);
  const ordered = liveCandidates.filter((v, i) => v && liveCandidates.indexOf(v) === i);

  let outdatedBase = null;
  for (const base of ordered) {
    try {
      const r = await fetch(base + '/api/health', { signal: AbortSignal.timeout(1000) });
      if (r.ok) {
        const info = await r.json().catch(() => ({}));
        if (info && info.version && compareBridgeVersion(info.version, TARGET_BRIDGE_VERSION) >= 0) {
          BRIDGE = base;
          return true;
        }
        if (!outdatedBase) outdatedBase = base;
      }
    } catch {}
  }

  if (outdatedBase) {
    try {
      await fetch(`${outdatedBase}/api/restart`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host: s.host || '127.0.0.1', port: Number(s.port) || 4004 }),
        signal: AbortSignal.timeout(2000)
      });
      await new Promise(res => setTimeout(res, 700));
      const targetCheck = (s.host && s.port)
        ? `http://${s.host === '0.0.0.0' ? '127.0.0.1' : s.host}:${s.port}`
        : outdatedBase;
      for (let i = 0; i < 6; i++) {
        try {
          const r = await fetch(targetCheck + '/api/health', { signal: AbortSignal.timeout(900) });
          if (r.ok) { BRIDGE = targetCheck; return true; }
        } catch {}
        await new Promise(res => setTimeout(res, 300));
      }
    } catch {}
  }

  try {
    const qs = `?restart=1&host=${encodeURIComponent(s.host || '127.0.0.1')}&port=${Number(s.port) || 4004}`;
    const endpoints = [
      `http://127.0.0.1/KinetRig/api/bridge.php${qs}`,
      `http://localhost/KinetRig/api/bridge.php${qs}`,
      ...(location.protocol.startsWith('http') && location.origin && location.origin !== 'null' && location.port !== '4004'
        ? [`${location.origin}/api/bridge.php${qs}`, `${location.origin}/KinetRig/api/bridge.php${qs}`]
        : [])
    ];
    for (const ep of endpoints) {
      try {
        const h = await fetch(ep, { signal: AbortSignal.timeout(4500) });
        if (h.ok) {
          const res = await h.json();
          if (res.ok) {
            BRIDGE = res.bridge || BRIDGE;
            return true;
          }
        }
      } catch {}
    }
  } catch {}

  if (outdatedBase) {
    BRIDGE = outdatedBase;
    return true;
  }
  return false;
}

async function startExport(targetFps = activeDefaultFps) {
  if (isExporting || isRecording) return;
  if (typeof markUserInteracted === 'function') markUserInteracted();

  // 1. Studio Local Bridge Attempt (Deterministic 60–240 FPS Headless Render)
  if (await resolveBridge()) {
    try {
      setExportUiState(true);
      currentAbortController = new AbortController();
      btnExportLabel.textContent = `Connecting Studio...`;

      try {
        currentEvtSource = new EventSource(`${BRIDGE}/api/progress`);
        currentEvtSource.onmessage = e => {
          try {
            const data = JSON.parse(e.data);
            if (data.status === 'rendering' && !isRenderPaused) {
              btnExportLabel.textContent = `Rendering ${data.percent || 0}% (${targetFps} FPS)`;
            } else if (data.status === 'paused') {
              btnExportLabel.textContent = `Paused ${data.percent || 0}% (${targetFps} FPS)`;
            }
          } catch {}
        };
      } catch {}

      const isBridgeAsset = typeof BRIDGE === 'string' && BRIDGE && location.origin === BRIDGE && location.pathname.includes('assets/');
      const templatePath = isBridgeAsset
        ? location.pathname.substring(location.pathname.indexOf('assets/'))
        : location.href.split('#')[0].split('?')[0];

      const reqEncoder = activeEncoder || readSavedSettings().encoder || 'auto';
      const renderRes = await fetch(`${BRIDGE}/api/render?template=${encodeURIComponent(templatePath)}&fps=${targetFps}&encoder=${encodeURIComponent(reqEncoder)}&muted=${typeof isAudioMuted!=='undefined'&&isAudioMuted?1:0}`, {
        signal: currentAbortController.signal
      });
      if (currentEvtSource) { currentEvtSource.close(); currentEvtSource = null; }

      if (!renderRes.ok) { const errTxt = await renderRes.text(); let errMsg = errTxt; try { errMsg = JSON.parse(errTxt).error || errTxt; } catch {} throw new Error(errMsg || `HTTP ${renderRes.status}`); }

      btnExportLabel.textContent = 'Saving MP4...';
      const blob = await renderRes.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      const pathSegs = decodeURIComponent(location.pathname || '').replace(/\/+$/, '').split('/').filter(Boolean);
      const rawLast = (pathSegs[pathSegs.length - 1] || '').replace(/\.html?$/i, '');
      const parentSeg = pathSegs.length > 1 ? pathSegs[pathSegs.length - 2] : '';
      const baseName = ((!rawLast || rawLast.toLowerCase() === 'index')
        ? ((parentSeg && !/^[a-zA-Z]:$/.test(parentSeg) ? parentSeg : '') || location.hostname || 'kinet-render')
        : rawLast).replace(/[^a-zA-Z0-9._-]+/g, '_').replace(/^_+|_+$/g, '') || 'kinet-render';
      a.download = `${baseName}_${targetFps}fps.mp4`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);

      const fbReason = renderRes.headers?.get?.('X-KinetRig-Fallback-Reason');
      if (fbReason) console.warn('[Studio Bridge Encoder Fallback]', fbReason);
      btnExportLabel.textContent = fbReason ? 'Downloaded (CPU)' : 'Downloaded!';
      setTimeout(() => {
        btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
        setExportUiState(false);
      }, 2000);
      return;
    } catch (bridgeErr) {
      if (bridgeErr.name === 'AbortError') return;
      console.error('[Studio Bridge Render Error]', bridgeErr);
      if (currentEvtSource) { currentEvtSource.close(); currentEvtSource = null; }
      setExportUiState(false);
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      alert(`[Ralat Render Studio Bridge]\n\n${bridgeErr.message || 'Render terhenti.'}`);
      return;
    }
  }

  // Studio bridge offline: maklumkan pengguna untuk hidupkan bridge (tanpa screen-share)
  if (!window.__bridgeRetried && confirm(`[KinetRig Studio Bridge Diperlukan]\n\nEksport visual ${targetFps} FPS memerlukan Studio Bridge tempatan.\n\nLangkah mudah:\n1. Klik dua kali "start-studio.bat" dalam folder projek, ATAU\n2. Jalankan arahan di terminal: node scripts/server.mjs\n\nKlik OK untuk sambung semula selepas bridge dihidupkan.`)) {

          try {
            stream = await navigator.mediaDevices.getDisplayMedia({

              preferCurrentTab: true
            });
          } catch (e) {
            document.body.classList.remove('clean-capture');
            btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
            isRecording = false; setExportUiState(false); return;
          }
        }
      } else {
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
            audio: false, preferCurrentTab: true
          });
        } catch {
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { displaySurface: 'browser', cursor: 'never', frameRate: { ideal: targetFps, min: 60 } },
              preferCurrentTab: true
            });
          } catch (e) {
            document.body.classList.remove('clean-capture');
            btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
            isRecording = false; setExportUiState(false); return;
          }
        }
      }
    } else {
      document.body.classList.remove('clean-capture');
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false; setExportUiState(false); return;
    }

    if (!stream) {
      document.body.classList.remove('clean-capture');
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false; setExportUiState(false); return;
    }

    const tracks = [...stream.getVideoTracks()];
    if (captureAudio) {
      if (typeof audioDest !== 'undefined' && audioDest && audioDest.stream && audioDest.stream.getAudioTracks().length > 0) {
        tracks.push(audioDest.stream.getAudioTracks()[0]);
      } else if (stream.getAudioTracks().length > 0) {
        tracks.push(stream.getAudioTracks()[0]);
      }
    } else {
      if (stream && stream.getAudioTracks) {
        stream.getAudioTracks().forEach(t => { try { t.stop(); stream.removeTrack(t); } catch(e){} });
      }
    }
    const combinedStream = new MediaStream(tracks);

    const mimeType = MediaRecorder.isTypeSupported('video/mp4; codecs="avc1.42E01E"')
      ? 'video/mp4; codecs="avc1.42E01E"'
      : (MediaRecorder.isTypeSupported('video/webm; codecs=vp9') ? 'video/webm; codecs=vp9' : 'video/webm');

    const recorder = new MediaRecorder(combinedStream, { mimeType, videoBitsPerSecond: 40000000 });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      document.body.classList.remove('clean-capture');
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(chunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const baseName = (location.pathname.split('/').pop() || 'kinet-metrics.html').replace('.html', '');
      a.download = `${baseName}_${targetFps}fps.${ext}`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      if (stream && stream.getTracks) stream.getTracks().forEach(t => t.stop());
      btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
      isRecording = false; setExportUiState(false);
      if (typeof tl !== 'undefined' && tl.play) tl.play();
    };

    if (typeof tl !== 'undefined' && tl.pause) {
      tl.pause(0);
      tl.play();
    }
    recorder.start(100);

    const durSeconds = typeof DURATION !== 'undefined' ? DURATION : (typeof DUR !== 'undefined' ? DUR : 8.0);
    setTimeout(() => {
      if (recorder.state === 'recording') recorder.stop();
    }, (durSeconds * 1000) + 400);

  } catch (err) {
    document.body.classList.remove('clean-capture');
    btnExportLabel.innerHTML = EXPORT_DEFAULT_HTML;
    isRecording = false; setExportUiState(false);
  }
}
</script>
