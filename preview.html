<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KinetRig Showroom — Ultra-HFR Motion Engine</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #12141c;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #00f0ff;
      --text: #f0f2f8;
      --text-dim: #8a8f9d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation */
    header {
      background: rgba(18, 20, 28, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }
    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(0, 240, 255, 0.12);
      color: var(--accent);
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    select, button {
      background: #1a1c26;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    select:hover, button:hover {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
    }
    button.active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border-color: var(--accent);
    }
    .preview-fps-item {
      background: transparent; border: none; color: var(--text);
      font-size: 12px; font-weight: 600; padding: 8px 10px; border-radius: 6px;
      text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      transition: all 0.15s ease; width: 100%; box-sizing: border-box;
    }
    .preview-fps-item:hover {
      background: rgba(0, 240, 255, 0.18); color: var(--accent); transform: translateX(2px);
    }

    /* Main Stage */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .stage-wrapper {
      position: relative;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Device Mockup Shells */
    .mockup-none iframe {
      width: 1280px;
      height: 720px;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }

    .mockup-laptop {
      width: 1100px;
      height: 680px;
      background: #181920;
      border-radius: 24px 24px 6px 6px;
      border: 3px solid #333644;
      padding: 24px 24px 10px 24px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.9);
      position: relative;
    }
    .mockup-laptop iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
    }
    .mockup-laptop::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: -4%;
      width: 108%;
      height: 16px;
      background: #2a2c38;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.9);
    }

    .mockup-phone {
      width: 400px;
      height: 820px;
      background: #111218;
      border-radius: 52px;
      border: 4px solid #2e3140;
      padding: 50px 16px 20px 16px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
      position: relative;
    }
    .mockup-phone iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 36px;
    }

    .mockup-browser {
      width: 1200px;
      height: 740px;
      background: #161722;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 35px 90px rgba(0,0,0,0.9);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .browser-header {
      height: 40px;
      background: #1c1e2b;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot-r { background: #ff5f56; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #27c93f; }
    .browser-url {
      flex: 1;
      max-width: 480px;
      margin-left: 16px;
      height: 24px;
      background: #11121a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: monospace;
    }
    .mockup-browser iframe {
      flex: 1;
      width: 100%;
      border: none;
    }

    /* Footer Telemetry */
    footer {
      background: #12141c;
      border-top: 1px solid var(--border);
      padding: 12px 24px;
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="assets/image/KinetRig%20Icon.png" alt="KinetRig">
      <h1>KinetRig Showroom</h1>
      <span class="badge">Ultra-HFR: Up to 240 FPS</span>
    </div>

    <div class="controls">
      <label style="font-size: 12px; color: var(--text-dim);">Preset:</label>
      <select id="presetSelect" onchange="changePreset(this.value)">
        <option value="assets/kinet-opener.html">1. Brand Opener (kinet-opener.html)</option>
        <option value="assets/kinet-flow.html">2. Continuous Flow (kinet-flow.html)</option>
        <option value="assets/kinet-collage.html">3. Paper & Print Collage (kinet-collage.html)</option>
        <option value="assets/kinet-editorial.html">4. Visual Editorial Dossier (kinet-editorial.html)</option>
        <option value="assets/kinet-catalog.html">5. Minimalist Studio Catalog (kinet-catalog.html)</option>
        <option value="assets/kinet-stage.html">6. Proscenium Theatre Stage (kinet-stage.html)</option>
        <option value="assets/kinet-engraving.html">7. Vintage Blueprint Sketch (kinet-engraving.html)</option>
        <option value="assets/kinet-metrics.html">8. Data & Dynamic Charts (kinet-metrics.html)</option>
        <option value="assets/kinet-showcase.html">9. 3D Product Showcase (kinet-showcase.html)</option>
        <option value="assets/kinet-dialogue.html">10. Diegetic Chat Simulation (kinet-dialogue.html)</option>
        <option value="assets/kinet-reel-hook.html">11. Viral Reel Hook (kinet-reel-hook.html)</option>
        <option value="assets/kinet-saas-macro.html">12. SaaS Macro 3D Tour (kinet-saas-macro.html)</option>
        <option value="assets/kinet-bento-grid.html">13. Modern Bento Grid (kinet-bento-grid.html)</option>
        <option value="assets/kinet-hud-scifi.html">14. Velocity Tunnel — Warp Kinetic Type (kinet-hud-scifi.html)</option>
        <option value="assets/kinet-split-tiktok.html">15. Split Screen Reaction (kinet-split-tiktok.html)</option>
        <option value="assets/kinet-ios-liquid-glass.html">16. iOS Spatial Liquid Glass & Orb (kinet-ios-liquid-glass.html)</option>
        <option value="assets/kinet-audio-visualizer.html">17. Radial Audio Visualizer (kinet-audio-visualizer.html)</option>
        <option value="assets/kinet-typographic-montage.html">18. Swiss Typographic Montage (kinet-typographic-montage.html)</option>
        <option value="assets/kinet-liquid-orb.html">19. 3D Refractive Glass Orb (kinet-liquid-orb.html)</option>
        <option value="assets/kinet-glitch-terminal.html">20. Decrypt Glitch Terminal (kinet-glitch-terminal.html)</option>
      </select>

      <label style="font-size: 12px; color: var(--text-dim); margin-left: 8px;">Frame:</label>
      <button class="active" onclick="setMockup('none', this)">None</button>
      <button onclick="setMockup('laptop', this)">Laptop</button>
      <button onclick="setMockup('phone', this)">Mobile</button>
      <button onclick="setMockup('browser', this)">Browser</button>

      <button style="border-color: var(--accent); color: var(--accent);" onclick="playSfx()">🔊 Test SFX</button>

      <div class="export-dropdown" style="position: relative; margin-left: 10px;">
        <button id="btnStudioExport" style="background:var(--accent);color:#000;font-weight:700;border:none;display:inline-flex;align-items:center;gap:6px;" onclick="togglePreviewFpsMenu(event)">
          <svg style="width:14px;height:14px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span id="btnExportLabel" style="display:inline-flex;align-items:center;gap:4px;">Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240</span>
          <svg style="width:10px;height:10px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="previewFpsMenu" style="display:none; position:absolute; top:calc(100% + 8px); right:0; background:rgba(18,20,28,0.96); border:1px solid var(--accent); border-radius:10px; backdrop-filter:blur(16px); box-shadow:0 10px 30px rgba(0,0,0,0.7); padding:6px; min-width:170px; z-index:150; flex-direction:column; gap:4px;">
          <div id="preview-fps-options-group">
            <div style="font-size: 10px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; padding: 4px 8px 6px; border-bottom: 1px solid var(--border);">Select Framerate</div>
            <button class="preview-fps-item" onclick="exportCurrentPreset(240)"><span>240 FPS (Studio)</span></button>
            <button class="preview-fps-item" onclick="exportCurrentPreset(144)"><span>144 FPS</span></button>
            <button class="preview-fps-item" onclick="exportCurrentPreset(120)"><span>120 FPS</span></button>
            <button class="preview-fps-item" onclick="exportCurrentPreset(60)"><span>60 FPS (Fast)</span></button>
          </div>
          <div id="preview-render-controls-group" style="display: none;">
            <div style="font-size: 10px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; padding: 4px 8px 6px; border-bottom: 1px solid var(--border);">Render Controls</div>
            <button class="preview-fps-item" id="btnPreviewPause" onclick="togglePreviewPause(event)">
              <svg id="iconPreviewPause" viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
              <svg id="iconPreviewResume" viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:currentColor;stroke-width:1;display:none;"><polygon points="6 4 20 12 6 20 6 4"/></svg>
              <span id="labelPreviewPause">Pause Render</span>
            </button>
            <button class="preview-fps-item danger" id="btnPreviewCancel" style="color: #f87171;" onclick="cancelPreviewRender(event)">
              <svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              <span>Cancel Render</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div id="stageContainer" class="stage-wrapper mockup-none">
      <iframe id="previewIframe" src="assets/kinet-opener.html" allow="display-capture *; autoplay *; camera *; microphone *; clipboard-write *" allowfullscreen></iframe>
    </div>
  </main>

  <footer>
    <span>Zero-dependency 144–240 FPS kinetic motion graphics & video engine.</span>
    <span>Source: <a href="https://github.com/Reff33/KinetRig" target="_blank" style="color: var(--accent); text-decoration: none;">github.com/Reff33/KinetRig</a></span>
  </footer>

  <script>
    const iframe = document.getElementById('previewIframe');
    const container = document.getElementById('stageContainer');

    function unlockChildAudio() {
      try {
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage('UNLOCK_AUDIO', '*');
        }
      } catch (e) {}
    }

    window.addEventListener('click', unlockChildAudio);

    function changePreset(path) {
      iframe.src = path;
      const browserUrl = container.querySelector('.browser-url');
      if (browserUrl) {
        browserUrl.textContent = `https://kinetrig.dev/${path.split('/').pop()}`;
      }
      iframe.onload = () => {
        setTimeout(unlockChildAudio, 120);
      };
    }

    function setMockup(type, btn) {
      unlockChildAudio();
      document.querySelectorAll('.controls button').forEach(b => {
        if (b.innerText !== '🔊 Test SFX') b.classList.remove('active');
      });
      btn.classList.add('active');

      container.className = 'stage-wrapper mockup-' + type;
      if (type === 'browser') {
        if (!container.querySelector('.browser-header')) {
          const header = document.createElement('div');
          header.className = 'browser-header';
          header.innerHTML = `
            <div class="dot dot-r"></div>
            <div class="dot dot-y"></div>
            <div class="dot dot-g"></div>
            <div class="browser-url">https://kinetrig.dev/${document.getElementById('presetSelect').value.split('/').pop()}</div>
          `;
          container.prepend(header);
        }
      } else {
        const header = container.querySelector('.browser-header');
        if (header) header.remove();
      }
    }

    function togglePreviewFpsMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('previewFpsMenu');
      if (menu) menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('previewFpsMenu');
      const btn = document.getElementById('btnStudioExport');
      if (menu && !menu.contains(e.target) && e.target !== btn) {
        menu.style.display = 'none';
      }
    });

    let isPreviewExporting = false;
    let isPreviewPaused = false;
    let currentPreviewAbortController = null;
    let currentPreviewEvtSource = null;

    function setPreviewExportUiState(exporting) {
      isPreviewExporting = exporting;
      const optsGroup = document.getElementById('preview-fps-options-group');
      const ctrlGroup = document.getElementById('preview-render-controls-group');
      if (optsGroup && ctrlGroup) {
        optsGroup.style.display = exporting ? 'none' : 'block';
        ctrlGroup.style.display = exporting ? 'block' : 'none';
      }
      if (!exporting) {
        isPreviewPaused = false;
        updatePreviewPauseUi(false);
      }
    }

    function updatePreviewPauseUi(paused) {
      const lbl = document.getElementById('labelPreviewPause');
      const iconP = document.getElementById('iconPreviewPause');
      const iconR = document.getElementById('iconPreviewResume');
      if (lbl) lbl.textContent = paused ? 'Resume Render' : 'Pause Render';
      if (iconP) iconP.style.display = paused ? 'none' : 'inline-block';
      if (iconR) iconR.style.display = paused ? 'inline-block' : 'none';
    }

    async function togglePreviewPause(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById('previewFpsMenu');
      if (menu) menu.style.display = 'none';
      if (!isPreviewExporting) return;
      const label = document.getElementById('btnExportLabel');
      try {
        if (!isPreviewPaused) {
          await fetch('http://127.0.0.1:4004/api/pause');
          isPreviewPaused = true;
          updatePreviewPauseUi(true);
          if (label) label.textContent = label.textContent.replace('Rendering', 'Paused');
        } else {
          await fetch('http://127.0.0.1:4004/api/resume');
          isPreviewPaused = false;
          updatePreviewPauseUi(false);
          if (label) label.textContent = label.textContent.replace('Paused', 'Rendering');
        }
      } catch (err) {
        console.warn('[Preview Pause Error]', err);
      }
    }

    async function cancelPreviewRender(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById('previewFpsMenu');
      if (menu) menu.style.display = 'none';
      if (!isPreviewExporting) return;
      try {
        await fetch('http://127.0.0.1:4004/api/cancel');
      } catch {}
      if (currentPreviewEvtSource) {
        currentPreviewEvtSource.close();
        currentPreviewEvtSource = null;
      }
      if (currentPreviewAbortController) {
        currentPreviewAbortController.abort();
        currentPreviewAbortController = null;
      }
      const label = document.getElementById('btnExportLabel');
      const EXPORT_DEFAULT_HTML = 'Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240';
      if (label) label.textContent = 'Cancelled';
      setTimeout(() => {
        if (label) label.innerHTML = EXPORT_DEFAULT_HTML;
        setPreviewExportUiState(false);
      }, 1500);
    }

    async function exportCurrentPreset(fps = 240) {
      if (isPreviewExporting) return;
      const menu = document.getElementById('previewFpsMenu');
      if (menu) menu.style.display = 'none';

      const btn = document.getElementById('btnStudioExport');
      const label = document.getElementById('btnExportLabel');
      const presetPath = document.getElementById('presetSelect').value;
      const baseName = presetPath.split('/').pop().replace('.html', '');

      // Check if studio bridge server is running
      const isStudio = (typeof location !== 'undefined') && (
        location.port === '4004' ||
        location.host.includes('4004')
      );

      let isBridgeOnline = false;
      if (isStudio) {
        try {
          const ping = await fetch('/api/health', { signal: AbortSignal.timeout(600) });
          if (ping.ok) isBridgeOnline = true;
        } catch {}
      }

      if (!isBridgeOnline) {
        alert("KinetRig Studio Bridge is offline.\n\nTo download true deterministic 240 FPS MP4 video directly through the browser, run in your terminal:\n\nnode scripts/server.mjs\n\nThen open: http://127.0.0.1:4004\n\n(The server runs 100% locally on your machine with 0 cost)");
        return;
      }

      setPreviewExportUiState(true);
      currentPreviewAbortController = new AbortController();
      label.textContent = `Connecting Studio...`;

      try {
        currentPreviewEvtSource = new EventSource('http://127.0.0.1:4004/api/progress');
        currentPreviewEvtSource.onmessage = e => {
          try {
            const data = JSON.parse(e.data);
            if (data.status === 'rendering' && !isPreviewPaused) {
              label.textContent = `Rendering: ${data.percent || 0}% (${fps} FPS)`;
            } else if (data.status === 'paused') {
              label.textContent = `Paused: ${data.percent || 0}% (${fps} FPS)`;
            }
          } catch {}
        };
      } catch {}

      try {
        const res = await fetch(`http://127.0.0.1:4004/api/render?template=${encodeURIComponent(presetPath)}&fps=${fps}`, {
          signal: currentPreviewAbortController.signal
        });
        if (currentPreviewEvtSource) {
          currentPreviewEvtSource.close();
          currentPreviewEvtSource = null;
        }
        if (!res.ok) throw new Error(await res.text());

        label.textContent = 'Saving MP4...';
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${baseName}_${fps}fps.mp4`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        const EXPORT_DEFAULT_HTML = 'Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240';
        label.textContent = 'Downloaded!';
        setTimeout(() => {
          label.innerHTML = EXPORT_DEFAULT_HTML;
          setPreviewExportUiState(false);
        }, 2000);
      } catch (err) {
        if (err.name === 'AbortError') return;
        const EXPORT_DEFAULT_HTML = 'Download <svg style="width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none;" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg> 240';
        if (currentPreviewEvtSource) {
          currentPreviewEvtSource.close();
          currentPreviewEvtSource = null;
        }
        alert(`Export failed: ${err.message}`);
        label.innerHTML = EXPORT_DEFAULT_HTML;
        setPreviewExportUiState(false);
      }
    }

    // Studio SFX-Kit + Procedural Web Audio API Synthesizer
    let audioCtx = null;
    let studioTestBuffer = null;

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    async function preloadTestSfx() {
      const isHttp = typeof location !== 'undefined' && location.protocol ? location.protocol.startsWith('http') : false;
      if (!isHttp && typeof navigator !== 'undefined' && navigator.onLine === false) return;
      const tryUrls = isHttp
        ? [
            'sfx/sounds/impacts/impact-deep-soft.wav',
            '../sfx/sounds/impacts/impact-deep-soft.wav',
            'https://cdn.jsdelivr.net/gh/wyzowl/sfx-kit@main/sounds/impacts/impact-deep-soft.wav'
          ]
        : ['https://cdn.jsdelivr.net/gh/wyzowl/sfx-kit@main/sounds/impacts/impact-deep-soft.wav'];
      for (const u of tryUrls) {
        try {
          const r = await fetch(u);
          if (r.ok) {
            const ab = await r.arrayBuffer();
            const ctx = getAudioContext();
            studioTestBuffer = await ctx.decodeAudioData(ab);
            break;
          }
        } catch (e) {}
      }
    }
    window.addEventListener('click', () => { getAudioContext(); preloadTestSfx(); }, { once: true });

    function playSfx() {
      const ctx = getAudioContext();
      unlockChildAudio();

      if (studioTestBuffer) {
        const src = ctx.createBufferSource();
        src.buffer = studioTestBuffer;
        const gain = ctx.createGain();
        gain.gain.value = 0.85;
        src.connect(gain);
        gain.connect(ctx.destination);
        src.start();
        return;
      }

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.35);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(0.35, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.38);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.4);

      const sheen = ctx.createOscillator();
      const sheenGain = ctx.createGain();
      sheen.type = 'sine';
      sheen.frequency.setValueAtTime(520, now);
      sheen.frequency.exponentialRampToValueAtTime(320, now + 0.12);

      sheenGain.gain.setValueAtTime(0.0001, now);
      sheenGain.gain.linearRampToValueAtTime(0.08, now + 0.008);
      sheenGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);

      sheen.connect(sheenGain);
      sheenGain.connect(ctx.destination);
      sheen.start(now);
      sheen.stop(now + 0.16);
    }
